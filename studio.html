// ═══════════════════════════════════════════════════════════════════
// SESSION CLEANUP
// Order matters: Worker first (stops sending messages), then rAF
// (stops the seek loop), then player (stops audio), then URL revoke.
// Reversing this order can cause rAF to reference a null player.
// ═══════════════════════════════════════════════════════════════════
function cleanupSession() {
    if (state.activeWorker) { state.activeWorker.terminate(); state.activeWorker = null; }
    if (state.rafId)        { cancelAnimationFrame(state.rafId); state.rafId = null; }
    if (state.player)       { state.player.pause(); state.player.src = ''; state.player = null; }
    if (state.playerUrl)    { URL.revokeObjectURL(state.playerUrl); state.playerUrl = null; }
    // Clear iframe src to stop any running FIZX visualizer
    // inside the preview then revoke the blob URL to free memory.
    previewFrame.src = 'about:blank';
    if (state.previewBlobUrl) { URL.revokeObjectURL(state.previewBlobUrl); state.previewBlobUrl = null; }
    previewWrap.classList.remove('visible');
    state.active = false; state.index = 0; state.results = []; state.beats = []; state.lyrics = []; state.bpm = 0;
    progressFill.style.width = '0%';
    seekFill.style.width = '0%';
    pbPlay.textContent = '▶';
}

// ═══════════════════════════════════════════════════════════════════
// TIME LOOP
// ═══════════════════════════════════════════════════════════════════
function startTimeLoop() {
    (function tick() {
        if (!state.player) return;
        const t   = state.player.currentTime;
        const dur = state.player.duration || 1;
        const pct = (t / dur) * 100;
        seekFill.style.width = pct + '%';
        const m  = Math.floor(t / 60);
        const s  = String(Math.floor(t % 60)).padStart(2, '0');
        const dm = Math.floor(dur / 60);
        const ds = String(Math.floor(dur % 60)).padStart(2, '0');
        timeDisplay.textContent = `${m}:${s} / ${dm}:${ds}`;
        state.rafId = requestAnimationFrame(tick);
    })();
}

function updateProgress() {
    if (state.lyrics.length > 0)
        progressFill.style.width = `${(state.index / state.lyrics.length) * 100}%`;
}

// ═══════════════════════════════════════════════════════════════════
// PLAYBACK CONTROLS
// ═══════════════════════════════════════════════════════════════════
pbPlay.addEventListener('click', () => {
    if (!state.player) return;
    if (state.player.paused) {
        state.player.play();
        state.active = true;
        pbPlay.textContent = '⏸';
        if (!state.rafId) startTimeLoop();
    } else {
        state.player.pause();
        state.active = false;
        pbPlay.textContent = '▶';
    }
});

pbStop.addEventListener('click', () => {
    if (!state.player) return;
    state.player.pause();
    state.player.currentTime = 0;
    state.active = false;
    pbPlay.textContent = '▶';
});

// Seek by clicking the seek track — maps click X to audio position
seekTrack.addEventListener('click', (e) => {
    if (!state.player || !state.player.duration) return;
    const rect = seekTrack.getBoundingClientRect();
    const pct  = (e.clientX - rect.left) / rect.width;
    state.player.currentTime = pct * state.player.duration;
});

// Immediately Invoked Function Expression (IIFE)
// ( ... )();
// Defines and immediately executes the function 
// in one step when the script loads. It's a 
// self-contained initialization block that doesn't 
// pollute the global scope with temporary variables.
// Although it is named but not usable elsewhere.
// Also works (arrow function)
// (() => { ... })();
// Also works (no name)
// (function() { ... })();
(function initEngineSelector() {
    eSelector.innerHTML = ENGINE_REGISTRY.map((e, i) => `
        <div class="mode-option">
            <input type="radio" name="engine"
                id="engine-${e.id}" value="${e.id}"
                ${i === 0 ? 'checked' : ''}>
            <label for="engine-${e.id}">
                <span class="mode-title">${e.label}</span>
                <span class="mode-desc">${PARAM_SPECS[e.id]?.desc ?? ''}</span>
            </label>
        </div>`).join('');

    // Re-attach change listeners after innerHTML replacement
    eSelector.querySelectorAll('input[type="radio"]').forEach(r =>
        r.addEventListener('change', updateParamVisibility)
    );
})();

(function initParamPanels() {
    // Render all panels in both setup and session
    // driven by registry, generates all containers dynamically 
    // So HTML containers don't need to exist in advance
    ENGINE_REGISTRY.forEach(e => {
        const specs = resolveParams(e.id);

        // Setup panel
        const setupEl = document.createElement('div');
        setupEl.id        = `params-${e.id}`;
        setupEl.className = 'param-panel';
        setupParent.appendChild(setupEl);
        renderParamPanel(setupEl, specs, `${e.id}-setup`);

        // Session panel
        const sessionEl = document.createElement('div');
        sessionEl.id        = `session-params-${e.id}`;
        sessionEl.className = 'param-panel';
        sessionParent.appendChild(sessionEl);
        renderParamPanel(sessionEl, specs, `${e.id}-session`);
    });
    // Set initial visibility
    updateParamVisibility();
})();

// update all matching PARAM elements at once
window.addEventListener('paramSync', (e) => {
    const { id, value, origin } = e.detail;

    // Find everything linked to this paramId
    document.querySelectorAll(`[data-param-id="${id}"]`).forEach(el => { // UI elements decoupled, they just need to know their own data-param-id
        if (el === origin) return; // Don't fight the user's current input

        if (el.type === 'range') {
            el.value = value;
        } else if (el.type === 'radio') {
            if (el.value === value) el.checked = true;
        }
    });

    // Sync all text value labels (param-value spans)
    // find the format function from the first spec we find in PARAM_SPECS
    const spec = Object.values(PARAM_SPECS).flatMap(p => p.params || []).find(s => s.id === id);
    if (spec && spec.fmt) {
        document.querySelectorAll(`[data-val-for="${id}"]`).forEach(valEl => {
            valEl.textContent = spec.fmt(parseFloat(value));
        });
    }
});

// SNAP ENGINE VISIBILITY
// Show the engine sub-row only when snap mode is selected.
// Reduces cognitive load for users who just want manual tapping.
document.querySelectorAll('input[name="mode"]').forEach(radio => {
    radio.addEventListener('change', () => {
        engineRow.classList.toggle('visible', document.getElementById('mode-snap').checked);
        updateParamVisibility();
    });
});

// Engine toggle
document.querySelectorAll('input[name="engine"]').forEach(radio => {
    radio.addEventListener('change', updateParamVisibility);
});

// Session params collapsible toggle
document.getElementById('session-params-toggle').addEventListener('click', function() {
    this.classList.toggle('open');
    document.getElementById('session-params-body').classList.toggle('open');
});


// ═══════════════════════════════════════════════════════════════════
// START SESSION
// ═══════════════════════════════════════════════════════════════════
function onProgress(pct, label) {
    analysisBar.style.width = pct + '%';
    analysisSub.textContent = label; // sub-label, not the main label
}

startBtn.addEventListener('click', async () => {
    if (!state.audioFile) { toast('Drop an audio file first'); return; }

    state.lyrics = lyricsInput.value.split('\n').filter(l => l.trim());
    state.mode   = document.querySelector('input[name="mode"]:checked').value;
    state.engine = document.querySelector('input[name="engine"]:checked')?.value || 'spectral';
    startBtn.textContent = '⏳ STARTING…';
    startBtn.disabled    = true;

    try {
        if (state.mode === 'snap') {
            showOverlay(state.engine);

            // engine is now passed inside the 
            // Worker payload, no main-thread dispatch needed
            const result = await extractRadix(state.audioFile, onProgress);
            
            state.beats = result.onsets;
            state.bpm   = result.bpm;
            analysisOverlay.classList.remove('visible');

            if (!state.beats.length) {
                toast('No onsets detected — switching to manual mode');
                state.mode = 'buffer';
            }
        }

        // Build audio player — store URL separately for reliable revoke later
        state.playerUrl = URL.createObjectURL(state.audioFile);
        state.player    = new Audio(state.playerUrl);
        state.results   = [];
        state.index     = 0;

        totalLinesSpan.textContent  = state.lyrics.length || '∞';
        lineCounterSpan.textContent = '0';
        bpmDisplay.textContent      = state.bpm > 0 ? `${state.bpm} BPM` : 'BPM —';
        // Enable auto-assign now that beats are available
        document.getElementById('auto-assign-btn').disabled = false;
        currLine.textContent        = state.lyrics.length > 0
            ? state.lyrics[0]
            : '⌁ NO LYRICS — TAPS MARK BEATS';

        setupView.style.display   = 'none';
        sessionView.style.display = 'block';
        outputView.style.display  = 'none';
        pbPlay.textContent        = '⏸';
        updateParamVisibility(); // syncs session-params panel visibility with current mode/engine

        await state.player.play();
        state.active = true;
        startTimeLoop();
        updateProgress();

    } catch (err) {
        analysisOverlay.classList.remove('visible');
        console.error('Setup failed:', err);
        toast('Setup failed: ' + (err.message || err));
        startBtn.textContent = 'START SESSION';
        startBtn.disabled    = false;
    }
});

// ═══════════════════════════════════════════════════════════════════
// SPACEBAR TAP
// Runs regardless of whether audio is playing (active flag allows
// tapping while paused, useful for careful re-tapping).
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('keydown', (e) => {
    // Guard: only handle space when session view is visible
    if (e.code !== 'Space' || !state.player || sessionView.style.display === 'none') return;
    e.preventDefault();

    let t = state.player.currentTime;
    if      (state.mode === 'buffer')                        t = Math.max(0, t - 0.2);
    else if (state.mode === 'snap' && state.beats.length)    t = state.beats.reduce((p,c) => Math.abs(c-t) < Math.abs(p-t) ? c : p);

    state.results.push({
        text:  state.lyrics[state.index] || `beat_${state.index + 1}`,
        start: parseFloat(t.toFixed(3)),
        end:   parseFloat((t + 1).toFixed(3)),
    });

    state.index++;
    lineCounterSpan.textContent = state.index;
    updateProgress();

    const overflow = (state.index - state.lyrics.length) + 1;

    if (overflow > 0) {
        currLine.textContent = `✓ ALL LYRICS + ${overflow} BEATS MARKED`;
        // Keep player running so user can review timing before finishing
    } else {
        currLine.textContent = state.lyrics.length > 0
            ? state.lyrics[state.index]
            : `⌁ ${state.index} BEATS MARKED`;
    }
});

// ═══════════════════════════════════════════════════════════════════
// AUTO-ASSIGN
// Maps state.lyrics[i] directly to state.beats[i] without tapping.
// End timestamp uses beats[i+1] when available; falls back to
// start + median inter-beat interval so the last line isn't zero-length.
//
// Works best with the Energy engine on vocal-prominent tracks where
// amplitude attacks align with lyric delivery. On dense mixes the
// mapping degrades gracefully — wrong assignments are correctable in
// the preview editor without re-tapping the whole session.
//
// Overwrites state.results entirely — previous taps are discarded.
// Re-tapping remains available at any point after.
// ═══════════════════════════════════════════════════════════════════
function autoAssignLyrics() {
    if (!state.beats.length)  { toast('Run beat extraction first'); return; }
    if (!state.lyrics.length) { toast('No lyrics to assign'); return; }

    // Median inter-beat interval as fallback end-time for the last line.
    // Median beats mean so a single long outro gap doesn't inflate the estimate.
    const intervals = [];
    for (let i = 1; i < state.beats.length; i++)
        intervals.push(state.beats[i] - state.beats[i - 1]);
    const sorted = [...intervals].sort((a, b) => a - b);
    const medianInterval = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 1.0;

    state.results = state.lyrics.map((text, i) => {
        const start = parseFloat((state.beats[i] ?? state.beats[state.beats.length - 1]).toFixed(3));
        const end   = parseFloat((state.beats[i + 1] ?? start + medianInterval).toFixed(3));
        return { text, start, end };
    });

    state.index = state.results.length;
    lineCounterSpan.textContent = state.index;
    updateProgress();

    // When there are more lyrics than beats the overflow lines 
    // share the last onset with a visible warning in the toast 
    // and the stage display
    const overflow = state.lyrics.length - state.beats.length;
    const note     = overflow > 0 ? ` (${overflow} lines share last beat — trim in editor)` : '';
    currLine.textContent = `⚡ AUTO-ASSIGNED ${state.results.length} LINES${note ? ' ⚠' : ''}`;
    toast(`⚡ ${state.results.length} lines assigned${note}`);

    // Sync editor and refresh iframe if preview is already open
    renderPreviewEditor();
    if (previewWrap.classList.contains('visible')) refreshPreviewIframe();
}

document.getElementById('auto-assign-btn').addEventListener('click', autoAssignLyrics);

// ═══════════════════════════════════════════════════════════════════
// PREVIEW — floating panel, draggable + resizable
// Builds a fizx_compiled.html string from current tap state and injects
// it into the sandboxed iframe. Works with zero spacebar taps (renders
// the visualizer without any lyrics).
//
// The preview reuses buildFizxHtml() — the same function used by the
// generate button — so what you preview is exactly what you export.
//
// WHY BLOB URL INSTEAD OF srcdoc:
// srcdoc="<html>...<script>...<\/script>...</html>" is parsed by the
// browser's HTML parser as an attribute value. The parser terminates
// any <script> block at the first literal <\/script> it encounters in
// the attribute, even when that token appears inside a JS string
// inside the script. The compiled FIZX template contains <\/script>
// inside its own script block (e.g. in template literal content),
// which causes the iframe to stop executing mid-JS, silently.
//
// logic: create a Blob URL and set iframe.src. The browser fetches the
// blob as a standalone HTML document with a fresh parser — no
// attribute-value context, no premature <\/script> termination.
// The sandbox attribute still applies; the blob origin is null.
// ═══════════════════════════════════════════════════════════════════
function buildFizxHtml() {
    const lyricsRaw = JSON.stringify(state.results);
    const beatsRaw  = JSON.stringify(state.beats);
    return FIZX_TEMPLATE
        .replace(/\[\[LYRICS_DATA\]\]/g, lyricsRaw)
        .replace(/\[\[BEATS_DATA\]\]/g,  beatsRaw)
        .replace(/\[\[BPM_DATA\]\]/g,    String(state.bpm || 0));
}

// Revokes stale blob URL, creates new one, sets src.
function refreshPreviewIframe() {
    // Always revoke before creating — accumulating blob URLs leaks memory
    if (state.previewBlobUrl) {
        URL.revokeObjectURL(state.previewBlobUrl);
        state.previewBlobUrl = null;
    }
    state.previewBlobUrl = URL.createObjectURL(new Blob([buildFizxHtml()], { type: 'text/html' }));
    previewFrame.src = state.previewBlobUrl;
}

// Preview editor, rebuilds timing rows from state.results.
// Full re-render on every structural change (add/delete).
// Acceptable for expected sizes (<300 lines); avoids index-offset bugs
// that event delegation on a mutable list would introduce.
function renderPreviewEditor() {
    const editor = document.getElementById('preview-editor');
    const empty  = document.getElementById('preview-editor-empty');
    editor.querySelectorAll('.edit-row').forEach(r => r.remove());

    if (!state.results.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    state.results.forEach((result, i) => {
        const row = document.createElement('div');
        row.className = 'edit-row';
        row.innerHTML = `
            <input type="text"   class="edit-text"  value="${result.text.replace(/"/g, '&quot;')}" title="Lyric text">
            <input type="number" class="edit-start" value="${result.start}" step="0.001" min="0" title="Start (s)">
            <input type="number" class="edit-end"   value="${result.end}"   step="0.001" min="0" title="End (s)">
            <button class="edit-row-del" title="Delete">×</button>`;

        // Inputs write directly to state.results[i] — Refresh picks up changes
        row.querySelector('.edit-text').addEventListener('input',  e => { state.results[i].text  = e.target.value; });
        row.querySelector('.edit-start').addEventListener('input', e => { state.results[i].start = parseFloat(parseFloat(e.target.value).toFixed(3)) || 0; });
        row.querySelector('.edit-end').addEventListener('input',   e => { state.results[i].end   = parseFloat(parseFloat(e.target.value).toFixed(3)) || 0; });

        // Delete: splice + full re-render to fix closure indices
        row.querySelector('.edit-row-del').addEventListener('click', () => {
            state.results.splice(i, 1);
            state.index = Math.min(state.index, state.results.length);
            lineCounterSpan.textContent = state.index;
            renderPreviewEditor();
        });

        editor.appendChild(row);
    });
}

// Add blank line at current playback position for missed taps
document.getElementById('preview-add-btn').addEventListener('click', () => {
    const t = state.player ? parseFloat(state.player.currentTime.toFixed(3)) : 0;
    state.results.push({ text: '', start: t, end: parseFloat((t + 1).toFixed(3)) });
    state.index = state.results.length;
    lineCounterSpan.textContent = state.index;
    renderPreviewEditor();
    const editor = document.getElementById('preview-editor');
    editor.scrollTop = editor.scrollHeight;
});

// Show / refresh / close
function showPreview() {
    renderPreviewEditor();
    refreshPreviewIframe();
    previewWrap.classList.add('visible');
}

document.getElementById('preview-btn').addEventListener('click', showPreview);

// Deliberate choice not to auto-refresh the iframe on every keystroke. 
// The iframe navigation itself has a small cost and more importantly 
// would reset the FIZX animation state mid-edit. The user clicks Refresh
// when they want to see the result. This also makes it clear that the
// iframe is a render of the saved state, not a live binding.
document.getElementById('preview-refresh-btn').addEventListener('click', () => {
    refreshPreviewIframe();
    toast('Preview refreshed');
});

document.getElementById('close-preview-btn').addEventListener('click', () => {
    previewFrame.src = 'about:blank'; // halts iframe JS immediately
    if (state.previewBlobUrl) { URL.revokeObjectURL(state.previewBlobUrl); state.previewBlobUrl = null; }
    previewWrap.classList.remove('visible');
});

// Drag (titlebar)
// Pointer offset from panel corner tracked at drag-start so the panel
// doesn't jump to cursor. Listeners on document catch fast moves that
// leave the titlebar during drag.
;(function initPreviewDrag() {
    const titlebar = document.getElementById('preview-titlebar');
    let dragging = false, ox = 0, oy = 0;

    function startDrag(cx, cy) {
        dragging = true;
        const r = previewWrap.getBoundingClientRect();
        ox = cx - r.left; oy = cy - r.top;
        document.addEventListener('mousemove', onMouse);
        document.addEventListener('mouseup', stop);
        document.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('touchend', stop);
    }
    function onMouse(e) { if (dragging) move(e.clientX, e.clientY); }
    function onTouch(e) { if (dragging) move(e.touches[0].clientX, e.touches[0].clientY); }
    function move(cx, cy) {
        const w = previewWrap.offsetWidth, h = previewWrap.offsetHeight;
        const x = Math.max(0, Math.min(window.innerWidth  - w, cx - ox));
        const y = Math.max(0, Math.min(window.innerHeight - h, cy - oy));
        previewWrap.style.left  = x + 'px';
        previewWrap.style.top   = y + 'px';
        previewWrap.style.right = 'auto'; // clear initial CSS right:24px
    }
    function stop() {
        dragging = false;
        document.removeEventListener('mousemove', onMouse);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchmove', onTouch);
        document.removeEventListener('touchend', stop);
    }

    titlebar.addEventListener('mousedown',  e => startDrag(e.clientX, e.clientY));
    titlebar.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
})();

// Resize (corner handle)
// Tracks delta from resize-start dimensions. Min size enforced to keep
// editor and iframe usable (260×300).
;(function initPreviewResize() {
    const handle = document.getElementById('preview-resize');
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;

    function startResize(cx, cy) {
        resizing = true;
        sx = cx; sy = cy;
        sw = previewWrap.offsetWidth; sh = previewWrap.offsetHeight;
        document.addEventListener('mousemove', onMouse);
        document.addEventListener('mouseup', stop);
        document.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('touchend', stop);
    }
    function onMouse(e) { if (resizing) resize(e.clientX, e.clientY); }
    function onTouch(e) { if (resizing) resize(e.touches[0].clientX, e.touches[0].clientY); }
    function resize(cx, cy) {
        previewWrap.style.width  = Math.max(260, sw + cx - sx) + 'px';
        previewWrap.style.height = Math.max(300, sh + cy - sy) + 'px';
    }
    function stop() {
        resizing = false;
        document.removeEventListener('mousemove', onMouse);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchmove', onTouch);
        document.removeEventListener('touchend', stop);
    }

    handle.addEventListener('mousedown',  e => startResize(e.clientX, e.clientY));
    handle.addEventListener('touchstart', e => startResize(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
})();

// ═══════════════════════════════════════════════════════════════════
// FINISH
// Empty results produce an empty LYRICS array.
// This is intentional: users may want to export beats-only
// or just test the template without any lyric timestamps.
// ═══════════════════════════════════════════════════════════════════
finishBtn.addEventListener('click', () => {
    if (state.player) state.player.pause();
    if (state.rafId)  { cancelAnimationFrame(state.rafId); state.rafId = null; }
    pbPlay.textContent = '▶';

    // Serialise export data — results may be empty array, which is valid
    state.beatsJson = JSON.stringify(state.beats, null, 2);
    state.lyricsJs  = 'export const LYRICS = ' + JSON.stringify(state.results, null, 2) + ';';
    state.beatsRaw  = JSON.stringify(state.beats);
    state.lyricsRaw = JSON.stringify(state.results);

    const tapNote = state.results.length === 0 ? ' (no taps)' : '';
    exportSummary.textContent = `${state.results.length} lines${tapNote} · ${state.beats.length} onsets · ${state.bpm || '—'} BPM`;

    sessionView.style.display = 'none';
    outputView.style.display  = 'block';
});

// ═══════════════════════════════════════════════════════════════════
// CANCEL
// ═══════════════════════════════════════════════════════════════════
cancelBtn.addEventListener('click', () => {
    cleanupSession();
    analysisOverlay.classList.remove('visible');
    setupView.style.display   = 'block';
    sessionView.style.display = 'none';
    outputView.style.display  = 'none';
    startBtn.disabled    = false;
    startBtn.textContent = 'START SESSION';
});

// ═══════════════════════════════════════════════════════════════════
// RE-ANALYZE
// Re-runs beat extraction with the current PARAMS without resetting
// taps, player position, or lyrics. state.beats and state.bpm are
// updated in place. Preview picks up the new beats on next open
// because buildFizxHtml() reads state.beats at call time, not at
// session start.
// ═══════════════════════════════════════════════════════════════════
document.getElementById('reanalyze-btn').addEventListener('click', async () => {
    if (!state.audioFile || state.mode !== 'snap') {
        toast('Re-analyze not available in manual mode');
        return;
    }
    const btn = document.getElementById('reanalyze-btn');
    btn.disabled    = true;
    btn.textContent = '↺ ANALYZING…';
    // Read engine selection fresh — user may have changed it since session start
    state.engine = document.querySelector('input[name="engine"]:checked')?.value || 'spectral';

    showOverlay(state.engine);

    try {
        const result = await extractRadix(state.audioFile, onProgress);
        state.beats = result.onsets;
        state.bpm   = result.bpm;
        bpmDisplay.textContent = state.bpm > 0 ? `${state.bpm} BPM` : 'BPM —';
        toast(`↺ ${state.beats.length} onsets · ${state.bpm} BPM`);
    } catch (err) {
        console.error('Re-analyze failed:', err);
        toast('Re-analyze failed: ' + (err.message || err));
    } finally {
        analysisOverlay.classList.remove('visible');
        btn.disabled    = false;
        btn.textContent = '↺ RE-ANALYZE';
    }
});

// ═══════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════
document.getElementById('generate-fizx-btn').addEventListener('click', () => {
    download('fizx_compiled.html', buildFizxHtml());
});

document.getElementById('download-beats-btn').addEventListener('click', () =>
    // beats.json includes bpm so it matches ex_beats.py output format exactly
    download('beats_tapper.json', JSON.stringify({ beats: state.beats, bpm: state.bpm }, null, 2))
);
document.getElementById('download-lyrics-btn').addEventListener('click', () =>
    download('lyrics_tapper.js', state.lyricsJs)
);
document.getElementById('copy-beats-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(state.beatsRaw); toast('⎘ Beats copied');
});
document.getElementById('copy-lyrics-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(state.lyricsRaw); toast('⎘ Lyrics copied');
});
document.getElementById('new-session-btn').addEventListener('click', () => {
    cleanupSession();
    setupView.style.display = 'block'; 
    sessionView.style.display = 'none'; 
    outputView.style.display = 'none';
    startBtn.disabled = false; 
    startBtn.textContent = 'START SESSION';
    lyricsInput.value = '';
    dropZone.innerHTML = 'DROP AUDIO FILE<div class="dz-hint">MP3 · WAV · OGG · FLAC</div>';
    fileInput.value = '';  // Without it, re-selecting the same file fires no change event
    dropZone.classList.remove('loaded');
    state.audioFile = null; state.beats = []; state.lyrics = []; state.bpm = 0;
});
document.getElementById('cnt-session-btn').addEventListener('click', () => {
    // Restore session view — player already exists, just resume UI state.
    // Does not restart analysis or reset taps.
    outputView.style.display = 'none';
    sessionView.style.display = 'block'; 
    // Restart seek loop (was stopped by finishBtn handler)
    if (state.player && !state.rafId) startTimeLoop();
    // Restore play button icon to match actual player state
    pbPlay.textContent = state.player && !state.player.paused ? '⏸' : '▶';
    // Re-sync session-params visibility in case engine changed in output view
    updateParamVisibility();
    // Restore active flag if there are lyrics remaining to tap
    if (state.player && state.index < state.lyrics.length) state.active = true;
});

// download() creates and immediately revokes the blob URL to avoid memory leaks
function download(filename, content) {
    const url = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    a.click();
    // 100ms delay gives the browser time to initiate the download before revoke
    setTimeout(() => URL.revokeObjectURL(url), 100);
}

// ═══════════════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════════════
function setAudioFile(file) {
    if (!file || !file.type.startsWith('audio/')) { toast('Drop an audio file (MP3, WAV, OGG, FLAC)'); return; }
    state.audioFile = file;
    dropZone.innerHTML = `${file.name}<div class="dz-hint">${(file.size/1048576).toFixed(1)} MB</div>`;
    dropZone.classList.add('loaded');
}

dropZone.addEventListener('click',     () => fileInput.click());
dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop',      (e) => { e.preventDefault(); dropZone.classList.remove('hover'); setAudioFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change',   (e) => setAudioFile(e.target.files[0]));
</script>
