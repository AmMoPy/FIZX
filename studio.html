<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZX STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"> <!--d2b48ca1 -->
    <style>
        :root {
            --bg:           #1c1b19; 
            --surface:      #1a1815;
            --surface-2:    #24221f;
            --text:         #e6ddd0; 
            --text-dim:     #7a7062;
            --accent:       #e0a96d; 
            --accent-dim:   rgba(224, 169, 109, 0.12);
            --accent-glow:  rgba(224, 169, 109, 0.25);
            --border-accent:rgba(224, 169, 109, 0.35);
            --border:       rgba(255, 255, 255, 0.04);
            --mono: 'Space Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background-image: repeating-linear-gradient(
                0deg,
                transparent, transparent 2px,
                rgba(0,255,136,0.008) 2px, rgba(0,255,136,0.008) 4px
            );
        }

        .container { max-width: 780px; width: 100%; }

        /* ── Header ──────────────────────────────────────────────── */
        .header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 40px; }
        .header h1 {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .header-sub { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.1em; }
        .header-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--border-accent), transparent); }

        /* ── Panels ──────────────────────────────────────────────── */
        .panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .panel-label { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 14px; }

        /* ── Drop Zone ───────────────────────────────────────────── */
        #drop-zone {
            border: 1px dashed var(--border-accent);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--accent-dim);
            text-align: center;
            font-family: var(--mono);
            font-size: 1.2rem;
            color: var(--accent);
            margin: 10px auto 20px;
            width: 30%;
            padding: 10px;
            overflow-wrap: break-word; /* Allows breaking long filenames */
            word-wrap: break-word;     /* Legacy support */
            box-sizing: border-box;    /* Ensures padding doesn't push width past 30% */
        }
        #drop-zone .dz-hint { font-size: 0.8rem; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.05em; }
        #drop-zone.hover, #drop-zone:hover { background: rgba(0,255,136,0.18); border-style: solid; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        #drop-zone.loaded { border-style: solid; border-color: var(--accent); background: rgba(0,255,136,0.06); }

        /* ── Textarea ────────────────────────────────────────────── */
        textarea {
            width: 100%; height: 250px;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px;
            font-family: var(--mono); font-size: 1rem; line-height: 1.7;
            resize: vertical; transition: border 0.2s ease;
        }
        textarea:focus { outline: none; border-color: var(--border-accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        textarea::placeholder { color: var(--text-dim); }

        /* ── Mode Selector ───────────────────────────────────────── */
        /* 3-column for primary mode row; sub-engine row uses same class */
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; text-align: center; }
        .mode-selector.three-col { grid-template-columns: 1fr 1fr 1fr; }
        .mode-option { position: relative; }
        .mode-option input[type="radio"] { position: absolute; opacity: 0; width: 0; }
        .mode-option label {
            display: flex; flex-direction: column; gap: 6px;
            padding: 14px 16px;
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; transition: all 0.2s ease;
            background: var(--surface-2);
        }
        .mode-option label:hover { border-color: var(--border-accent); }
        .mode-option input:checked + label { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 12px var(--accent-glow); }
        .mode-title { font-family: var(--mono); font-size: 1.2rem; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; }
        .mode-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.4; }

        /* Sub-engine selector — hidden until snap mode is chosen */
        #engine-row {
            display: none; /* toggled by JS when snap is selected */
            margin-top: 10px;
        }
        #engine-row.visible { display: block; }
        .engine-label { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: none; padding: 11px 22px;
            font-family: var(--mono); font-size: 1rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-1px); } /* #048147 */
        .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border-accent); }
        .btn-ghost:hover:not(:disabled) { background: var(--accent-dim); }
        .btn-nav { background: transparent; color: #7d776b; border: 1px solid #a16d0f; }
        .btn-nav:hover:not(:disabled) { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .btn-muted { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
        .btn-muted:hover:not(:disabled) { color: var(--text); border-color: var(--border-accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-full { width: 100%; }

        /* ── Stage (session) ─────────────────────────────────────── */
        .stage {
            background: transparent; border: 1px solid var(--border-accent); border-radius: 12px;
            padding: 32px 32px 24px; text-align: center; margin-bottom: 16px;
            box-shadow: 0 0 40px rgba(0,255,136,0.06), inset 0 0 60px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .stage::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent); opacity: 0.6;
        }
        #curr-line {
            font-family: var(--sans); font-weight: 500;
            font-size: clamp(1.4rem, 4vw, 2rem); color: #807b7b;
            text-shadow: 0 0 30px var(--accent-glow);
            min-height: 2.5rem; line-height: 1.3; letter-spacing: -0.01em;
        }
        .tap-hint { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); margin-top: 16px; letter-spacing: 0.12em; }
        .tap-hint kbd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-family: var(--mono); color: var(--accent); }

        /* ── Playback bar ────────────────────────────────────────── */
        .playback-bar {
            display: flex; align-items: center; gap: 12px;
            margin-top: 20px; padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .pb-btn {
            background: none; border: 1px solid var(--border-accent);
            color: var(--accent); border-radius: 6px;
            width: 34px; height: 34px; cursor: pointer;
            font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease; flex-shrink: 0;
        }
        .pb-btn:hover { background: var(--accent-dim); }
        /* Seek track — clicking sets playback position */
        .seek-track {
            flex: 1; height: 3px; background: var(--surface-2);
            border-radius: 2px; position: relative; cursor: pointer;
        }
        .seek-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; box-shadow: 0 0 6px var(--accent); pointer-events: none; }
        .pb-time { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); flex-shrink: 0; min-width: 70px; text-align: right; }

        /* ── Progress + stats (tap progress, separate from seek) ─── */
        .progress-track { width: 100%; height: 2px; background: var(--surface-2); border-radius: 1px; margin: 20px 0 12px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }

        .stats-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); }
        .stat-val { color: var(--accent); font-weight: 700; }
        .bpm-badge { background: var(--accent-dim); border: 1px solid var(--border-accent); padding: 3px 10px; border-radius: 4px; letter-spacing: 0.08em; color: var(--accent); }
        .session-controls { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; }

        /* ── Floating preview ────────────────────────────────────────
         *
         * Implemented as position:fixed so it floats over session content
         * without displacing layout. The user can drag it by the title bar
         * and resize it by the bottom-right corner handle.
         *
         * Layout (top→bottom inside the float):
         *   #preview-titlebar  — drag handle + controls (refresh, close)
         *   #preview-editor    — scrollable timing editor (state.results rows)
         *   #preview-frame     — sandboxed FIZX iframe (read-only, refreshed on demand)
         *   #preview-resize    — invisible corner drag target for resize
         *
         * Why iframe.src=blob: not srcdoc:
         *   The HTML parser terminates <script> blocks at the first </script>
         *   found in an attribute value. The compiled FIZX template contains
         *   </script> inside its own script block — srcdoc silently breaks it.
         *   Blob URL bypasses this; browser fetches blob as standalone document.
         *
         * Why no live two-way sync with the iframe:
         *   The iframe is sandboxed (no allow-same-origin) so it cannot reach
         *   parent state. Editing happens in #preview-editor above the iframe;
         *   the user clicks Refresh to re-render. This is intentional — it
         *   prevents the iframe from modifying state accidentally.
         */
        #preview-wrap {
            /* Floating panel — fixed so it doesn't scroll with page */
            display: none;
            position: fixed;
            top: 60px; right: 24px;
            width: 340px;
            min-width: 260px; min-height: 300px;
            background: var(--surface);
            border: 1px solid var(--border-accent);
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,136,0.08);
            z-index: 200;
            /* flex column so editor and iframe share vertical space */
            flex-direction: column;
            overflow: hidden;
            /* resize handle is a separate element; CSS resize disabled to
               allow custom handle with better UX on touch */
        }
        #preview-wrap.visible { display: flex; }

        /* Drag handle — entire titlebar is draggable */
        #preview-titlebar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            cursor: grab; user-select: none;
            flex-shrink: 0;
        }
        #preview-titlebar:active { cursor: grabbing; }
        #preview-title {
            font-family: var(--mono); font-size: 0.65rem;
            color: var(--accent); letter-spacing: 0.12em;
        }
        .preview-titlebar-btns { display: flex; gap: 6px; align-items: center; }
        .ptb-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-dim); border-radius: 4px;
            font-family: var(--mono); font-size: 0.6rem;
            padding: 2px 7px; cursor: pointer; transition: all 0.15s ease;
            white-space: nowrap;
        }
        .ptb-btn:hover { border-color: var(--border-accent); color: var(--accent); }
        .ptb-btn.accent { border-color: var(--border-accent); color: var(--accent); }

        /* Timing editor — scrollable list of result rows.
           Each row lets the user adjust text, start, and end timestamps.
           Height is capped so the iframe gets meaningful space below. */
        #preview-editor {
            flex-shrink: 0;
            max-height: 100px;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
            /* custom scrollbar to match theme */
            scrollbar-width: thin;
            scrollbar-color: var(--border-accent) transparent;
        }
        #preview-editor::-webkit-scrollbar { width: 4px; }
        #preview-editor::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }

        /* Individual result row inside the editor */
        .edit-row {
            display: grid;
            /* text takes most space; two time inputs are compact */
            grid-template-columns: 1fr 72px 72px 20px;
            gap: 4px; align-items: center;
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
            font-family: var(--mono); font-size: 0.8rem;
        }
        .edit-row:last-child { border-bottom: none; }
        .edit-row input[type="text"],
        .edit-row input[type="number"] {
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 3px 5px; font-family: var(--mono); font-size: 0.8rem;
            width: 100%;
        }
        .edit-row input:focus { outline: none; border-color: var(--border-accent); }
        /* Delete button for a result row */
        .edit-row-del {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 0.75rem; padding: 0;
            line-height: 1; transition: color 0.15s;
        }
        .edit-row-del:hover { color: #ff4d6a; }

        /* Empty state shown when no results exist yet */
        #preview-editor-empty {
            padding: 12px; text-align: center;
            font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim);
        }

        /* FIZX preview iframe — fills remaining vertical space */
        #preview-frame {
            border: none; display: block;
            flex: 1;           /* take all remaining height after titlebar+editor */
            min-height: 200px;
            width: 100%;
            background: #000;
        }

        /* Resize handle — bottom-right corner drag target.
           Kept small (16×16) so it doesn't obscure the iframe content.
           cursor:nwse-resize signals resize intent to the user. */
        #preview-resize {
            position: absolute; bottom: 0; right: 0;
            width: 16px; height: 16px; cursor: nwse-resize;
            /* Subtle visual indicator — two diagonal lines */
            background: linear-gradient(
                135deg,
                transparent 30%, var(--border-accent) 30%,
                var(--border-accent) 40%, transparent 40%,
                transparent 60%, var(--border-accent) 60%,
                var(--border-accent) 70%, transparent 70%
            );
        }

        /* ── Analysis overlay ────────────────────────────────────── */
        #analysis-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(8,8,8,0.94); z-index: 100;
            align-items: center; justify-content: center; flex-direction: column; gap: 20px;
        }
        #analysis-overlay.visible { display: flex; }
        .analysis-label { font-family: var(--mono); font-size: 1rem; color: var(--accent); letter-spacing: 0.14em; }
        .analysis-bar-track { width: 280px; height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
        .analysis-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s ease; box-shadow: 0 0 8px var(--accent); }
        .analysis-sub { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.1em; }
        /* Spinner — shown when no incremental progress.
           Visibility toggled by showOverlay(engine). */
        .analysis-spinner {
            width: 28px; height: 28px;
            border: 2px solid rgba(0,255,136,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #analysis-spinner-wrap, #analysis-bar-wrap { display: none; }

        /* ── Param panels ─────────────────────────────────────────── */
        .param-panel { display: none; margin-top: 12px; }
        .param-panel.visible { display: block; }
        .param-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .param-row:last-child { border-bottom: none; }
        .param-label-wrap { display: flex; align-items: center; gap: 6px; position: relative; }
        .param-label { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.06em; }
        /* Tooltip: pure CSS on ⓘ hover. absolute positioning keeps it
           inside scroll flow without z-index fights with fixed elements. */
        .param-hint-icon { font-size: 0.75rem; color: var(--text-dim); cursor: default; position: relative; }
        .param-hint-icon:hover .param-tooltip { display: block; }
        .param-tooltip {
            display: none;
            position: absolute;
            left: 20px; top: -4px;
            width: 220px;
            background: var(--surface-2);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 0.7rem;
            color: var(--text);
            line-height: 1.5;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .param-slider {
            -webkit-appearance: none; appearance: none;
            width: 120px; height: 3px;
            background: var(--surface-2); border-radius: 2px;
            outline: none; cursor: pointer;
        }
        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
            cursor: pointer;
        }
        .param-slider::-moz-range-thumb {
            width: 12px; height: 12px; border: none;
            border-radius: 50%; background: var(--accent);
        }
        .param-value { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); min-width: 36px; text-align: right; }
        /* Selector for non-slider params */
        .model-selector { display: flex; gap: 8px; margin-top: 4px; text-align: center;}
        .model-option { position: relative; flex: 1; }
        .model-option input[type="radio"] { position: absolute; opacity: 0; width: 0; }
        .model-option label {
            display: flex; flex-direction: column; gap: 3px;
            padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; transition: all 0.15s ease; background: var(--surface-2);
        }
        .model-option label:hover { border-color: var(--border-accent); }
        .model-option input:checked + label { border-color: var(--accent); background: var(--accent-dim); }
        .model-name { font-family: var(--mono); font-size: 0.9rem; color: var(--accent); font-weight: 700; }
        .model-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.3; }
        /* Session params collapsible */
        #session-params { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: none; }
        #session-params.visible { display: block; }
        #session-params-toggle {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: var(--surface-2); border: none; cursor: pointer;
            font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim);
            letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.15s ease;
        }
        #session-params-toggle:hover { color: var(--accent); }
        #session-params-toggle .arrow { transition: transform 0.2s ease; display: inline-block; }
        #session-params-toggle.open .arrow { transform: rotate(180deg); }
        #session-params-body { display: none; padding: 12px 16px; background: var(--surface); }
        #session-params-body.open { display: block; }

        /* ── Output view ─────────────────────────────────────────── */
        .output-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .output-header h2 { font-family: var(--mono); font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); }
        .output-summary { font-size: 0.8rem; color: var(--text-dim); font-family: var(--mono); }
        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

        /* ── Toast ───────────────────────────────────────────────── */
        #toast {
            position: fixed; top: 24px; right: 24px;
            background: var(--surface); border: 1px solid var(--border-accent);
            color: var(--accent); font-family: var(--mono); font-size: 1.5rem;
            padding: 10px 16px; border-radius: 6px;
            opacity: 0; transform: translateY(6px); transition: all 0.2s ease;
            pointer-events: none; letter-spacing: 0.06em;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        .divider { height: 1px; background: var(--border); margin: 20px 0; }

        @media (max-width: 600px) {
            .mode-selector, .mode-selector.three-col, .export-grid, .session-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>FIZX Studio</h1>
        <span class="header-sub">@AmMoPy</span>
        <div class="header-line"></div>
    </div>

    <div id="setup-view">
        <textarea id="lyrics-input" placeholder="Paste lyrics here (Optional), one line per entry.&#10;&#10;Yeah...&#10;They said I couldn't build it&#10;4 gigs of RAM, 2 cores, and a dream...&#10;&#10;QUICK START: drop audio > select mode > start session > tap spacebar > preview > export"></textarea>
        
        <div id="drop-zone">
            DROP AUDIO FILE
            <div class="dz-hint">MP3 · WAV · OGG · FLAC</div>
        </div>
        <input type="file" id="file-input" style="display:none" accept="audio/*">
        
        <div class="panel-label">Extraction Mode</div>
        <div class="mode-selector">
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-buffer" value="buffer" checked>
                <label for="mode-buffer">
                    <span class="mode-title">Lyrics Only</span>
                    <span class="mode-desc">Taps capture exact timing</span>
                </label>
            </div>
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-snap" value="snap">

/* @@VISUALIZERS@@ */
const CANVAS_SCALE = 2.6;


const ROOT_STYLE = document.documentElement;







function readVizVars() {
    const s = getComputedStyle(ROOT_STYLE);
    return {
        color:     s.getPropertyValue('--viz-color').trim()     || '#ffffff',
        glow:      s.getPropertyValue('--viz-glow').trim()      || 'rgba(255,255,255,0.4)',
        secondary: s.getPropertyValue('--viz-secondary').trim() || 'rgba(255,255,255,0.2)',
    };
}




function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
}



function easeOutSine(t) { return Math.sin((t * Math.PI) / 2); }







class BaseVisualizer {
    constructor(wrap) {
        this.wrap   = wrap;
        this.canvas = null;
        this.ctx    = null;
        this._rafId = null;
        this._init();
    }

    
    _init() { throw new Error('BaseVisualizer._init() must be implemented'); }

    
    pulse() { throw new Error('BaseVisualizer.pulse() must be implemented'); }

    
    
    _cleanup() {}

    
    
    
    
    
    
    
    
    
    destroy() {
        this._cleanup();

        if (this._rafId) {
            cancelAnimationFrame(this._rafId);
            this._rafId = null;
        }

        if (this.canvas) {
            if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            this.canvas.width  = 0;
            this.canvas.height = 0;
            if (this.canvas.parentNode) this.canvas.parentNode.removeChild(this.canvas);
            this.canvas = null;
            this.ctx    = null;
        }

        this.wrap = null;
    }

    
    
    _makeCanvas(w, h) {
        
        this.wrap.innerHTML = '';
        const canvas = document.createElement('canvas');
        canvas.width  = w;
        canvas.height = h;
        
        canvas.style.cssText = \`width:\${w}px;height:\${h}px;display:block;\`;
        
        canvas.style.willChange = 'transform, opacity';
        this.wrap.appendChild(canvas);
        this.canvas = canvas;
        this.ctx    = canvas.getContext('2d');
        return canvas;
    }
}









class RingVisualizer extends BaseVisualizer {
    _init() {
        this.scale   = 1;
        this.BASE    = 60;
        this.MAX     = 1.65;
        this.DECAY   = 0.88; 
        this.RING_W  = 3;
        const sz     = this.BASE * CANVAS_SCALE;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        
        this.scale = this.MAX;
    }

    _loop() {
        if (!this.canvas) return;
        this.scale = 1 + (this.scale - 1) * this.DECAY;
        this._draw();
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _draw() {
        const { canvas, ctx, scale, BASE, RING_W } = this;
        const { color, glow } = readVizVars();
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const r  = (BASE / 2) * scale;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth   = RING_W;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 6 + (scale - 1) * 30;
        ctx.globalAlpha = Math.min(1, 0.5 + (scale - 1) * 1.5);
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
}








class BloomVisualizer extends BaseVisualizer {
    _init() {
        this.BASE      = 65;
        this.intensity = 0;   
        this.DECAY     = 0.92; 
        this._cycleIdx = 0;
        const sz       = this.BASE * CANVAS_SCALE;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        this.intensity = 1.0; 
        this._cycleIdx = (this._cycleIdx + 1) % 4;
    }

    _loop() {
        if (!this.canvas) return;
        this.intensity *= this.DECAY;
        this._draw();
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _draw() {
        if (!this.canvas) return;
        const { canvas, ctx, BASE, intensity } = this;
        if (intensity < 0.005) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
        const { glow } = readVizVars();
        const cx = canvas.width / 2, cy = canvas.height / 2;
        
        const r  = (BASE / 2) * (1 + intensity * 0.5);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const aMod = 0.85 + this._cycleIdx * 0.05;

        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.4);
        g.addColorStop(0,    this._a(glow, intensity * 0.85 * aMod));
        g.addColorStop(0.4,  this._a(glow, intensity * 0.55 * aMod));
        g.addColorStop(0.75, this._a(glow, intensity * 0.2));
        g.addColorStop(1,    'rgba(0,0,0,0)');

        ctx.fillStyle   = g;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 20 + intensity * 30;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    
    
    
    _a(rgba, a) { 
        return rgba.replace(/[\\d.]+\\)$/, \`\${Math.min(a,1).toFixed(3)})\`); 
    }
}










class HeartbeatVisualizer extends BaseVisualizer {
    _init() {
        this._lock    = false;
        this.BASE     = 60;
        this.DURATION = 280; 
        const w = this.BASE * 3, h = this.BASE * 1.2;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._draw(0);
    }

    pulse() {
        
        
        if (this._lock) return;
        this._lock = true;
        const start = performance.now();
        const go = now => {
            if (!this.canvas) return;
            const p = Math.min((now - start) / this.DURATION, 1);
            
            
            const env = p < 0.5
                ? easeOutExpo(p * 2)           
                : 1 - easeOutExpo((p - 0.5)*2); 
            this._draw(env);
            if (p < 1) this._rafId = requestAnimationFrame(go);
            else { this._draw(0); this._lock = false; }
        };
        if (this._rafId) cancelAnimationFrame(this._rafId);
        this._rafId = requestAnimationFrame(go);
    }
    _draw(env) {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow } = readVizVars();
        ctx.clearRect(0, 0, w, h);
        const cy  = h / 2;
        const amp = (h * 0.38) * env;

        
        const profile = x => {
            if (x < 0.25) return 0;
            if (x < 0.32) return -(x - 0.25) / 0.07 * 0.15;
            if (x < 0.38) return  (x - 0.32) / 0.06;
            if (x < 0.42) return 1 - (x - 0.38) / 0.04 * 1.6;
            if (x < 0.46) return -0.6 + (x - 0.42) / 0.04 * 0.6;
            if (x < 0.55) return 0;
            if (x < 0.65) return Math.sin((x - 0.55) / 0.10 * Math.PI) * 0.18;
            return 0;
        };

        ctx.beginPath();
        for (let px = 0; px < w; px++) {
            const y = cy - profile(px / w) * amp;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth   = 1.5;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 4 + amp * 0.4;
        ctx.globalAlpha = 0.4 + env * 0.6;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    _cleanup() { this._lock = false; }
}









class RippleVisualizer extends BaseVisualizer {
    _init() {
        this._rings   = [];
        this.BASE     = 50;
        this.MAX_RINGS= 4;
        this.DURATION = 600; 
        const sz      = this.BASE * CANVAS_SCALE;
        this.sz       = sz;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        if (this._rings.length >= this.MAX_RINGS) this._rings.shift();
        
        this._rings.push({ t0: performance.now() - this.DURATION * 0.08, dur: this.DURATION });
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, sz, BASE } = this;
        const { color, glow } = readVizVars();
        const cx = sz / 2, cy = sz / 2;
        const maxR = (BASE / 2) * 2.2;
        ctx.clearRect(0, 0, sz, sz);
        const now = performance.now();
        this._rings = this._rings.filter(ring => {
            const p = (now - ring.t0) / ring.dur;
            if (p >= 1) return false;
            const r = maxR * easeOutSine(p);
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth   = 1.8 * (1 - p * 0.6);
            ctx.shadowColor = glow;
            ctx.shadowBlur  = 14 * (1 - p);
            ctx.globalAlpha = (1 - p) * 0.8;
            ctx.stroke();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            return true;
        });
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _cleanup() { this._rings = []; }
}









class WaveformVisualizer extends BaseVisualizer {
    _init() {
        this._amp   = 0;
        this._phase = 0;
        this.MAX_AMP  = 16;
        this.FREQ     = 3;
        this.DECAY    = 0.91; 
        const w = 60*3, h = 60*1.4;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._loop();
    }

    pulse() {
        this._amp = this.MAX_AMP; 
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow } = readVizVars();
        const cy = h / 2;

        this._amp   *= this.DECAY;
        this._phase += 0.05; 

        ctx.clearRect(0, 0, w, h);
        ctx.beginPath();
        for (let px = 0; px <= w; px++) {
            const x   = px / w;
            const env = Math.sin(x * Math.PI); 
            const y   = cy - Math.sin(x * Math.PI * 2 * this.FREQ + this._phase) * this._amp * env;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        const intensity = this._amp / this.MAX_AMP;
        ctx.strokeStyle = color;
        ctx.lineWidth   = 2;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 4 + intensity * 16;
        ctx.globalAlpha = 0.35 + intensity * 0.65;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;

        this._rafId = requestAnimationFrame(() => this._loop());
    }
}










class ParticlesVisualizer extends BaseVisualizer {
    _init() {
        this._particles = [];
        this.MAX_P    = 72;
        this.PER_BURST= 14; 
        this.BASE     = 60;
        const sz = this.BASE * CANVAS_SCALE;
        this.sz  = sz;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        const { sz, MAX_P, PER_BURST, BASE } = this;
        const cx = sz / 2, cy = sz / 2;
        
        if (this._particles.length + PER_BURST > MAX_P) {
            this._particles.splice(0, PER_BURST); 
        }
        for (let i = 0; i < PER_BURST; i++) {
            const angle = (Math.PI * 2 / PER_BURST) * i + (Math.random() - 0.5) * 0.5;
            const spd   = BASE * 0.016 + Math.random() * BASE * 0.018;
            this._particles.push({
                x: cx, y: cy,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                r: 1.5 + Math.random() * 2.5,
                life: 1.0,
                decay: 0.022 + Math.random()*0.014, 
            });
        }
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, sz } = this;
        const { color, glow } = readVizVars();
        ctx.clearRect(0, 0, sz, sz);
        this._particles = this._particles.filter(p => {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.94; p.vy *= 0.94;
            p.life -= p.decay;
            if (p.life <= 0) return false;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
            ctx.fillStyle   = color;
            ctx.shadowColor = glow;
            ctx.shadowBlur  = 5;
            ctx.globalAlpha = p.life * 0.9;
            ctx.fill();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            return true;
        });
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _cleanup() { this._particles = []; }
}









class DNAVisualizer extends BaseVisualizer {
    _init() {
        this.BASE     = 60;
        this._restAmp = this.BASE * 0.10;
        this._maxAmp  = this.BASE * 0.44;
        this._amp     = this._restAmp;
        this.DECAY    = 0.93;
        this._phase   = 0;
        const w = this.BASE*3, h = this.BASE*1.4;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._loop();
    }

    pulse() { this._amp = this._maxAmp; }

    _loop() {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow, secondary } = readVizVars();
        const cy    = h / 2;
        const freq  = 2.5;
        const rungs = 8;

        
        this._amp   = this._restAmp + (this._amp - this._restAmp) * this.DECAY;
        this._phase += 0.03;

        ctx.clearRect(0, 0, w, h);

        const norm  = (this._amp - this._restAmp) / (this._maxAmp - this._restAmp);
        const gBlur = norm * 16;
        const alpha = 0.4 + norm * 0.5;

        
        this._strand(ctx, w, cy, freq, 0,       color,     gBlur,       alpha,       glow);
        
        this._strand(ctx, w, cy, freq, Math.PI, secondary, gBlur * 0.6, alpha * 0.65, glow);

        
        ctx.strokeStyle = color;
        ctx.lineWidth   = 0.9;
        ctx.globalAlpha = alpha * 0.3;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = gBlur * 0.4;
        for (let i = 0; i <= rungs; i++) {
            const xN = i / rungs;
            const y1 = cy - Math.sin(xN * Math.PI * 2 * freq + this._phase) * this._amp;
            const y2 = cy - Math.sin(xN * Math.PI * 2 * freq + this._phase + Math.PI) * this._amp;
            ctx.beginPath(); ctx.moveTo(xN * w, y1); ctx.lineTo(xN * w, y2); ctx.stroke();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _strand(ctx, w, cy, freq, offset, strokeColor, glowBlur, alpha, shadowColor) {
        ctx.beginPath();
        for (let px = 0; px <= w; px++) {
            const y = cy - Math.sin((px / w) * Math.PI * 2 * freq + this._phase + offset) * this._amp;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth   = 1.5;
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur  = glowBlur;
        ctx.globalAlpha = alpha;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
}

// ═══════════════════════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════════════════════

// ── DOM ───────────────────────────────────────────────────────────
const stageEl       = document.getElementById('stage');
const screenEl      = document.getElementById('screen');
const currentLineEl = document.getElementById('currentLine');
const nextLineEl    = document.getElementById('nextLine');
const timeDisplay   = document.getElementById('timeDisplay');
const bpmDisplay    = document.getElementById('bpmDisplay');

const resetBtn      = document.getElementById('resetBtn');

let bpm            = BEAT_DATA.bpm;
let currentMode    = 'A'; // 'A' = beat triggers, 'B' = lyric start triggers
let currentPreset  = PRESET_ORDER[0];
let isLandscape    = false;
let isPlaying      = false;

// Visualizer cycling: VISUALIZER_ORDER is injected by compile.py from
// visualizers.js. In the default template it is defined inline below.
// The 'off' sentinel maps to null (no visualizer rendered).
// If VISUALIZER_ORDER is not injected (non-technical user), default to particles/waveform/off.
const VIZ_ORDER = (typeof VISUALIZER_ORDER !== 'undefined')
    ? VISUALIZER_ORDER
    : ['off', 'particles', 'waveform'];
let vizIndex    = 0;   // current position in VIZ_ORDER
let vizs        = null; // active BaseVisualizer instance or null

// ── Audio ─────────────────────────────────────────────────────────
let audio        = null;
let audioContext = null;
let t0           = null; // AudioContext.currentTime at play() resolution

// ── Timer Registry ────────────────────────────────────────────────
// Every setTimeout created by triggerVisual() is tracked here.
// resetAudio() and song changes clear this registry before any new
// allocations — prevents timers from firing against stale state.
// This prevents memory leak if setTimeouts are never cancelled on reset.
const activeVisualTimers = [];

// Beat scheduler timers (AudioContext-anchored setTimeouts for each beat)
const scheduledTimers = [];

// Display loop rAF handle
let animFrameId = null;

// Flash cycle index for aurora-style presets
let flashCycleIdx = 0;

// Per-effect debounce: tracks the pending removal timer for each CSS class.
// Key: className string → Value: setTimeout id.
// When triggerVisual() fires the same class again before the previous
// duration elapsed, this clears the old removal timer first.
// This prevents the "stutter" where an animation class gets removed
// mid-flight by a previous setTimeout that is now stale.
const effectRemovalTimers = {};


// ═══════════════════════════════════════════════════════════════════
// VISUALIZER MANAGEMENT
// ═══════════════════════════════════════════════════════════════════

function buildVisualizer(key) {
    // Destroy existing instance with full GPU cleanup before creating new one.
    // destroy() in BaseVisualizer zeros canvas dimensions → immediate GPU release.
    if (vizs) {
        vizs.destroy();
        vizs = null;
    }

    if (key === 'off' || !key) {
        visWrap.classList.add('viz-off');
        vizBtn.textContent = '◎ off';
        return;
    }

    // VISUALIZERS map is injected by compile.py. If not present (raw template),
    // fall back gracefully — just hide the wrap.
    if (typeof VISUALIZERS === 'undefined' || !VISUALIZERS[key]) {
        visWrap.classList.add('viz-off');
        return;
    }

    visWrap.classList.remove('viz-off');
    // Override style key to match the chosen visualizer
    vizs = new VISUALIZERS[key](visWrap);
    vizBtn.textContent = \`◎ \${key}\`;
}

function cycleVisualizer() {
    vizIndex = (vizIndex + 1) % VIZ_ORDER.length;
    buildVisualizer(VIZ_ORDER[vizIndex]);
}


// ═══════════════════════════════════════════════════════════════════
// PRESET APPLICATION
// Injects CSS vars, sets flash color var, toggles CRT class,
// rebuilds dust, rebuilds visualizer with new preset's visualizer config.
// ═══════════════════════════════════════════════════════════════════
function applyPreset(key) {
    const p = PRESETS[key];
    if (!p) return;

    currentPreset = key;
    flashCycleIdx = 0;

    // CSS custom properties are injected via
    // root.style.setProperty() which overrides any existing inline styles.
    // This is intentional — presets fully own the visual theme.    
    const root = document.documentElement;
    Object.entries(p.cssVars).forEach(([k, v]) => root.style.setProperty(k, v));

    // --flash-color drives @keyframes kScreenFlash — set here so the
    // flash is always theme-correct with no JS branching in triggerVisual.
    root.style.setProperty('--flash-color', p.flashColor);
    // The '--crt-on' property is read as a string, not a boolean.
    screenEl.classList.toggle('crt-on', p.cssVars['--crt-on'] === '1');

    // Rebuild dust with preset color
    document.querySelectorAll('.dust-particle').forEach(el => el.remove());
    createDust(p.dustColor);

    // Do NOT rebuild the visualizer here. CSS vars are now injected above,
    // and the running visualizer reads them on its next draw frame automatically.
    // This is zero-coupling contract: preset switch = CSS vars only.

    const nextKey = PRESET_ORDER[(PRESET_ORDER.indexOf(key) + 1) % PRESET_ORDER.length];
    presetBtn.setAttribute('data-tip', \`→ \${PRESETS[nextKey].label}\`);
}


// ═══════════════════════════════════════════════════════════════════
// VISUAL TRIGGER
// Called once per scheduled beat. Picks a random effect from the
// active preset pool, applies it to .current-line, and pulses the
// active visualizer.
//
// DEBOUNCE:
//   effectRemovalTimers tracks the pending "remove class" timer per
//   className. If the same effect fires again before expiry, the
//   stale removal timer is cancelled first. Without this, fast beats
//   cause the class to be removed mid-animation by the old timer,
//   creating a stutter where the animation starts then abruptly stops.
//
// TIMER TRACKING:
//   All setTimeouts pushed to activeVisualTimers so resetAudio() can
//   clear them. This closes the leak in the previous implementation.
// ═══════════════════════════════════════════════════════════════════
function triggerVisual() {
    const p      = PRESETS[currentPreset];
    const effect = p.effects[Math.floor(Math.random() * p.effects.length)];

    // Debounce: clear stale removal timer for this class before restarting
    if (effectRemovalTimers[effect.className]) {
        clearTimeout(effectRemovalTimers[effect.className]);
        delete effectRemovalTimers[effect.className];
    }

    // void offsetWidth: forces browser to reflow, ensuring the class
    // removal + re-add is treated as a fresh animation start.
    // Without this, if the same class is re-added before the browser
    // commits the removal, the animation does not restart.
    currentLineEl.classList.remove(effect.className);
    void currentLineEl.offsetWidth; // Force reflow — critical for animation restart
    currentLineEl.classList.add(effect.className);

    // Schedule class removal; track the timer ID for cleanup on reset
    const removeId = setTimeout(() => {
        currentLineEl.classList.remove(effect.className);
        delete effectRemovalTimers[effect.className];
        const idx = activeVisualTimers.indexOf(removeId);
        if (idx !== -1) activeVisualTimers.splice(idx, 1);
    }, effect.duration + 20);
    activeVisualTimers.push(removeId);
    effectRemovalTimers[effect.className] = removeId;

    if (effect.useFlash) {
        // Rotate flash color if preset uses flashCycle
        if (p.flashCycle && p.flashCycleColors && p.flashCycleColors.length) {
            flashCycleIdx = (flashCycleIdx + 1) % p.flashCycleColors.length;
            document.documentElement.style.setProperty('--flash-color', p.flashCycleColors[flashCycleIdx]);
        }
        screenEl.classList.remove('screen-flash');
        void screenEl.offsetWidth; // reflow guard — same reason as above
        screenEl.classList.add('screen-flash');
        const flashId = setTimeout(() => {
            screenEl.classList.remove('screen-flash');
            const idx = activeVisualTimers.indexOf(flashId);
            if (idx !== -1) activeVisualTimers.splice(idx, 1);
        }, 150);
        activeVisualTimers.push(flashId);
    }

    if (effect.useScan && screenEl.classList.contains('crt-on')) {
        screenEl.classList.add('scan-active');
        const scanId = setTimeout(() => {
            screenEl.classList.remove('scan-active');
            const idx = activeVisualTimers.indexOf(scanId);
            if (idx !== -1) activeVisualTimers.splice(idx, 1);
        }, 280);
        activeVisualTimers.push(scanId);
    }

    if (vizs) vizs.pulse();
}


// ═══════════════════════════════════════════════════════════════════
// BEAT SCHEDULER
// AudioContext-anchored setTimeout per beat.
// t0 = AudioContext.currentTime sampled at play().then() resolution.
// This absorbs browser audio startup latency automatically — the gap
// between .play() call and the then() callback is the hardware latency,
// and by sampling t0 there rather than before .play(), it is baked in.
//
// Timer IDs stored in scheduledTimers for full cleanup on reset.
// ═══════════════════════════════════════════════════════════════════
function scheduleAll(timestamps) {
    clearScheduled();
    const atx = audioContext.currentTime;
    timestamps.forEach(ts => {
        const ms = (t0 + ts - atx) * 1000;
        if (ms < 0) return; // already past (e.g. resume after seek)
        const id = setTimeout(triggerVisual, ms);
        scheduledTimers.push(id);
    });
}

function clearScheduled() {
    scheduledTimers.forEach(id => clearTimeout(id));
    scheduledTimers.length = 0; // in-place clear — avoids reallocation
}


// ═══════════════════════════════════════════════════════════════════
// DISPLAY LOOP
// rAF loop for lyrics text updates and time counter only.
// Beat triggering is NOT done here — it is handled by scheduled
// setTimeouts in scheduleAll(). Separation of concerns:
//   - Display loop: ~60fps polling, latency-insensitive
//   - Beat scheduler: AudioContext-precise, fires independently
// ═══════════════════════════════════════════════════════════════════
function updateLyrics(t) {
    const idx = LYRICS.findIndex(l => t >= l.start && t <= l.end); //  returns -1 in gaps
    // dont clear textContent when idx === -1 as sticky behavior is desirable
    // text remains on screen until next one triggers. This "end" time is a 
    // metadata tag rather than a hard kill-switch
    if (idx !== -1) {
        currentLineEl.textContent = LYRICS[idx].text;
        const next = LYRICS[idx + 1];
        nextLineEl.textContent = next ? \`➡ \${next.text}\` : \`Audit Complete\`;
    } else if (LYRICS.length && t > LYRICS[LYRICS.length - 1].end) {
        currentLineEl.textContent = \`@AmMoPy\`;
        nextLineEl.textContent    = \`⭐ SHOW SOME LOVE ⭐\`;
    } else if (LYRICS.length && t < LYRICS[0].start) {
        currentLineEl.textContent = \`⚡ FIZX READY ⚡\`;
        nextLineEl.textContent    = \`➡ \${LYRICS[0].text}\`;
    }
}

function displayLoop() {
    if (audio && !audio.paused && !audio.ended) {
        timeDisplay.textContent = fmt(audio.currentTime);
        updateLyrics(audio.currentTime);
    }
    animFrameId = requestAnimationFrame(displayLoop);
}


// ═══════════════════════════════════════════════════════════════════
// AUDIO LIFECYCLE
// ═══════════════════════════════════════════════════════════════════
async function setupAudio(file) {
    const url = URL.createObjectURL(file);
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }

    // Close existing AudioContext before creating a new one.
    // Browsers accumulate "ghost" suspended contexts if not explicitly
    // closed — each holds DSP resources and event handlers.
    // await ensures closure completes before new context is created.
    if (audioContext) {
        await audioContext.close();
        audioContext = null;
    }

    audio = new Audio(url);
    audio.preload = 'auto';
    audioContext  = new (window.AudioContext || window.webkitAudioContext)();

    return new Promise(resolve => {
        audio.onloadeddata = () => { bpmDisplay.textContent = \`\${bpm} BPM\`; resolve(); };
        audio.onerror      = () => { statusMsg.textContent = \`❌ load error\`; resolve(); };
        audio.onended      = () => { isPlaying = false; playBtn.textContent = '▶'; };
    });
}

function selectAudio() {
    const input  = document.createElement('input');
    input.type   = 'file';
    input.accept = 'audio/mpeg,audio/wav,audio/ogg,audio/mp3';
    input.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        statusMsg.textContent = \`⏳ \${file.name.slice(0, 28)}…\`;
        await setupAudio(file);
        updateLyrics(0);
        timeDisplay.textContent = fmt(0);
        statusMsg.textContent   = \`✅ \${beatTimestamps.length} beats · \${LYRICS.length} lines\`;
    };
    input.click();
}

// ── Play / Pause ──────────────────────────────────────────────────
async function togglePlay() {
    if (!audio) { selectAudio(); return; }

    if (isPlaying) {
        audio.pause();
        clearScheduled();
        isPlaying = false;
        playBtn.textContent   = '▶';
        statusMsg.textContent = \`⏸ \${fmt(audio.currentTime)}\`;
        return;
    }

    if (audio.ended) audio.currentTime = 0;
    if (audioContext.state === 'suspended') await audioContext.resume();

    audio.play().then(() => {
        // t0 sampled here — inside then() — so it includes startup latency.
        // making setTimeout alignment accurate even on slow devices
        // All beat delays computed as (t0 + beatTs - audioContext.currentTime).
        t0 = audioContext.currentTime;

        // On resume, filter to only future timestamps so we don't reschedule
        // callbacks that already fired before the pause.
        const elapsed = audio.currentTime;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        scheduleAll(source);

        isPlaying = true;
        playBtn.textContent   = '⏸';
        statusMsg.textContent = \`▶ \${PRESETS[currentPreset].label} · \${currentMode} · \${source.length}\`;
    }).catch(() => { statusMsg.textContent = \`⚠️ tap again\`; });
}

// ── Reset ─────────────────────────────────────────────────────────
// Full teardown sequence — the order matters:
//   1. Stop audio + revoke blob URL
//   2. Clear ALL timers (scheduled beats + visual effect timers)
//   3. Cancel display rAF — stops canvas loops immediately
//   4. Close AudioContext — prevents ghost context accumulation
//   5. Destroy visualizer — releases GPU buffers
//   6. Reset UI state
//   7. Re-trigger file picker
async function resetAudio() {
    // 1. Audio
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }

    // 2. All timers — beats + visual effects + effect debounce registry
    clearScheduled();
    activeVisualTimers.forEach(id => clearTimeout(id));
    activeVisualTimers.length = 0;
    Object.keys(effectRemovalTimers).forEach(k => {
        clearTimeout(effectRemovalTimers[k]);
        delete effectRemovalTimers[k];
    });

    // 3. Display loop
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

    // 4. AudioContext — await ensures DSP resources are released before
    //    a new context might be created by setupAudio()
    if (audioContext) { await audioContext.close(); audioContext = null; }

    // 5. Visualizer GPU cleanup
    if (vizs) { vizs.destroy(); vizs = null; }

    // 6. UI state
    t0 = null; isPlaying = false;
    timeDisplay.textContent   = fmt(0);
    bpmDisplay.textContent    = \`-- BPM\`;
    playBtn.textContent       = '▶';
    currentLineEl.textContent = \`⚡ FIZX READY ⚡\`;
    nextLineEl.textContent    = \`▶ select audio file\`;
    statusMsg.textContent     = \`⟳ select new file\`;

    // Restart display loop — it is display-only so safe to run without audio
    displayLoop();

    // Rebuild visualizer (was destroyed above)
    buildVisualizer(VIZ_ORDER[vizIndex]);

    // 7. New file
    selectAudio();
}

// ── Mode toggle ───────────────────────────────────────────────────

// When toggling during playback, reschedules remaining triggers
// using the new source (beats or lyric starts).
function toggleMode() {
    currentMode = currentMode === 'A' ? 'B' : 'A';
    if (audio && isPlaying && t0 !== null) {
        const elapsed = audioContext.currentTime - t0;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        clearScheduled();
        scheduleAll(source);
    }
    statusMsg.textContent = \`MODE \${currentMode}\`;
}

// ── Preset toggle ─────────────────────────────────────────────────

// Cycles through PRESET_ORDER. Reschedules triggers during playback
// because preset changes may affect effect pool but NOT timing.
// Note: Rescheduling is defensive — timing doesn't change per preset,
// but the effect selection pool does. No need to reschedule actually.
function togglePreset() {
    const next = PRESET_ORDER[(PRESET_ORDER.indexOf(currentPreset) + 1) % PRESET_ORDER.length];
    applyPreset(next);
    if (audio && isPlaying && t0 !== null) {
        const elapsed = audioContext.currentTime - t0;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        clearScheduled();
        scheduleAll(source);
    }
}

// ── AR toggle ─────────────────────────────────────────────────────
function toggleAR() {
    isLandscape = !isLandscape;
    stageEl.classList.toggle('ar-landscape', isLandscape);
    arBtn.textContent = isLandscape ? '⊞ 9:16' : '⊞ 16:9';
}

// ── Utilities ─────────────────────────────────────────────────────
function fmt(sec) {
    if (isNaN(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return \`\${m}:\${s < 10 ? '0' : ''}\${s}\`;
}

function createDust(color) {
   // Creates floating dust particles with random positions, sizes, and animation delays.
    // Each particle has its own animation — 20 particles = 20 independent animations.
    // This is fine for modern browsers but could be optimized by using a single
    // canvas particle system. Not worth the complexity for this use case.
    for (let i = 0; i < 20; i++) {
        const d  = document.createElement('div');
        const sz = 2 + Math.random() * 4;
        d.classList.add('dust-particle');
        d.style.cssText = \`
            width:\${sz}px; height:\${sz}px; background:\${color};
            left:\${Math.random()*100}%; bottom:\${Math.random()*40}px;
            animation:kFloatUp \${6+Math.random()*12}s infinite linear;
            animation-delay:\${Math.random()*10}s;
        \`;
        screenEl.appendChild(d);
    }
}

// ── Event listeners ───────────────────────────────────────────────
playBtn.onclick   = togglePlay;
resetBtn.onclick  = resetAudio;
modeBtn.onclick   = toggleMode;
presetBtn.onclick = togglePreset;
arBtn.onclick     = toggleAR;
vizBtn.onclick    = cycleVisualizer;

// ── Boot ──────────────────────────────────────────────────────────
applyPreset(PRESET_ORDER[0]);
bpmDisplay.textContent = \`\${bpm} BPM\`;
updateLyrics(0);
displayLoop();
buildVisualizer(VIZ_ORDER[vizIndex]);

// ── Cleanup on unload ─────────────────────────────────────────────

// Cancels all pending timers, animation frames, and closes audio context.
// This prevents memory leaks when navigating away.
window.addEventListener('beforeunload', () => {
    clearScheduled();
    activeVisualTimers.forEach(id => clearTimeout(id));
    Object.values(effectRemovalTimers).forEach(id => clearTimeout(id));
    if (animFrameId)  cancelAnimationFrame(animFrameId);
    if (audio)        { audio.pause(); }
    if (audioContext) audioContext.close();
    if (vizs)   vizs.destroy();
});
<\/script>
</body>
</html>
`;

// ═══════════════════════════════════════════════════════════════════
// WORKER SOURCE (inlined as Blob — no separate file needed)
//
// Two engines share one Worker, selected by the 'engine' param:
//
// 'spectral' — Spectral Flux (default, mirrors ex_beats.py):
//   - Radix-2 Cooley-Tukey FFT, O(N log N)
//   - Hann window, N=2048, hop=512
//   - Spectral flux envelope, aggregate = median per frame
//     (matches librosa aggregate=np.median)
//   - Peak-pick: delta=0.07, wait=8 frames (~85ms at 48kHz/512-hop)
//   - backtrack to nearest preceding local minimum (backtrack=True)
//   - Secondary 120ms de-dupe pass (MIN_GAP=0.12)
//   - Good for: timbral transients, rap, dense percussion
//   - Weaker at: pure amplitude attacks where spectrum doesn't change
//
// 'energy' — Energy RMS (zero external deps, complementary to spectral):
//   - Short-time RMS envelope, no FFT needed
//   - Same peak-pick / backtrack / de-dupe pipeline as spectral
//   - Good for: loud amplitude attacks, kick drums, spoken word
//   - Weaker at: quiet timbral changes, hi-hats against loud pads
//
// Both use the same delta/wait/minGap params from PARAMS.
// Tradeoff: one Worker blob for both keeps file size minimal.
// Adding a third engine: add a branch in the onmessage switch below.
//
// Receives: { samples, sr, engine, delta, wait, minGap }
// Posts:    { type:'progress', pct, label }
//           { type:'done', onsets, bpm }
//           { type:'error', message }
// ═══════════════════════════════════════════════════════════════════
const RADIX_WORKER_SRC = `
'use strict';

// ── Radix-2 Cooley-Tukey in-place FFT ────────────────────────────
// re, im: Float64Arrays of length N (power of 2).
// Uses iterative butterfly, no recursion — avoids stack depth limits
// on large N.
function fft(re, im) {
    const N = re.length;
    let j = 0;
    for (let i = 1; i < N; i++) {
        let bit = N >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
            let t = re[i]; re[i] = re[j]; re[j] = t;
                t = im[i]; im[i] = im[j]; im[j] = t;
        }
    }
    for (let len = 2; len <= N; len <<= 1) {
        const half  = len >> 1;
        const theta = -2 * Math.PI / len;
        const wRe = Math.cos(theta), wIm = Math.sin(theta);
        for (let i = 0; i < N; i += len) {
            let curRe = 1, curIm = 0;
            for (let k = 0; k < half; k++) {
                const uRe = re[i+k], uIm = im[i+k];
                const vRe = re[i+k+half], vIm = im[i+k+half];
                const tRe = curRe*vRe - curIm*vIm, tIm = curRe*vIm + curIm*vRe;
                re[i+k] = uRe+tRe; im[i+k] = uIm+tIm;
                re[i+k+half] = uRe-tRe; im[i+k+half] = uIm-tIm;
                const nr = curRe*wRe - curIm*wIm;
                curIm = curRe*wIm + curIm*wRe; curRe = nr;
            }
        }
    }
}

// Median — sorts a copy, O(n log n). Float64Array for typed sort.
function median(arr) {
    const s = Float64Array.from(arr).sort();
    const m = s.length >> 1;
    return (s.length & 1) ? s[m] : (s[m-1] + s[m]) * 0.5;
}

// ── BPM via autocorrelation of the onset envelope ─────────────────
// Rationale: runs autocorrelation on the onset
// strength  signal to find the dominant periodicity,
// then resolves octave ambiguity via a log-BPM prior:
//   1. Compute autocorrelation of the normalized envelope.
//   2. Convert the lag with the highest correlation to BPM.
//   3. Apply octave correction: if a sub-harmonic lag (×2) has
//      correlation ≥ 0.9× the best, prefer the lower BPM (more musical).
// env: Float64Array of normalized onset strengths.
// sr, HOP: sample rate and hop size, used to convert lag → BPM.
// BPM range 40–240 constrains the lag search window.
function bpmFromAutocorrelation(env, sr, HOP) {
    const frameRate = sr / HOP;  // frames per second (~93.75 at 48kHz/512)

    // Convert BPM bounds to frame-lag bounds
    const lagMin = Math.floor(frameRate * 60 / 240);  // 240 BPM → shortest lag
    const lagMax = Math.ceil(frameRate * 60 / 40);    // 40 BPM  → longest lag
    const N = env.length;

    let bestLag = lagMin, bestCorr = -Infinity;

    // Unbiased autocorrelation at each candidate lag.
    // We normalize by (N - lag) so longer lags are not penalized
    // relative to shorter ones — same convention as librosa.
    for (let lag = lagMin; lag <= Math.min(lagMax, N - 1); lag++) {
        let corr = 0;
        for (let i = 0; i < N - lag; i++) corr += env[i] * env[i + lag];
        corr /= (N - lag);  // unbiased normalization
        if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
    }

    let bpm = Math.round(frameRate * 60 / bestLag);

    // Octave correction: prefer higher BPM if the half-lag (2× tempo)
    // has correlation ≥ 93% of the best. This handles the common case
    // where the autocorrelation peaks at the half-tempo period (every
    // 2 beats) before the beat period, producing 64 instead of 129.
    // We check upward (÷2 lag = ×2 BPM) before downward to match
    // librosa's log-BPM prior which biases toward the higher tempo
    // when the signal is ambiguous.
    const halfLag = Math.round(bestLag / 2);
    if (halfLag >= lagMin) {
        let corrHalf = 0;
        for (let i = 0; i < N - halfLag; i++) corrHalf += env[i] * env[i + halfLag];
        corrHalf /= (N - halfLag);
        if (corrHalf >= bestCorr * 0.93) bpm = Math.round(frameRate * 60 / halfLag);
    }

    return bpm;
}

// ── Energy RMS onset detection ───────────────────────────────────
// Complementary to spectral flux: operates on amplitude envelope rather
// than spectral change. Catches loud attacks that don't shift the spectrum
// (e.g. kick against a sustained synth pad). Shares the same peak-pick,
// backtrack, and de-dupe pipeline as the spectral engine.
//
// frameSize: RMS window in samples (matches FFT N for consistent hop ratio)
// hop: same as spectral so timestamps are directly comparable
function buildEnergyEnvelope(samples, frameSize, hop) {
    const numFrames = Math.floor((samples.length - frameSize) / hop) + 1;
    const env = new Float64Array(numFrames);
    for (let f = 0; f < numFrames; f++) {
        const off = f * hop;
        let sum = 0;
        for (let i = 0; i < frameSize; i++) sum += samples[off + i] * samples[off + i];
        env[f] = Math.sqrt(sum / frameSize);
    }
    return env;
}

self.onmessage = function(e) {
    // engine: 'spectral' (default) | 'energy' come from PARAMS config 
    // on main thread via postMessage payload.
    // Defaults for delta/wait/minGap mirror ex_beats.py constants.
    const { samples, sr, engine = 'spectral', delta = 0.07, wait = 8, minGap = 0.12 } = e.data;
    const HOP = 512, N = 2048, HALF = N / 2 + 1;

    // Hann window — precomputed once, reused every frame
    const win = new Float64Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 * (1 - Math.cos(2*Math.PI*i/(N-1)));

    const numFrames = Math.floor((samples.length - N) / HOP) + 1;

    // Single allocation for all per-frame working buffers.
    // No per-frame allocation means no GC pressure in the hot loop.
    const reArr   = new Float64Array(N);
    const imArr   = new Float64Array(N);
    const prevMag = new Float64Array(HALF);
    const curMag  = new Float64Array(HALF);
    const fluxBuf = new Float64Array(HALF);
    // envelope is reassigned for energy engine — declared with let
    let envelope = new Float64Array(numFrames);
    if (engine === 'spectral') {
    const TICK = Math.max(1, Math.floor(numFrames / 50));

    for (let f = 0; f < numFrames; f++) {
        const off = f * HOP;
        for (let i = 0; i < N; i++) { reArr[i] = samples[off+i] * win[i]; imArr[i] = 0; }
        fft(reArr, imArr);
        for (let k = 0; k < HALF; k++) curMag[k] = Math.sqrt(reArr[k]*reArr[k] + imArr[k]*imArr[k]);
        // Half-wave rectified spectral flux (only positive increases pass through)
        for (let k = 0; k < HALF; k++) { const d = curMag[k]-prevMag[k]; fluxBuf[k] = d > 0 ? d : 0; }
        // Median across bins — matches librosa aggregate=np.median, suppresses noise
        envelope[f] = median(fluxBuf);
        prevMag.set(curMag);
        if (f % TICK === 0) self.postMessage({ type:'progress', pct: Math.round(f/numFrames*75), label:'BUILDING ENVELOPE' });
    }
    } else {
        // ── Energy RMS path ───────────────────────────────────────
        // Build amplitude RMS envelope, then fall through to the shared
        // peak-pick pipeline below. No FFT needed — O(N) per frame.
        self.postMessage({ type:'progress', pct:40, label:'BUILDING ENERGY ENVELOPE' });
        envelope = buildEnergyEnvelope(samples, N, HOP);
    }

    // ── Shared peak-pick pipeline (both engines) ─────────────
    // Use envelope.length — energy path produces a different frame
    // count than the spectral path's pre-allocated numFrames.
    const envLen = envelope.length;
    self.postMessage({ type:'progress', pct:78, label:'PEAK PICKING' });

    // Normalize to [0,1] before peak picking and autocorrelation
    let maxVal = 0;
    for (let i = 0; i < envLen; i++) if (envelope[i] > maxVal) maxVal = envelope[i];
    if (maxVal > 0) for (let i = 0; i < envLen; i++) envelope[i] /= maxVal;

    // Adaptive threshold: mean + delta. delta from PARAMS (default 0.07 = ex_beats.py).
    // Lower delta → more sensitive (catches quieter hits, more false positives).
    // Higher delta → less sensitive (only strong transients pass).
    let sum = 0;
    for (let i = 0; i < envLen; i++) sum += envelope[i];
    const threshold = (sum / envLen) + delta;

    const WAIT = wait;  // min frames between peaks; from PARAMS
    const rawOnsets = [];
    let lastPeak = -WAIT - 1;

    for (let i = 1; i < envLen-1; i++) {
        const v = envelope[i];
        if (v > threshold && v >= envelope[i-1] && v >= envelope[i+1] && (i-lastPeak) >= WAIT) {
            // backtrack=True: snap to nearest preceding local minimum so the
            // timestamp lands on the attack transient, not the peak
            let snap = i;
            for (let j = i-1; j >= Math.max(0, i-WAIT); j--) {
                if (envelope[j] <= envelope[j+1]) snap = j; else break;
            }
            rawOnsets.push(snap);
            lastPeak = i;
        }
    }

    self.postMessage({ type:'progress', pct:90, label:'DE-DUPLICATION' });

    // Frames → seconds + de-dupe pass. minGap from PARAMS (default 0.12 = ex_beats.py MIN_GAP).
    // Raise minGap to suppress double-triggers on long decaying hits.
    const onsets = [];
    for (const f of rawOnsets) {
        const t = parseFloat(((f * HOP) / sr).toFixed(3));
        if (!onsets.length || (t - onsets[onsets.length-1]) >= minGap) onsets.push(t);
    }

    self.postMessage({ type:'progress', pct:95, label:'BPM DETECTION' });

    // Autocorrelation BPM — see bpmFromAutocorrelation() header comment
    const bpm = bpmFromAutocorrelation(envelope, sr, HOP);

    self.postMessage({ type:'progress', pct:100, label:'DONE' });
    self.postMessage({ type:'done', onsets, bpm });
};
`;

// ═══════════════════════════════════════════════════════════════════
// ENGINE_REGISTRY — single source of truth for all engines.
// Adding a new engine: one entry here, one entry in PARAMS for
// defaults and one entry in PARAM_SPECS for tunable config (optional).
//
// useBar: true  → progress bar in overlay (engine posts real progress ticks)
//         false → spinner (engine is fast/synchronous, bar would flash)
// ═══════════════════════════════════════════════════════════════════
const ENGINE_REGISTRY = [
    { id: 'spectral', label: 'Spectral Flux', useBar: true  },
    { id: 'energy',   label: 'Energy RMS',    useBar: false },
    // { id: 'myEngine', label: 'My Engine',     useBar: true },
];

// Derived lookup — avoids repeated .find() at runtime

// Resolve a spec entry's params, following one level of inheritance.
// 'energy' inheriting 'spectral' means energy users get all spectral
// sliders — logical since both engines use the same delta/wait/minGap
// pipeline. No deep inheritance chain needed; one level is sufficient.
function resolveParams(engineId) {
    const spec = PARAM_SPECS[engineId];
    if (!spec) return [];
    if (spec.inherits) {
        const parent = PARAM_SPECS[spec.inherits]?.params ?? [];
        return [...parent, ...(spec.params ?? [])];
    }
    return spec.params ?? [];
}

                    value="${PARAMS[spec.id]}">
                <span 
                    class="param-value" 
                    id="param-val-${spec.id}-${idSuffix}"
                    data-val-for="${spec.id}"
                    >
                    ${spec.fmt(PARAMS[spec.id])}

                // syncParam(spec.id, v, idSuffix);

                broadcastChange(spec.id, v, slider);
            });

        } else if (spec.type === 'model') {
            const optionsHtml = spec.options.map(opt => `
                <div class="model-option">
                    <input type="radio"
                        name="${spec.id}-${idSuffix}"
                        id="model-${opt.value}-${idSuffix}"

                        <span class="model-name">${opt.name}</span>
                        <span class="model-desc">${opt.desc}</span>

            row.innerHTML = `
                <div class="param-label-wrap" style="grid-column:1/-1; margin-bottom:4px;">
                    <span class="param-label">${spec.label}</span>

        container.appendChild(row);
    });
}

// ═══════════════════════════════════════════════════════════════════
// BPM VIA AUTOCORRELATION — shared by both engines (main thread copy)
//
// This is a copy of the same function inside RADIX_WORKER_SRC.
// It cannot be shared directly because the worker runs in a separate
// global scope with no access to main-thread variables.
//
// Used by extractEssentia as a fallback. Essentia's result.bpm is 
// preferred when available and > 0; this runs only when it isn't 
// (e.g. degara method omits it).
//
// env: normalized Float32/64 Array of onset strengths (values 0–1).
// sr, HOP: sample rate and hop size used to convert lag → BPM.
// Search window: 40–240 BPM. Octave correction prefers higher tempo
// when the half-lag correlation is ≥ 93% of the peak (see worker
// header for full rationale).
// ═══════════════════════════════════════════════════════════════════
function bpmFromAutocorrelation(env, sr, HOP) {
    const frameRate = sr / HOP;
    const lagMin = Math.floor(frameRate * 60 / 240);
    const lagMax = Math.ceil(frameRate * 60 / 40);
    const N = env.length;
    let bestLag = lagMin, bestCorr = -Infinity;
    for (let lag = lagMin; lag <= Math.min(lagMax, N - 1); lag++) {
        let corr = 0;
        for (let i = 0; i < N - lag; i++) corr += env[i] * env[i + lag];
        corr /= (N - lag);
        if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
    }
    let bpm = Math.round(frameRate * 60 / bestLag);
    const halfLag = Math.round(bestLag / 2);
    if (halfLag >= lagMin) {
        let corrHalf = 0;
        for (let i = 0; i < N - halfLag; i++) corrHalf += env[i] * env[i + halfLag];
        corrHalf /= (N - halfLag);
        if (corrHalf >= bestCorr * 0.93) bpm = Math.round(frameRate * 60 / halfLag);
    }
    return bpm;
}

// ═══════════════════════════════════════════════════════════════════
// RADIX EXTRACTION (Worker wrapper)
// Main thread: decode → transfer Float32Array → Worker runs pipeline.
// Zero-copy transfer via Transferable — samples.buffer is detached after
// postMessage, preventing accidental re-use on main thread.
// ═══════════════════════════════════════════════════════════════════

// Worker Blob URL — created once, reused across sessions
let _radixWorkerUrl = null;

function getRadixWorkerUrl() {
    // Blob URL created once and reused — creating per-call would leak
    if (!_radixWorkerUrl) _radixWorkerUrl = URL.createObjectURL(new Blob([RADIX_WORKER_SRC], { type: 'text/javascript' }));
    return _radixWorkerUrl;
}

function extractRadix(audioFile, onProgress) {
    return new Promise(async (resolve, reject) => {
        onProgress(5, 'decoding audio…');

        let arrayBuffer;
        try { arrayBuffer = await audioFile.arrayBuffer(); }
        catch (err) { return reject(new Error('File read failed: ' + err.message)); }

        // AudioContext at native SR — avoids the timestamp drift that occurs
        // when the browser resamples to 44100 before we decode (same as sr=None in librosa)
        const tmpCtx = new AudioContext();
        let audioBuffer;
        try { audioBuffer = await tmpCtx.decodeAudioData(arrayBuffer); }
        catch (err) { await tmpCtx.close(); return reject(new Error('Decode failed: ' + err.message)); }

        const sr      = audioBuffer.sampleRate;
        const dur     = audioBuffer.duration;
        const samples = audioBuffer.getChannelData(0).slice(); // copy — original tied to AudioBuffer
        await tmpCtx.close();

        onProgress(10, `${sr} Hz · ${dur.toFixed(1)}s`);

        const worker = new Worker(getRadixWorkerUrl());
        state.activeWorker = worker;

        worker.onmessage = (e) => {
            const msg = e.data;
            if (msg.type === 'progress') { onProgress(msg.pct, msg.label); return; }
            if (msg.type === 'done') {
                worker.terminate(); state.activeWorker = null;
                console.log(`[Radix] onsets:${msg.onsets.length} bpm:${msg.bpm} sr:${sr} dur:${dur.toFixed(2)}s`);
                resolve({ onsets: msg.onsets, bpm: msg.bpm });
                return;
            }
            if (msg.type === 'error') { worker.terminate(); state.activeWorker = null; reject(new Error(msg.message)); }
        };
        worker.onerror = (err) => { worker.terminate(); state.activeWorker = null; reject(new Error('Worker: ' + err.message)); };

        // Transfer — zero-copy handoff, samples.buffer is detached after this call.
        // delta/wait/minGap come from PARAMS (user-configured or defaults).
        worker.postMessage({ samples, sr, engine: state.engine, delta: PARAMS.delta, wait: PARAMS.wait, minGap: PARAMS.minGap }, [samples.buffer]);
    });
}
