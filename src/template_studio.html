<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZX STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"> <!--d2b48ca1 -->
    <style>
        :root {
            --bg:           #1c1b19; 
            --surface:      #1a1815;
            --surface-2:    #24221f;
            --text:         #e6ddd0; 
            --text-dim:     #7a7062;
            --accent:       #e0a96d; 
            --accent-dim:   rgba(224, 169, 109, 0.12);
            --accent-glow:  rgba(224, 169, 109, 0.25);
            --border-accent:rgba(224, 169, 109, 0.35);
            --border:       rgba(255, 255, 255, 0.04);
            --mono: 'Space Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background-image: repeating-linear-gradient(
                0deg,
                transparent, transparent 2px,
                rgba(0,255,136,0.008) 2px, rgba(0,255,136,0.008) 4px
            );
        }

        .container { max-width: 780px; width: 100%; }

        /* ── Header ──────────────────────────────────────────────── */
        .header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 40px; }
        .header h1 {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .header-sub { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.1em; }
        .header-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--border-accent), transparent); }

        /* ── Panels ──────────────────────────────────────────────── */
        .panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .panel-label { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 14px; }

        /* ── Drop Zone ───────────────────────────────────────────── */
        #drop-zone {
            border: 1px dashed var(--border-accent);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--accent-dim);
            text-align: center;
            font-family: var(--mono);
            font-size: 1.2rem;
            color: var(--accent);
            margin: 10px auto 20px;
            width: 30%;
            padding: 10px;
            overflow-wrap: break-word; /* Allows breaking long filenames */
            word-wrap: break-word;     /* Legacy support */
            box-sizing: border-box;    /* Ensures padding doesn't push width past 30% */
        }
        #drop-zone .dz-hint { font-size: 0.8rem; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.05em; }
        #drop-zone.hover, #drop-zone:hover { background: rgba(0,255,136,0.18); border-style: solid; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        #drop-zone.loaded { border-style: solid; border-color: var(--accent); background: rgba(0,255,136,0.06); }

        /* ── Textarea ────────────────────────────────────────────── */
        textarea {
            width: 100%; height: 250px;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px;
            font-family: var(--mono); font-size: 1rem; line-height: 1.7;
            resize: vertical; transition: border 0.2s ease;
        }
        textarea:focus { outline: none; border-color: var(--border-accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        textarea::placeholder { color: var(--text-dim); }

        /* ── Mode Selector ───────────────────────────────────────── */
        /* 3-column for primary mode row; sub-engine row uses same class */
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; text-align: center; }
        .mode-selector.three-col { grid-template-columns: 1fr 1fr 1fr; }
        .mode-option { position: relative; }
        .mode-option input[type="radio"] { position: absolute; opacity: 0; width: 0; }
        .mode-option label {
            display: flex; flex-direction: column; gap: 6px;
            padding: 14px 16px;
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; transition: all 0.2s ease;
            background: var(--surface-2);
        }
        .mode-option label:hover { border-color: var(--border-accent); }
        .mode-option input:checked + label { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 12px var(--accent-glow); }
        .mode-title { font-family: var(--mono); font-size: 1.2rem; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; }
        .mode-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.4; }

        /* Sub-engine selector — hidden until snap mode is chosen */
        #engine-row {
            display: none; /* toggled by JS when snap is selected */
            margin-top: 10px;
        }
        #engine-row.visible { display: block; }
        .engine-label { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: none; padding: 11px 22px;
            font-family: var(--mono); font-size: 1rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-1px); } /* #048147 */
        .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border-accent); }
        .btn-ghost:hover:not(:disabled) { background: var(--accent-dim); }
        .btn-nav { background: transparent; color: #7d776b; border: 1px solid #a16d0f; }
        .btn-nav:hover:not(:disabled) { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .btn-muted { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
        .btn-muted:hover:not(:disabled) { color: var(--text); border-color: var(--border-accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-full { width: 100%; }

        /* ── Stage (session) ─────────────────────────────────────── */
        .stage {
            background: transparent; border: 1px solid var(--border-accent); border-radius: 12px;
            padding: 32px 32px 24px; text-align: center; margin-bottom: 16px;
            box-shadow: 0 0 40px rgba(0,255,136,0.06), inset 0 0 60px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .stage::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent); opacity: 0.6;
        }
        #curr-line {
            font-family: var(--sans); font-weight: 500;
            font-size: clamp(1.4rem, 4vw, 2rem); color: #807b7b;
            text-shadow: 0 0 30px var(--accent-glow);
            min-height: 2.5rem; line-height: 1.3; letter-spacing: -0.01em;
        }
        .tap-hint { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); margin-top: 16px; letter-spacing: 0.12em; }
        .tap-hint kbd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-family: var(--mono); color: var(--accent); }

        /* ── Playback bar ────────────────────────────────────────── */
        .playback-bar {
            display: flex; align-items: center; gap: 12px;
            margin-top: 20px; padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .pb-btn {
            background: none; border: 1px solid var(--border-accent);
            color: var(--accent); border-radius: 6px;
            width: 34px; height: 34px; cursor: pointer;
            font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease; flex-shrink: 0;
        }
        .pb-btn:hover { background: var(--accent-dim); }
        /* Seek track — clicking sets playback position */
        .seek-track {
            flex: 1; height: 3px; background: var(--surface-2);
            border-radius: 2px; position: relative; cursor: pointer;
        }
        .seek-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; box-shadow: 0 0 6px var(--accent); pointer-events: none; }
        .pb-time { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); flex-shrink: 0; min-width: 70px; text-align: right; }

        /* ── Progress + stats (tap progress, separate from seek) ─── */
        .progress-track { width: 100%; height: 2px; background: var(--surface-2); border-radius: 1px; margin: 20px 0 12px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }

        .stats-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); }
        .stat-val { color: var(--accent); font-weight: 700; }
        .bpm-badge { background: var(--accent-dim); border: 1px solid var(--border-accent); padding: 3px 10px; border-radius: 4px; letter-spacing: 0.08em; color: var(--accent); }
        .session-controls { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; }

        /* ── Floating preview ────────────────────────────────────────
         *
         * Implemented as position:fixed so it floats over session content
         * without displacing layout. The user can drag it by the title bar
         * and resize it by the bottom-right corner handle.
         *
         * Layout (top→bottom inside the float):
         *   #preview-titlebar  — drag handle + controls (refresh, close)
         *   #preview-editor    — scrollable timing editor (state.results rows)
         *   #preview-frame     — sandboxed FIZX iframe (read-only, refreshed on demand)
         *   #preview-resize    — invisible corner drag target for resize
         *
         * Why iframe.src=blob: not srcdoc:
         *   The HTML parser terminates <script> blocks at the first </script>
         *   found in an attribute value. The compiled FIZX template contains
         *   </script> inside its own script block — srcdoc silently breaks it.
         *   Blob URL bypasses this; browser fetches blob as standalone document.
         *
         * Why no live two-way sync with the iframe:
         *   The iframe is sandboxed (no allow-same-origin) so it cannot reach
         *   parent state. Editing happens in #preview-editor above the iframe;
         *   the user clicks Refresh to re-render. This is intentional — it
         *   prevents the iframe from modifying state accidentally.
         */
        #preview-wrap {
            /* Floating panel — fixed so it doesn't scroll with page */
            display: none;
            position: fixed;
            top: 60px; right: 24px;
            width: 340px;
            min-width: 260px; min-height: 300px;
            background: var(--surface);
            border: 1px solid var(--border-accent);
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,136,0.08);
            z-index: 200;
            /* flex column so editor and iframe share vertical space */
            flex-direction: column;
            overflow: hidden;
            /* resize handle is a separate element; CSS resize disabled to
               allow custom handle with better UX on touch */
        }
        #preview-wrap.visible { display: flex; }

        /* Drag handle — entire titlebar is draggable */
        #preview-titlebar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            cursor: grab; user-select: none;
            flex-shrink: 0;
        }
        #preview-titlebar:active { cursor: grabbing; }
        #preview-title {
            font-family: var(--mono); font-size: 0.65rem;
            color: var(--accent); letter-spacing: 0.12em;
        }
        .preview-titlebar-btns { display: flex; gap: 6px; align-items: center; }
        .ptb-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-dim); border-radius: 4px;
            font-family: var(--mono); font-size: 0.6rem;
            padding: 2px 7px; cursor: pointer; transition: all 0.15s ease;
            white-space: nowrap;
        }
        .ptb-btn:hover { border-color: var(--border-accent); color: var(--accent); }
        .ptb-btn.accent { border-color: var(--border-accent); color: var(--accent); }

        /* Timing editor — scrollable list of result rows.
           Each row lets the user adjust text, start, and end timestamps.
           Height is capped so the iframe gets meaningful space below. */
        #preview-editor {
            flex-shrink: 0;
            max-height: 100px;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
            /* custom scrollbar to match theme */
            scrollbar-width: thin;
            scrollbar-color: var(--border-accent) transparent;
        }
        #preview-editor::-webkit-scrollbar { width: 4px; }
        #preview-editor::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }

        /* Individual result row inside the editor */
        .edit-row {
            display: grid;
            /* text takes most space; two time inputs are compact */
            grid-template-columns: 1fr 72px 72px 20px;
            gap: 4px; align-items: center;
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
            font-family: var(--mono); font-size: 0.8rem;
        }
        .edit-row:last-child { border-bottom: none; }
        .edit-row input[type="text"],
        .edit-row input[type="number"] {
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 3px 5px; font-family: var(--mono); font-size: 0.8rem;
            width: 100%;
        }
        .edit-row input:focus { outline: none; border-color: var(--border-accent); }
        /* Delete button for a result row */
        .edit-row-del {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 0.75rem; padding: 0;
            line-height: 1; transition: color 0.15s;
        }
        .edit-row-del:hover { color: #ff4d6a; }

        /* Empty state shown when no results exist yet */
        #preview-editor-empty {
            padding: 12px; text-align: center;
            font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim);
        }

        /* FIZX preview iframe — fills remaining vertical space */
        #preview-frame {
            border: none; display: block;
            flex: 1;           /* take all remaining height after titlebar+editor */
            min-height: 200px;
            width: 100%;
            background: #000;
        }

        /* Resize handle — bottom-right corner drag target.
           Kept small (16×16) so it doesn't obscure the iframe content.
           cursor:nwse-resize signals resize intent to the user. */
        #preview-resize {
            position: absolute; bottom: 0; right: 0;
            width: 16px; height: 16px; cursor: nwse-resize;
            /* Subtle visual indicator — two diagonal lines */
            background: linear-gradient(
                135deg,
                transparent 30%, var(--border-accent) 30%,
                var(--border-accent) 40%, transparent 40%,
                transparent 60%, var(--border-accent) 60%,
                var(--border-accent) 70%, transparent 70%
            );
        }

        /* ── Analysis overlay ────────────────────────────────────── */
        #analysis-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(8,8,8,0.94); z-index: 100;
            align-items: center; justify-content: center; flex-direction: column; gap: 20px;
        }
        #analysis-overlay.visible { display: flex; }
        .analysis-label { font-family: var(--mono); font-size: 1rem; color: var(--accent); letter-spacing: 0.14em; }
        .analysis-bar-track { width: 280px; height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
        .analysis-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s ease; box-shadow: 0 0 8px var(--accent); }
        .analysis-sub { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.1em; }
        /* Spinner — shown when no incremental progress.
           Visibility toggled by showOverlay(engine). */
        .analysis-spinner {
            width: 28px; height: 28px;
            border: 2px solid rgba(0,255,136,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #analysis-spinner-wrap, #analysis-bar-wrap { display: none; }

        /* ── Param panels ─────────────────────────────────────────── */
        .param-panel { display: none; margin-top: 12px; }
        .param-panel.visible { display: block; }
        .param-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .param-row:last-child { border-bottom: none; }
        .param-label-wrap { display: flex; align-items: center; gap: 6px; position: relative; }
        .param-label { font-family: var(--mono); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.06em; }
        /* Tooltip: pure CSS on ⓘ hover. absolute positioning keeps it
           inside scroll flow without z-index fights with fixed elements. */
        .param-hint-icon { font-size: 0.75rem; color: var(--text-dim); cursor: default; position: relative; }
        .param-hint-icon:hover .param-tooltip { display: block; }
        .param-tooltip {
            display: none;
            position: absolute;
            left: 20px; top: -4px;
            width: 220px;
            background: var(--surface-2);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 0.7rem;
            color: var(--text);
            line-height: 1.5;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .param-slider {
            -webkit-appearance: none; appearance: none;
            width: 120px; height: 3px;
            background: var(--surface-2); border-radius: 2px;
            outline: none; cursor: pointer;
        }
        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
            cursor: pointer;
        }
        .param-slider::-moz-range-thumb {
            width: 12px; height: 12px; border: none;
            border-radius: 50%; background: var(--accent);
        }
        .param-value { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); min-width: 36px; text-align: right; }
        /* Selector for non-slider params */
        .model-selector { display: flex; gap: 8px; margin-top: 4px; text-align: center;}
        .model-option { position: relative; flex: 1; }
        .model-option input[type="radio"] { position: absolute; opacity: 0; width: 0; }
        .model-option label {
            display: flex; flex-direction: column; gap: 3px;
            padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; transition: all 0.15s ease; background: var(--surface-2);
        }
        .model-option label:hover { border-color: var(--border-accent); }
        .model-option input:checked + label { border-color: var(--accent); background: var(--accent-dim); }
        .model-name { font-family: var(--mono); font-size: 0.9rem; color: var(--accent); font-weight: 700; }
        .model-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.3; }
        /* Session params collapsible */
        #session-params { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: none; }
        #session-params.visible { display: block; }
        #session-params-toggle {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: var(--surface-2); border: none; cursor: pointer;
            font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim);
            letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.15s ease;
        }
        #session-params-toggle:hover { color: var(--accent); }
        #session-params-toggle .arrow { transition: transform 0.2s ease; display: inline-block; }
        #session-params-toggle.open .arrow { transform: rotate(180deg); }
        #session-params-body { display: none; padding: 12px 16px; background: var(--surface); }
        #session-params-body.open { display: block; }

        /* ── Output view ─────────────────────────────────────────── */
        .output-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .output-header h2 { font-family: var(--mono); font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); }
        .output-summary { font-size: 0.8rem; color: var(--text-dim); font-family: var(--mono); }
        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

        /* ── Toast ───────────────────────────────────────────────── */
        #toast {
            position: fixed; top: 24px; right: 24px;
            background: var(--surface); border: 1px solid var(--border-accent);
            color: var(--accent); font-family: var(--mono); font-size: 1.5rem;
            padding: 10px 16px; border-radius: 6px;
            opacity: 0; transform: translateY(6px); transition: all 0.2s ease;
            pointer-events: none; letter-spacing: 0.06em;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        .divider { height: 1px; background: var(--border); margin: 20px 0; }

        @media (max-width: 600px) {
            .mode-selector, .mode-selector.three-col, .export-grid, .session-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>FIZX Studio</h1>
        <span class="header-sub">@AmMoPy</span>
        <div class="header-line"></div>
    </div>

    <div id="setup-view">
        <textarea id="lyrics-input" placeholder="Paste lyrics here (Optional), one line per entry.&#10;&#10;Yeah...&#10;They said I couldn't build it&#10;4 gigs of RAM, 2 cores, and a dream...&#10;&#10;QUICK START: drop audio > select mode > start session > tap spacebar > preview > export"></textarea>
        
        <div id="drop-zone">
            DROP AUDIO FILE
            <div class="dz-hint">MP3 · WAV · OGG · FLAC</div>
        </div>
        <input type="file" id="file-input" style="display:none" accept="audio/*">
        
        <div class="panel-label">Extraction Mode</div>
        <div class="mode-selector">
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-buffer" value="buffer" checked>
                <label for="mode-buffer">
                    <span class="mode-title">Lyrics Only</span>
                    <span class="mode-desc">Taps capture exact timing</span>
                </label>
            </div>
            <div class="mode-option">
                <input type="radio" name="mode" id="mode-snap" value="snap">

<script>
// ═══════════════════════════════════════════════════════════════════
// INJECTED BY compile.py — do not edit this line.
// compile.py backtick-escapes the full compiled FIZX template and
// replaces the marker inside the backtick string below.
// The template still contains [[BEATS_DATA]], [[LYRICS_DATA]],
// [[BPM_DATA]] as placeholders; those are substituted at export time.
// ═══════════════════════════════════════════════════════════════════
const FIZX_TEMPLATE = `/* @@FIZX_TEMPLATE@@ */`;

// ═══════════════════════════════════════════════════════════════════
// WORKER SOURCE (inlined as Blob — no separate file needed)
//
// Two engines share one Worker, selected by the 'engine' param:
//
// 'spectral' — Spectral Flux (default, mirrors ex_beats.py):
//   - Radix-2 Cooley-Tukey FFT, O(N log N)
//   - Hann window, N=2048, hop=512
//   - Spectral flux envelope, aggregate = median per frame
//     (matches librosa aggregate=np.median)
//   - Peak-pick: delta=0.07, wait=8 frames (~85ms at 48kHz/512-hop)
//   - backtrack to nearest preceding local minimum (backtrack=True)
//   - Secondary 120ms de-dupe pass (MIN_GAP=0.12)
//   - Good for: timbral transients, rap, dense percussion
//   - Weaker at: pure amplitude attacks where spectrum doesn't change
//
// 'energy' — Energy RMS (zero external deps, complementary to spectral):
//   - Short-time RMS envelope, no FFT needed
//   - Same peak-pick / backtrack / de-dupe pipeline as spectral
//   - Good for: loud amplitude attacks, kick drums, spoken word
//   - Weaker at: quiet timbral changes, hi-hats against loud pads
//
// Both use the same delta/wait/minGap params from PARAMS.
// Tradeoff: one Worker blob for both keeps file size minimal.
// Adding a third engine: add a branch in the onmessage switch below.
//
// Receives: { samples, sr, engine, delta, wait, minGap }
// Posts:    { type:'progress', pct, label }
//           { type:'done', onsets, bpm }
//           { type:'error', message }
// ═══════════════════════════════════════════════════════════════════
const RADIX_WORKER_SRC = `
'use strict';

// ── Radix-2 Cooley-Tukey in-place FFT ────────────────────────────
// re, im: Float64Arrays of length N (power of 2).
// Uses iterative butterfly, no recursion — avoids stack depth limits
// on large N.
function fft(re, im) {
    const N = re.length;
    let j = 0;
    for (let i = 1; i < N; i++) {
        let bit = N >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
            let t = re[i]; re[i] = re[j]; re[j] = t;
                t = im[i]; im[i] = im[j]; im[j] = t;
        }
    }
    for (let len = 2; len <= N; len <<= 1) {
        const half  = len >> 1;
        const theta = -2 * Math.PI / len;
        const wRe = Math.cos(theta), wIm = Math.sin(theta);
        for (let i = 0; i < N; i += len) {
            let curRe = 1, curIm = 0;
            for (let k = 0; k < half; k++) {
                const uRe = re[i+k], uIm = im[i+k];
                const vRe = re[i+k+half], vIm = im[i+k+half];
                const tRe = curRe*vRe - curIm*vIm, tIm = curRe*vIm + curIm*vRe;
                re[i+k] = uRe+tRe; im[i+k] = uIm+tIm;
                re[i+k+half] = uRe-tRe; im[i+k+half] = uIm-tIm;
                const nr = curRe*wRe - curIm*wIm;
                curIm = curRe*wIm + curIm*wRe; curRe = nr;
            }
        }
    }
}

// Median — sorts a copy, O(n log n). Float64Array for typed sort.
function median(arr) {
    const s = Float64Array.from(arr).sort();
    const m = s.length >> 1;
    return (s.length & 1) ? s[m] : (s[m-1] + s[m]) * 0.5;
}

// ── BPM via autocorrelation of the onset envelope ─────────────────
// Rationale: runs autocorrelation on the onset
// strength  signal to find the dominant periodicity,
// then resolves octave ambiguity via a log-BPM prior:
//   1. Compute autocorrelation of the normalized envelope.
//   2. Convert the lag with the highest correlation to BPM.
//   3. Apply octave correction: if a sub-harmonic lag (×2) has
//      correlation ≥ 0.9× the best, prefer the lower BPM (more musical).
// env: Float64Array of normalized onset strengths.
// sr, HOP: sample rate and hop size, used to convert lag → BPM.
// BPM range 40–240 constrains the lag search window.
function bpmFromAutocorrelation(env, sr, HOP) {
    const frameRate = sr / HOP;  // frames per second (~93.75 at 48kHz/512)

    // Convert BPM bounds to frame-lag bounds
    const lagMin = Math.floor(frameRate * 60 / 240);  // 240 BPM → shortest lag
    const lagMax = Math.ceil(frameRate * 60 / 40);    // 40 BPM  → longest lag
    const N = env.length;

    let bestLag = lagMin, bestCorr = -Infinity;

    // Unbiased autocorrelation at each candidate lag.
    // We normalize by (N - lag) so longer lags are not penalized
    // relative to shorter ones — same convention as librosa.
    for (let lag = lagMin; lag <= Math.min(lagMax, N - 1); lag++) {
        let corr = 0;
        for (let i = 0; i < N - lag; i++) corr += env[i] * env[i + lag];
        corr /= (N - lag);  // unbiased normalization
        if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
    }

    let bpm = Math.round(frameRate * 60 / bestLag);

    // Octave correction: prefer higher BPM if the half-lag (2× tempo)
    // has correlation ≥ 93% of the best. This handles the common case
    // where the autocorrelation peaks at the half-tempo period (every
    // 2 beats) before the beat period, producing 64 instead of 129.
    // We check upward (÷2 lag = ×2 BPM) before downward to match
    // librosa's log-BPM prior which biases toward the higher tempo
    // when the signal is ambiguous.
    const halfLag = Math.round(bestLag / 2);
    if (halfLag >= lagMin) {
        let corrHalf = 0;
        for (let i = 0; i < N - halfLag; i++) corrHalf += env[i] * env[i + halfLag];
        corrHalf /= (N - halfLag);
        if (corrHalf >= bestCorr * 0.93) bpm = Math.round(frameRate * 60 / halfLag);
    }

    return bpm;
}

// ── Energy RMS onset detection ───────────────────────────────────
// Complementary to spectral flux: operates on amplitude envelope rather
// than spectral change. Catches loud attacks that don't shift the spectrum
// (e.g. kick against a sustained synth pad). Shares the same peak-pick,
// backtrack, and de-dupe pipeline as the spectral engine.
//
// frameSize: RMS window in samples (matches FFT N for consistent hop ratio)
// hop: same as spectral so timestamps are directly comparable
function buildEnergyEnvelope(samples, frameSize, hop) {
    const numFrames = Math.floor((samples.length - frameSize) / hop) + 1;
    const env = new Float64Array(numFrames);
    for (let f = 0; f < numFrames; f++) {
        const off = f * hop;
        let sum = 0;
        for (let i = 0; i < frameSize; i++) sum += samples[off + i] * samples[off + i];
        env[f] = Math.sqrt(sum / frameSize);
    }
    return env;
}

self.onmessage = function(e) {
    // engine: 'spectral' (default) | 'energy' come from PARAMS config 
    // on main thread via postMessage payload.
    // Defaults for delta/wait/minGap mirror ex_beats.py constants.
    const { samples, sr, engine = 'spectral', delta = 0.07, wait = 8, minGap = 0.12 } = e.data;
    const HOP = 512, N = 2048, HALF = N / 2 + 1;

    // Hann window — precomputed once, reused every frame
    const win = new Float64Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 * (1 - Math.cos(2*Math.PI*i/(N-1)));

    const numFrames = Math.floor((samples.length - N) / HOP) + 1;

    // Single allocation for all per-frame working buffers.
    // No per-frame allocation means no GC pressure in the hot loop.
    const reArr   = new Float64Array(N);
    const imArr   = new Float64Array(N);
    const prevMag = new Float64Array(HALF);
    const curMag  = new Float64Array(HALF);
    const fluxBuf = new Float64Array(HALF);
    // envelope is reassigned for energy engine — declared with let
    let envelope = new Float64Array(numFrames);
    if (engine === 'spectral') {
    const TICK = Math.max(1, Math.floor(numFrames / 50));

    for (let f = 0; f < numFrames; f++) {
        const off = f * HOP;
        for (let i = 0; i < N; i++) { reArr[i] = samples[off+i] * win[i]; imArr[i] = 0; }
        fft(reArr, imArr);
        for (let k = 0; k < HALF; k++) curMag[k] = Math.sqrt(reArr[k]*reArr[k] + imArr[k]*imArr[k]);
        // Half-wave rectified spectral flux (only positive increases pass through)
        for (let k = 0; k < HALF; k++) { const d = curMag[k]-prevMag[k]; fluxBuf[k] = d > 0 ? d : 0; }
        // Median across bins — matches librosa aggregate=np.median, suppresses noise
        envelope[f] = median(fluxBuf);
        prevMag.set(curMag);
        if (f % TICK === 0) self.postMessage({ type:'progress', pct: Math.round(f/numFrames*75), label:'BUILDING ENVELOPE' });
    }
    } else {
        // ── Energy RMS path ───────────────────────────────────────
        // Build amplitude RMS envelope, then fall through to the shared
        // peak-pick pipeline below. No FFT needed — O(N) per frame.
        self.postMessage({ type:'progress', pct:40, label:'BUILDING ENERGY ENVELOPE' });
        envelope = buildEnergyEnvelope(samples, N, HOP);
    }

    // ── Shared peak-pick pipeline (both engines) ─────────────
    // Use envelope.length — energy path produces a different frame
    // count than the spectral path's pre-allocated numFrames.
    const envLen = envelope.length;
    self.postMessage({ type:'progress', pct:78, label:'PEAK PICKING' });

    // Normalize to [0,1] before peak picking and autocorrelation
    let maxVal = 0;
    for (let i = 0; i < envLen; i++) if (envelope[i] > maxVal) maxVal = envelope[i];
    if (maxVal > 0) for (let i = 0; i < envLen; i++) envelope[i] /= maxVal;

    // Adaptive threshold: mean + delta. delta from PARAMS (default 0.07 = ex_beats.py).
    // Lower delta → more sensitive (catches quieter hits, more false positives).
    // Higher delta → less sensitive (only strong transients pass).
    let sum = 0;
    for (let i = 0; i < envLen; i++) sum += envelope[i];
    const threshold = (sum / envLen) + delta;

    const WAIT = wait;  // min frames between peaks; from PARAMS
    const rawOnsets = [];
    let lastPeak = -WAIT - 1;

    for (let i = 1; i < envLen-1; i++) {
        const v = envelope[i];
        if (v > threshold && v >= envelope[i-1] && v >= envelope[i+1] && (i-lastPeak) >= WAIT) {
            // backtrack=True: snap to nearest preceding local minimum so the
            // timestamp lands on the attack transient, not the peak
            let snap = i;
            for (let j = i-1; j >= Math.max(0, i-WAIT); j--) {
                if (envelope[j] <= envelope[j+1]) snap = j; else break;
            }
            rawOnsets.push(snap);
            lastPeak = i;
        }
    }

    self.postMessage({ type:'progress', pct:90, label:'DE-DUPLICATION' });

    // Frames → seconds + de-dupe pass. minGap from PARAMS (default 0.12 = ex_beats.py MIN_GAP).
    // Raise minGap to suppress double-triggers on long decaying hits.
    const onsets = [];
    for (const f of rawOnsets) {
        const t = parseFloat(((f * HOP) / sr).toFixed(3));
        if (!onsets.length || (t - onsets[onsets.length-1]) >= minGap) onsets.push(t);
    }

    self.postMessage({ type:'progress', pct:95, label:'BPM DETECTION' });

    // Autocorrelation BPM — see bpmFromAutocorrelation() header comment
    const bpm = bpmFromAutocorrelation(envelope, sr, HOP);

    self.postMessage({ type:'progress', pct:100, label:'DONE' });
    self.postMessage({ type:'done', onsets, bpm });
};
`;

// ═══════════════════════════════════════════════════════════════════

// Derived lookup — avoids repeated .find() at runtime

    //                     name:  'Multi',

// ═══════════════════════════════════════════════════════════════════
// RENDER PARAM PANEL
// Builds param UI rows from PARAM_SPECS into a container element.
// Called once at page load for each engine, for both setup and session
// containers — 4 panels total, all sharing the same PARAMS object.
//
// container: DOM element to render into.
// specs:     array from PARAM_SPECS[engine].
// idSuffix:  appended to input IDs to keep them unique across panels
//            (setup vs session share the same spec but need distinct IDs).
// ═══════════════════════════════════════════════════════════════════

// Resolve a spec entry's params, following one level of inheritance.
// 'energy' inheriting 'spectral' means energy users get all spectral
// sliders — logical since both engines use the same delta/wait/minGap
// pipeline. No deep inheritance chain needed; one level is sufficient.
function resolveParams(engineId) {
    const spec = PARAM_SPECS[engineId];
    if (!spec) return [];
    if (spec.inherits) {
        const parent = PARAM_SPECS[spec.inherits]?.params ?? [];
        return [...parent, ...(spec.params ?? [])];
    }
    return spec.params ?? [];
}

function renderParamPanel(container, specs, idSuffix) {
    specs.forEach(spec => {
        const row = document.createElement('div');
        row.className = 'param-row';

        if (spec.type === 'slider') {
            row.innerHTML = `
                <div class="param-label-wrap">
                    <span class="param-label">${spec.label}</span>
                    <span class="param-hint-icon">ⓘ
                        <span class="param-tooltip">${spec.hint}</span>
                    </span>
                </div>
                <input class="param-slider"
                    type="range"

                // syncParam(spec.id, v, idSuffix);

            const optionsHtml = spec.options.map(opt => `

            row.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    // PARAMS[spec.id] = radio.value;
                    // syncParam(spec.id, radio.value, idSuffix);

                    broadcastChange(spec.id, radio.value, radio);
                });
            });
        }

        container.appendChild(row);
    });
}

// ═══════════════════════════════════════════════════════════════════
// BPM VIA AUTOCORRELATION — shared by both engines (main thread copy)
//
// This is a copy of the same function inside RADIX_WORKER_SRC.
// It cannot be shared directly because the worker runs in a separate
// global scope with no access to main-thread variables.
//
// Used by extractEssentia as a fallback. Essentia's result.bpm is 
// preferred when available and > 0; this runs only when it isn't 
// (e.g. degara method omits it).
//
// env: normalized Float32/64 Array of onset strengths (values 0–1).
// sr, HOP: sample rate and hop size used to convert lag → BPM.
// Search window: 40–240 BPM. Octave correction prefers higher tempo
// when the half-lag correlation is ≥ 93% of the peak (see worker
// header for full rationale).
// ═══════════════════════════════════════════════════════════════════
function bpmFromAutocorrelation(env, sr, HOP) {
    const frameRate = sr / HOP;
    const lagMin = Math.floor(frameRate * 60 / 240);
    const lagMax = Math.ceil(frameRate * 60 / 40);
    const N = env.length;
    let bestLag = lagMin, bestCorr = -Infinity;
    for (let lag = lagMin; lag <= Math.min(lagMax, N - 1); lag++) {
        let corr = 0;
        for (let i = 0; i < N - lag; i++) corr += env[i] * env[i + lag];
        corr /= (N - lag);
        if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
    }
    let bpm = Math.round(frameRate * 60 / bestLag);
    const halfLag = Math.round(bestLag / 2);
    if (halfLag >= lagMin) {
        let corrHalf = 0;
        for (let i = 0; i < N - halfLag; i++) corrHalf += env[i] * env[i + halfLag];
        corrHalf /= (N - halfLag);
        if (corrHalf >= bestCorr * 0.93) bpm = Math.round(frameRate * 60 / halfLag);
    }
    return bpm;
}

// ═══════════════════════════════════════════════════════════════════
// RADIX EXTRACTION (Worker wrapper)
// Main thread: decode → transfer Float32Array → Worker runs pipeline.
// Zero-copy transfer via Transferable — samples.buffer is detached after
// postMessage, preventing accidental re-use on main thread.
// ═══════════════════════════════════════════════════════════════════

// Worker Blob URL — created once, reused across sessions
let _radixWorkerUrl = null;

function getRadixWorkerUrl() {
    // Blob URL created once and reused — creating per-call would leak
    if (!_radixWorkerUrl) _radixWorkerUrl = URL.createObjectURL(new Blob([RADIX_WORKER_SRC], { type: 'text/javascript' }));
    return _radixWorkerUrl;
}

function extractRadix(audioFile, onProgress) {
    return new Promise(async (resolve, reject) => {
        onProgress(5, 'decoding audio…');

        let arrayBuffer;
        try { arrayBuffer = await audioFile.arrayBuffer(); }
        catch (err) { return reject(new Error('File read failed: ' + err.message)); }

        // AudioContext at native SR — avoids the timestamp drift that occurs
        // when the browser resamples to 44100 before we decode (same as sr=None in librosa)
        const tmpCtx = new AudioContext();
        let audioBuffer;
        try { audioBuffer = await tmpCtx.decodeAudioData(arrayBuffer); }
        catch (err) { await tmpCtx.close(); return reject(new Error('Decode failed: ' + err.message)); }

        const sr      = audioBuffer.sampleRate;
        const dur     = audioBuffer.duration;
        const samples = audioBuffer.getChannelData(0).slice(); // copy — original tied to AudioBuffer
        await tmpCtx.close();

        onProgress(10, `${sr} Hz · ${dur.toFixed(1)}s`);

        const worker = new Worker(getRadixWorkerUrl());
        state.activeWorker = worker;

        worker.onmessage = (e) => {
            const msg = e.data;
            if (msg.type === 'progress') { onProgress(msg.pct, msg.label); return; }
            if (msg.type === 'done') {
                worker.terminate(); state.activeWorker = null;
                console.log(`[Radix] onsets:${msg.onsets.length} bpm:${msg.bpm} sr:${sr} dur:${dur.toFixed(2)}s`);
                resolve({ onsets: msg.onsets, bpm: msg.bpm });
                return;
            }
            if (msg.type === 'error') { worker.terminate(); state.activeWorker = null; reject(new Error(msg.message)); }
        };
        worker.onerror = (err) => { worker.terminate(); state.activeWorker = null; reject(new Error('Worker: ' + err.message)); };

        // Transfer — zero-copy handoff, samples.buffer is detached after this call.
        // delta/wait/minGap come from PARAMS (user-configured or defaults).
        worker.postMessage({ samples, sr, engine: state.engine, delta: PARAMS.delta, wait: PARAMS.wait, minGap: PARAMS.minGap }, [samples.buffer]);
    });
}

    rafId:        null,   // rAF handle for seek bar loop; cancelled on cleanup
    activeWorker: null,   // kept so cancel can terminate mid-analysis
    // Serialised export strings — populated by finishSession()
    beatsJson: '', lyricsJs: '', beatsRaw: '', lyricsRaw: '',

    previewBlobUrl: null,
};

let _toastTimer = null;
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// showOverlay(engine) — shows the overlay with the correct indicator
// incremental progress → progress bar, else spinner (indeterminate)
function showOverlay(engine) {
    analysisBar.style.width = '0%';
    analysisLabel.textContent = 'ANALYZING AUDIO';
    analysisSub.textContent   = 'decoding…';
    const useBar = ENGINE_MAP[engine]?.useBar ?? true;
    analysisBarWrap.style.display     = useBar ? 'block' : 'none';
    analysisSpinWrap.style.display  = useBar ? 'none'  : 'flex';
    analysisOverlay.classList.add('visible');
}

// ═══════════════════════════════════════════════════════════════════
// SESSION CLEANUP
// Order matters: Worker first (stops sending messages), then rAF
// (stops the seek loop), then player (stops audio), then URL revoke.
// Reversing this order can cause rAF to reference a null player.
// ═══════════════════════════════════════════════════════════════════
function cleanupSession() {
    if (state.activeWorker) { state.activeWorker.terminate(); state.activeWorker = null; }
    if (state.rafId)        { cancelAnimationFrame(state.rafId); state.rafId = null; }
    if (state.player)       { state.player.pause(); state.player.src = ''; state.player = null; }
    if (state.playerUrl)    { URL.revokeObjectURL(state.playerUrl); state.playerUrl = null; }
    // Clear iframe src to stop any running FIZX visualizer
    // inside the preview then revoke the blob URL to free memory.
    previewFrame.src = 'about:blank';
    if (state.previewBlobUrl) { URL.revokeObjectURL(state.previewBlobUrl); state.previewBlobUrl = null; }
    previewWrap.classList.remove('visible');
    state.active = false; state.index = 0; state.results = []; state.beats = []; state.lyrics = []; state.bpm = 0;
    progressFill.style.width = '0%';
    seekFill.style.width = '0%';
    pbPlay.textContent = '▶';
}

// ═══════════════════════════════════════════════════════════════════
// TIME LOOP
// ═══════════════════════════════════════════════════════════════════
function startTimeLoop() {
    (function tick() {
        if (!state.player) return;
        const t   = state.player.currentTime;
        const dur = state.player.duration || 1;
        const pct = (t / dur) * 100;
        seekFill.style.width = pct + '%';
        const m  = Math.floor(t / 60);
        const s  = String(Math.floor(t % 60)).padStart(2, '0');
        const dm = Math.floor(dur / 60);
        const ds = String(Math.floor(dur % 60)).padStart(2, '0');
        timeDisplay.textContent = `${m}:${s} / ${dm}:${ds}`;
        state.rafId = requestAnimationFrame(tick);
    })();
}

function updateProgress() {
    if (state.lyrics.length > 0)
        progressFill.style.width = `${(state.index / state.lyrics.length) * 100}%`;
}

// ═══════════════════════════════════════════════════════════════════
// PLAYBACK CONTROLS
// ═══════════════════════════════════════════════════════════════════
pbPlay.addEventListener('click', () => {
    if (!state.player) return;
    if (state.player.paused) {
        state.player.play();
        state.active = true;
        pbPlay.textContent = '⏸';
        if (!state.rafId) startTimeLoop();
    } else {
        state.player.pause();
        state.active = false;
        pbPlay.textContent = '▶';
    }
});

pbStop.addEventListener('click', () => {
    if (!state.player) return;
    state.player.pause();
    state.player.currentTime = 0;
    state.active = false;
    pbPlay.textContent = '▶';
});

// Seek by clicking the seek track — maps click X to audio position
seekTrack.addEventListener('click', (e) => {
    if (!state.player || !state.player.duration) return;
    const rect = seekTrack.getBoundingClientRect();
    const pct  = (e.clientX - rect.left) / rect.width;
    state.player.currentTime = pct * state.player.duration;
});

// ═══════════════════════════════════════════════════════════════════
// ENGINE AND PARAM PANEL INIT + MODE CHANGE LISTENERS
// Rendered once from ENGINE_REGISTRY at load time.
// Engine and mode changes update visibility without re-rendering.
// ═══════════════════════════════════════════════════════════════════

// Immediately Invoked Function Expression (IIFE)
// ( ... )();
// Defines and immediately executes the function 
// in one step when the script loads. It's a 
// self-contained initialization block that doesn't 
// pollute the global scope with temporary variables.
// Although it is named but not usable elsewhere.
// Also works (arrow function)
// (() => { ... })();
// Also works (no name)
// (function() { ... })();
(function initEngineSelector() {
    eSelector.innerHTML = ENGINE_REGISTRY.map((e, i) => `
        <div class="mode-option">
            <input type="radio" name="engine"
                id="engine-${e.id}" value="${e.id}"
                ${i === 0 ? 'checked' : ''}>
            <label for="engine-${e.id}">
                <span class="mode-title">${e.label}</span>
                <span class="mode-desc">${PARAM_SPECS[e.id]?.desc ?? ''}</span>
            </label>
        </div>`).join('');

    // Re-attach change listeners after innerHTML replacement
    eSelector.querySelectorAll('input[type="radio"]').forEach(r =>
        r.addEventListener('change', updateParamVisibility)
    );
})();

(function initParamPanels() {
    // Render all panels in both setup and session
    // driven by registry, generates all containers dynamically 
    // So HTML containers don't need to exist in advance
    ENGINE_REGISTRY.forEach(e => {
        const specs = resolveParams(e.id);

        // Setup panel
        const setupEl = document.createElement('div');
        setupEl.id        = `params-${e.id}`;
        setupEl.className = 'param-panel';
        setupParent.appendChild(setupEl);
        renderParamPanel(setupEl, specs, `${e.id}-setup`);

        // Session panel
        const sessionEl = document.createElement('div');
        sessionEl.id        = `session-params-${e.id}`;
        sessionEl.className = 'param-panel';
        sessionParent.appendChild(sessionEl);
        renderParamPanel(sessionEl, specs, `${e.id}-session`);
    });
    // Set initial visibility
    updateParamVisibility();
})();

// update all matching PARAM elements at once
window.addEventListener('paramSync', (e) => {
    const { id, value, origin } = e.detail;

    // Find everything linked to this paramId
    document.querySelectorAll(`[data-param-id="${id}"]`).forEach(el => { // UI elements decoupled, they just need to know their own data-param-id
        if (el === origin) return; // Don't fight the user's current input

        if (el.type === 'range') {
            el.value = value;
        } else if (el.type === 'radio') {
            if (el.value === value) el.checked = true;
        }
    });

    // Sync all text value labels (param-value spans)
    // find the format function from the first spec we find in PARAM_SPECS
    const spec = Object.values(PARAM_SPECS).flatMap(p => p.params || []).find(s => s.id === id);
    if (spec && spec.fmt) {
        document.querySelectorAll(`[data-val-for="${id}"]`).forEach(valEl => {
            valEl.textContent = spec.fmt(parseFloat(value));
        });
    }
});

// ═══════════════════════════════════════════════════════════════════
// START SESSION
// ═══════════════════════════════════════════════════════════════════
function onProgress(pct, label) {
    analysisBar.style.width = pct + '%';
    analysisSub.textContent = label; // sub-label, not the main label
}

startBtn.addEventListener('click', async () => {
    if (!state.audioFile) { toast('Drop an audio file first'); return; }

    state.lyrics = lyricsInput.value.split('\n').filter(l => l.trim());
    state.mode   = document.querySelector('input[name="mode"]:checked').value;
    state.engine = document.querySelector('input[name="engine"]:checked')?.value || 'spectral';
    startBtn.textContent = '⏳ STARTING…';
    startBtn.disabled    = true;

    try {
        if (state.mode === 'snap') {
            showOverlay(state.engine);

            // engine is now passed inside the 
            // Worker payload, no main-thread dispatch needed
            const result = await extractRadix(state.audioFile, onProgress);
            
            state.beats = result.onsets;
            state.bpm   = result.bpm;
            analysisOverlay.classList.remove('visible');

            if (!state.beats.length) {
                toast('No onsets detected — switching to manual mode');
                state.mode = 'buffer';
            }
        }

        // Build audio player — store URL separately for reliable revoke later
        state.playerUrl = URL.createObjectURL(state.audioFile);
        state.player    = new Audio(state.playerUrl);
        state.results   = [];
        state.index     = 0;

        totalLinesSpan.textContent  = state.lyrics.length || '∞';
        lineCounterSpan.textContent = '0';
        bpmDisplay.textContent      = state.bpm > 0 ? `${state.bpm} BPM` : 'BPM —';
        // Enable auto-assign now that beats are available
        document.getElementById('auto-assign-btn').disabled = false;
        currLine.textContent        = state.lyrics.length > 0
            ? state.lyrics[0]
            : '⌁ NO LYRICS — TAPS MARK BEATS';

        setupView.style.display   = 'none';
        sessionView.style.display = 'block';
        outputView.style.display  = 'none';
        pbPlay.textContent        = '⏸';
        updateParamVisibility(); // syncs session-params panel visibility with current mode/engine

        await state.player.play();
        state.active = true;
        startTimeLoop();
        updateProgress();

    } catch (err) {
        analysisOverlay.classList.remove('visible');
        console.error('Setup failed:', err);
        toast('Setup failed: ' + (err.message || err));
        startBtn.textContent = 'START SESSION';
        startBtn.disabled    = false;
    }
});

// ═══════════════════════════════════════════════════════════════════
// SPACEBAR TAP
// Runs regardless of whether audio is playing (active flag allows
// tapping while paused, useful for careful re-tapping).
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('keydown', (e) => {
    // Guard: only handle space when session view is visible
    if (e.code !== 'Space' || !state.player || sessionView.style.display === 'none') return;
    e.preventDefault();

    let t = state.player.currentTime;
    if      (state.mode === 'buffer')                        t = Math.max(0, t - 0.2);
    else if (state.mode === 'snap' && state.beats.length)    t = state.beats.reduce((p,c) => Math.abs(c-t) < Math.abs(p-t) ? c : p);

    state.results.push({
        text:  state.lyrics[state.index] || `beat_${state.index + 1}`,
        start: parseFloat(t.toFixed(3)),
        end:   parseFloat((t + 1).toFixed(3)),
    });

    state.index++;
    lineCounterSpan.textContent = state.index;
    updateProgress();

    const overflow = (state.index - state.lyrics.length) + 1;

    if (overflow > 0) {
        currLine.textContent = `✓ ALL LYRICS + ${overflow} BEATS MARKED`;
        // Keep player running so user can review timing before finishing
    } else {
        currLine.textContent = state.lyrics.length > 0
            ? state.lyrics[state.index]
            : `⌁ ${state.index} BEATS MARKED`;
    }
});

// ═══════════════════════════════════════════════════════════════════
// AUTO-ASSIGN
// Maps state.lyrics[i] directly to state.beats[i] without tapping.
// End timestamp uses beats[i+1] when available; falls back to
// start + median inter-beat interval so the last line isn't zero-length.
//
// Works best with the Energy engine on vocal-prominent tracks where
// amplitude attacks align with lyric delivery. On dense mixes the
// mapping degrades gracefully — wrong assignments are correctable in
// the preview editor without re-tapping the whole session.
//
// Overwrites state.results entirely — previous taps are discarded.
// Re-tapping remains available at any point after.
// ═══════════════════════════════════════════════════════════════════
function autoAssignLyrics() {
    if (!state.beats.length)  { toast('Run beat extraction first'); return; }
    if (!state.lyrics.length) { toast('No lyrics to assign'); return; }

    // Median inter-beat interval as fallback end-time for the last line.
    // Median beats mean so a single long outro gap doesn't inflate the estimate.
    const intervals = [];
    for (let i = 1; i < state.beats.length; i++)
        intervals.push(state.beats[i] - state.beats[i - 1]);
    const sorted = [...intervals].sort((a, b) => a - b);
    const medianInterval = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 1.0;

    state.results = state.lyrics.map((text, i) => {
        const start = parseFloat((state.beats[i] ?? state.beats[state.beats.length - 1]).toFixed(3));
        const end   = parseFloat((state.beats[i + 1] ?? start + medianInterval).toFixed(3));
        return { text, start, end };
    });

    state.index = state.results.length;
    lineCounterSpan.textContent = state.index;
    updateProgress();

    // When there are more lyrics than beats the overflow lines 
    // share the last onset with a visible warning in the toast 
    // and the stage display
    const overflow = state.lyrics.length - state.beats.length;
    const note     = overflow > 0 ? ` (${overflow} lines share last beat — trim in editor)` : '';
    currLine.textContent = `⚡ AUTO-ASSIGNED ${state.results.length} LINES${note ? ' ⚠' : ''}`;
    toast(`⚡ ${state.results.length} lines assigned${note}`);

    // Sync editor and refresh iframe if preview is already open
    renderPreviewEditor();
    if (previewWrap.classList.contains('visible')) refreshPreviewIframe();
}

document.getElementById('auto-assign-btn').addEventListener('click', autoAssignLyrics);

// ═══════════════════════════════════════════════════════════════════
// PREVIEW — floating panel, draggable + resizable
// Builds a fizx_compiled.html string from current tap state and injects
// it into the sandboxed iframe. Works with zero spacebar taps (renders
// the visualizer without any lyrics).
//
// The preview reuses buildFizxHtml() — the same function used by the
// generate button — so what you preview is exactly what you export.
//
// WHY BLOB URL INSTEAD OF srcdoc:
// srcdoc="<html>...<script>...<\/script>...</html>" is parsed by the
// browser's HTML parser as an attribute value. The parser terminates
// any <script> block at the first literal <\/script> it encounters in
// the attribute, even when that token appears inside a JS string
// inside the script. The compiled FIZX template contains <\/script>
// inside its own script block (e.g. in template literal content),
// which causes the iframe to stop executing mid-JS, silently.
//
// logic: create a Blob URL and set iframe.src. The browser fetches the
// blob as a standalone HTML document with a fresh parser — no
// attribute-value context, no premature <\/script> termination.
// The sandbox attribute still applies; the blob origin is null.
// ═══════════════════════════════════════════════════════════════════
function buildFizxHtml() {
    const lyricsRaw = JSON.stringify(state.results);
    const beatsRaw  = JSON.stringify(state.beats);
    return FIZX_TEMPLATE
        .replace(/\[\[LYRICS_DATA\]\]/g, lyricsRaw)
        .replace(/\[\[BEATS_DATA\]\]/g,  beatsRaw)
        .replace(/\[\[BPM_DATA\]\]/g,    String(state.bpm || 0));
}

// Revokes stale blob URL, creates new one, sets src.
function refreshPreviewIframe() {
    // Always revoke before creating — accumulating blob URLs leaks memory
    if (state.previewBlobUrl) {
        URL.revokeObjectURL(state.previewBlobUrl);
        state.previewBlobUrl = null;
    }
    state.previewBlobUrl = URL.createObjectURL(new Blob([buildFizxHtml()], { type: 'text/html' }));
    previewFrame.src = state.previewBlobUrl;
}

// Preview editor, rebuilds timing rows from state.results.
// Full re-render on every structural change (add/delete).
// Acceptable for expected sizes (<300 lines); avoids index-offset bugs
// that event delegation on a mutable list would introduce.
function renderPreviewEditor() {
    const editor = document.getElementById('preview-editor');
    const empty  = document.getElementById('preview-editor-empty');
    editor.querySelectorAll('.edit-row').forEach(r => r.remove());

    if (!state.results.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    state.results.forEach((result, i) => {
        const row = document.createElement('div');
        row.className = 'edit-row';
        row.innerHTML = `
            <input type="text"   class="edit-text"  value="${result.text.replace(/"/g, '&quot;')}" title="Lyric text">
            <input type="number" class="edit-start" value="${result.start}" step="0.001" min="0" title="Start (s)">
            <input type="number" class="edit-end"   value="${result.end}"   step="0.001" min="0" title="End (s)">
            <button class="edit-row-del" title="Delete">×</button>`;

        // Inputs write directly to state.results[i] — Refresh picks up changes
        row.querySelector('.edit-text').addEventListener('input',  e => { state.results[i].text  = e.target.value; });
        row.querySelector('.edit-start').addEventListener('input', e => { state.results[i].start = parseFloat(parseFloat(e.target.value).toFixed(3)) || 0; });
        row.querySelector('.edit-end').addEventListener('input',   e => { state.results[i].end   = parseFloat(parseFloat(e.target.value).toFixed(3)) || 0; });

        // Delete: splice + full re-render to fix closure indices
        row.querySelector('.edit-row-del').addEventListener('click', () => {
            state.results.splice(i, 1);
            state.index = Math.min(state.index, state.results.length);
            lineCounterSpan.textContent = state.index;
            renderPreviewEditor();
        });

        editor.appendChild(row);
    });
}

// Add blank line at current playback position for missed taps
document.getElementById('preview-add-btn').addEventListener('click', () => {
    const t = state.player ? parseFloat(state.player.currentTime.toFixed(3)) : 0;
    state.results.push({ text: '', start: t, end: parseFloat((t + 1).toFixed(3)) });
    state.index = state.results.length;
    lineCounterSpan.textContent = state.index;
    renderPreviewEditor();
    const editor = document.getElementById('preview-editor');
    editor.scrollTop = editor.scrollHeight;
});

// Show / refresh / close
function showPreview() {
    renderPreviewEditor();
    refreshPreviewIframe();
    previewWrap.classList.add('visible');
}

document.getElementById('preview-btn').addEventListener('click', showPreview);

// Deliberate choice not to auto-refresh the iframe on every keystroke. 
// The iframe navigation itself has a small cost and more importantly 
// would reset the FIZX animation state mid-edit. The user clicks Refresh
// when they want to see the result. This also makes it clear that the
// iframe is a render of the saved state, not a live binding.
document.getElementById('preview-refresh-btn').addEventListener('click', () => {
    refreshPreviewIframe();
    toast('Preview refreshed');
});

document.getElementById('close-preview-btn').addEventListener('click', () => {
    previewFrame.src = 'about:blank'; // halts iframe JS immediately
    if (state.previewBlobUrl) { URL.revokeObjectURL(state.previewBlobUrl); state.previewBlobUrl = null; }
    previewWrap.classList.remove('visible');
});

// Drag (titlebar)
// Pointer offset from panel corner tracked at drag-start so the panel
// doesn't jump to cursor. Listeners on document catch fast moves that
// leave the titlebar during drag.
;(function initPreviewDrag() {
    const titlebar = document.getElementById('preview-titlebar');
    let dragging = false, ox = 0, oy = 0;

    function startDrag(cx, cy) {
        dragging = true;
        const r = previewWrap.getBoundingClientRect();
        ox = cx - r.left; oy = cy - r.top;
        document.addEventListener('mousemove', onMouse);
        document.addEventListener('mouseup', stop);
        document.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('touchend', stop);
    }
    function onMouse(e) { if (dragging) move(e.clientX, e.clientY); }
    function onTouch(e) { if (dragging) move(e.touches[0].clientX, e.touches[0].clientY); }
    function move(cx, cy) {
        const w = previewWrap.offsetWidth, h = previewWrap.offsetHeight;
        const x = Math.max(0, Math.min(window.innerWidth  - w, cx - ox));
        const y = Math.max(0, Math.min(window.innerHeight - h, cy - oy));
        previewWrap.style.left  = x + 'px';
        previewWrap.style.top   = y + 'px';
        previewWrap.style.right = 'auto'; // clear initial CSS right:24px
    }
    function stop() {
        dragging = false;
        document.removeEventListener('mousemove', onMouse);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchmove', onTouch);
        document.removeEventListener('touchend', stop);
    }

    titlebar.addEventListener('mousedown',  e => startDrag(e.clientX, e.clientY));
    titlebar.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
})();

// Resize (corner handle)
// Tracks delta from resize-start dimensions. Min size enforced to keep
// editor and iframe usable (260×300).
;(function initPreviewResize() {
    const handle = document.getElementById('preview-resize');
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;

    function startResize(cx, cy) {
        resizing = true;
        sx = cx; sy = cy;
        sw = previewWrap.offsetWidth; sh = previewWrap.offsetHeight;
        document.addEventListener('mousemove', onMouse);
        document.addEventListener('mouseup', stop);
        document.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('touchend', stop);
    }
    function onMouse(e) { if (resizing) resize(e.clientX, e.clientY); }
    function onTouch(e) { if (resizing) resize(e.touches[0].clientX, e.touches[0].clientY); }
    function resize(cx, cy) {
        previewWrap.style.width  = Math.max(260, sw + cx - sx) + 'px';
        previewWrap.style.height = Math.max(300, sh + cy - sy) + 'px';
    }
    function stop() {
        resizing = false;
        document.removeEventListener('mousemove', onMouse);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchmove', onTouch);
        document.removeEventListener('touchend', stop);
    }

    handle.addEventListener('mousedown',  e => startResize(e.clientX, e.clientY));
    handle.addEventListener('touchstart', e => startResize(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
})();

// ═══════════════════════════════════════════════════════════════════
// FINISH
// Empty results produce an empty LYRICS array.
// This is intentional: users may want to export beats-only
// or just test the template without any lyric timestamps.
// ═══════════════════════════════════════════════════════════════════
finishBtn.addEventListener('click', () => {
    if (state.player) state.player.pause();
    if (state.rafId)  { cancelAnimationFrame(state.rafId); state.rafId = null; }
    pbPlay.textContent = '▶';

    // Serialise export data — results may be empty array, which is valid
    state.beatsJson = JSON.stringify(state.beats, null, 2);
    state.lyricsJs  = 'export const LYRICS = ' + JSON.stringify(state.results, null, 2) + ';';
    state.beatsRaw  = JSON.stringify(state.beats);
    state.lyricsRaw = JSON.stringify(state.results);

    const tapNote = state.results.length === 0 ? ' (no taps)' : '';
    exportSummary.textContent = `${state.results.length} lines${tapNote} · ${state.beats.length} onsets · ${state.bpm || '—'} BPM`;

    sessionView.style.display = 'none';
    outputView.style.display  = 'block';
});

// ═══════════════════════════════════════════════════════════════════
// CANCEL
// ═══════════════════════════════════════════════════════════════════
cancelBtn.addEventListener('click', () => {
    cleanupSession();
    analysisOverlay.classList.remove('visible');
    setupView.style.display   = 'block';
    sessionView.style.display = 'none';
    outputView.style.display  = 'none';
    startBtn.disabled    = false;
    startBtn.textContent = 'START SESSION';
});

// ═══════════════════════════════════════════════════════════════════
// RE-ANALYZE
// Re-runs beat extraction with the current PARAMS without resetting
// taps, player position, or lyrics. state.beats and state.bpm are
// updated in place. Preview picks up the new beats on next open
// because buildFizxHtml() reads state.beats at call time, not at
// session start.
// ═══════════════════════════════════════════════════════════════════
document.getElementById('reanalyze-btn').addEventListener('click', async () => {
    if (!state.audioFile || state.mode !== 'snap') {
        toast('Re-analyze not available in manual mode');
        return;
    }
    const btn = document.getElementById('reanalyze-btn');
    btn.disabled    = true;
    btn.textContent = '↺ ANALYZING…';
    // Read engine selection fresh — user may have changed it since session start
    state.engine = document.querySelector('input[name="engine"]:checked')?.value || 'spectral';

    showOverlay(state.engine);

    try {
        const result = await extractRadix(state.audioFile, onProgress);
        state.beats = result.onsets;
        state.bpm   = result.bpm;
        bpmDisplay.textContent = state.bpm > 0 ? `${state.bpm} BPM` : 'BPM —';
        toast(`↺ ${state.beats.length} onsets · ${state.bpm} BPM`);
    } catch (err) {
        console.error('Re-analyze failed:', err);
        toast('Re-analyze failed: ' + (err.message || err));
    } finally {
        analysisOverlay.classList.remove('visible');
        btn.disabled    = false;
        btn.textContent = '↺ RE-ANALYZE';
    }
});

// ═══════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════
document.getElementById('generate-fizx-btn').addEventListener('click', () => {
    download('fizx_compiled.html', buildFizxHtml());
});

document.getElementById('download-beats-btn').addEventListener('click', () =>
    // beats.json includes bpm so it matches ex_beats.py output format exactly
    download('beats_tapper.json', JSON.stringify({ beats: state.beats, bpm: state.bpm }, null, 2))
);
document.getElementById('download-lyrics-btn').addEventListener('click', () =>
    download('lyrics_tapper.js', state.lyricsJs)
);
document.getElementById('copy-beats-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(state.beatsRaw); toast('⎘ Beats copied');
});
document.getElementById('copy-lyrics-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(state.lyricsRaw); toast('⎘ Lyrics copied');
});
document.getElementById('new-session-btn').addEventListener('click', () => {
    cleanupSession();
    setupView.style.display = 'block'; 
    sessionView.style.display = 'none'; 
    outputView.style.display = 'none';
    startBtn.disabled = false; 
    startBtn.textContent = 'START SESSION';
    lyricsInput.value = '';
    dropZone.innerHTML = 'DROP AUDIO FILE<div class="dz-hint">MP3 · WAV · OGG · FLAC</div>';
    fileInput.value = '';  // Without it, re-selecting the same file fires no change event
    dropZone.classList.remove('loaded');
    state.audioFile = null; state.beats = []; state.lyrics = []; state.bpm = 0;
});
document.getElementById('cnt-session-btn').addEventListener('click', () => {
    // Restore session view — player already exists, just resume UI state.
    // Does not restart analysis or reset taps.
    outputView.style.display = 'none';
    sessionView.style.display = 'block'; 
    // Restart seek loop (was stopped by finishBtn handler)
    if (state.player && !state.rafId) startTimeLoop();
    // Restore play button icon to match actual player state
    pbPlay.textContent = state.player && !state.player.paused ? '⏸' : '▶';
    // Re-sync session-params visibility in case engine changed in output view
    updateParamVisibility();
    // Restore active flag if there are lyrics remaining to tap
    if (state.player && state.index < state.lyrics.length) state.active = true;
});

// download() creates and immediately revokes the blob URL to avoid memory leaks
function download(filename, content) {
    const url = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    a.click();
    // 100ms delay gives the browser time to initiate the download before revoke
    setTimeout(() => URL.revokeObjectURL(url), 100);
}

// ═══════════════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════════════
function setAudioFile(file) {
    if (!file || !file.type.startsWith('audio/')) { toast('Drop an audio file (MP3, WAV, OGG, FLAC)'); return; }
    state.audioFile = file;
    dropZone.innerHTML = `${file.name}<div class="dz-hint">${(file.size/1048576).toFixed(1)} MB</div>`;
    dropZone.classList.add('loaded');
}

dropZone.addEventListener('click',     () => fileInput.click());
dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop',      (e) => { e.preventDefault(); dropZone.classList.remove('hover'); setAudioFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change',   (e) => setAudioFile(e.target.files[0]));
</script>
</body>
