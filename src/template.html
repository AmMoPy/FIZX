<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>[[TITLE_DATA]]</title>
    <!-- Self-hosted subsetted fonts — no network request, works fully offline.
         Base64 strings injected by compile.py from generated .b64 files in assets/fonts/.-->    
    <style>
        /* @@FONTS@@ */
        /* @@END_FONTS@@ */
    </style>
    <style>
        /* ── DESIGN TOKENS (defaults overwritten at runtime by applyPreset) ── */
        :root {
            --bg-body:       #030603;
            --bg-container:  linear-gradient(145deg,#141a14,#0a0f0a);
            --bg-screen:     #0a0e0a;
            --border-screen: #2a4a2a;
            --color-primary: #1eff00;
            --color-dim:     #3c9e3c;
            --color-faint:   #2a8a2a;
            --color-muted:   #3a7a3a;
            --shadow-outer:  0 0 0 2px #1a3a1a,0 20px 40px rgba(0,0,0,0.5);
            --shadow-screen: inset 0 0 25px rgba(0,255,0,0.06);
            --bg-stats:      #0a0c0a;
            --bg-btn:        #1a2a1a;
            --border-btn:    #3c9e3c;
            --color-btn:     #aaffaa;
            --flash-color:   rgba(0,255,0,0.4);
            --prim:          'merri','deja','Consolas',monospace; /* DejaVuSans for Arabic fallback */
            --crt-on:        0;
        }

        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--prim);
            transition: background 0.5s;
        }

        svg {
            vertical-align: middle; /* SVGs often sit slightly "higher" than text */
            margin-bottom: 0.125em; /* Fine-tune to align with font baseline */
        }

        /* ── MP4 Export ───────────────────────────────────────────────── */
        body.mp4-exporting .seekbar-container,
        body.mp4-exporting .stats,
        body.mp4-exporting .controls,
        body.mp4-exporting .status-text { display: none; }
        body.mp4-exporting .stage { box-shadow: unset; }
        #mp4-export-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            color: #fff; font: 14px/1.5 monospace;
            align-items: center; justify-content: center; flex-direction: column; gap: 12px;
        }
        body.mp4-exporting #mp4-export-overlay { display: flex; }

        /* ── STAGE ────────────────────────────────────────────────────
           9:16 default. .ar-landscape flips to 16:9.
           max-width = min() prevents overflow on both axes.
        ── */
        .stage {
            aspect-ratio: 9 / 16;
            max-width: min(100vw, calc(100vh * 9 / 16));
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-outer);
            transition: box-shadow 0.5s, max-width 0.3s, aspect-ratio 0.3s;
        }
        .stage.ar-landscape {
            aspect-ratio: 16 / 9;
            max-width: min(100vw, calc(100vh * 16 / 9));
        }

        .container {
            width: 100%;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            padding: 5px 2px 14px 2px;
            transition: background 0.5s;
        }

        /* ── SCREEN ──────────────────────────────────────────────────── */
        .screen {
            flex: 1;
            background: var(--bg-screen);
            border-radius: 10px;
            box-shadow: var(--shadow-screen);
            position: relative; /* works with current circle drag math without extra work */
            overflow: hidden;   /* hidden enables circle dragging to naturally clips at the screen edge rather than escaping it, no extra clamping needed */
            border: 1px solid var(--border-screen);
            margin-bottom: 6px;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }

        /* CRT scanlines — CSS pseudo-elements, GPU composited.
           Toggled via .crt-on class by applyPreset(). */
        .screen.crt-on::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: repeating-linear-gradient(
                0deg,
                var(--crt-color, transparent) 0px, 
                var(--crt-color, transparent) 2px,
                transparent 2px, transparent 5px
            );
        }
        /* Active Scanline */
        .screen.crt-on.scan-active::before {
            background:
                repeating-linear-gradient(
                    0deg,
                    var(--crt-color, transparent) 0px, 
                    var(--crt-color, transparent) 2px,
                    transparent 2px,transparent 5px
                ),
                linear-gradient(
                    to bottom,
                    transparent 0%, 
                    var(--scan-color, transparent) 50%, 
                    transparent 100%
                );
            background-size:100% 100%,100% 30%;
            animation:var(--scan-anim, none);
            will-change: background-position;
        }
        /* Permanent Vignette Shadow */
        .screen.crt-on::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at 50% 40%, transparent 50%, rgba(0,0,0,0.5) 100%);
        }

        #scanBtn[aria-pressed="false"] { opacity: 0.45; }
        #scanBtn:disabled { opacity: 0.2; cursor: default; }
        #beatSens { width: 64px; height: 18px; accent-color: var(--color-primary); }
        #beatSens[hidden] { display: none; }

        /* Screen flash — animates box-shadow via CSS keyframe.
           The browser GPU compositor runs this at native frame rate
           with zero JS involvement after the class is added. */
        @keyframes kScreenFlash {
            0%  { box-shadow: inset 0 0 60px var(--flash-color), 0 0 20px var(--flash-color); }
            100%{ box-shadow: var(--shadow-screen); }
        }
        .screen.screen-flash { animation: kScreenFlash 0.12s ease-out forwards; }
        /* own screen-flash-LUT class rather than reusing .screen-flash — reusing .screen-flash 
        for LUT directly would mean setting animation-direction:reverse on the same class discrete 
        mode uses for its normal forward one-shot flash, breaking that instead. */
        .screen.screen-flash-LUT {
            animation: kScreenFlash 1000ms linear paused;
            animation-direction: reverse;  /* kScreenFlash is bright(0%) -> neutral(100%) */
            animation-fill-mode: both;
        }

        /* ── MASTER CANVAS ───────────────────────────────────────────── */
        /* Renders: background fill, CRT (canvas version when crt-on),
           dust particles, visualizer drawImage.
           Does NOT render: lyrics, flash — those stay in the DOM
           where the CSS engine animates them at native quality. */
        #masterCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* ── LYRIC AREA ──────────────────────────────────────────────── */
        /* Sits above the canvas in z-order. The CSS engine handles all
           text rendering and animation — subpixel antialiasing, kerning,
           hardware-accelerated transforms. No canvas approximation. */
        .lyric-area {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 30px 20px 80px 20px;
            pointer-events: none;
        }

        .current-line {
            font-family: var(--prim);
            font-size: clamp(2.5rem, 6vw, 2.8rem);
            font-weight: bold;
            color: var(--color-primary);
            margin-bottom: 16px;
            line-height: 1.4;
            will-change: transform, opacity, filter;
            transition: color 0.5s;
            white-space: pre-line; /* Supports Line Breaks, \n renders as <br> zero JS change required */
        }

        /* continuous vocal-driven breathing scale lives on the wrapper so it
           composes with whatever transform animation on #currentLine itself */
        .lyric-breathe {
            will-change: transform;
        }
        
        #lineIO{
            position: relative
        }

        #lineGlow{
            position: absolute;
            inset: 0;
            pointer-events: none;
            color: var(--viz-glow,#fff);
            filter: blur(10px);
            opacity: 0;
            will-change: opacity;
            font: inherit;
            text-align: inherit
        }

        .next-line {
            font-family: var(--prim);
            font-size: clamp(0.5rem, 3vw, 1rem);
            color: var(--color-dim);
            opacity: 0.7;
            border-top: 1px dashed var(--color-faint);
            padding-top: 15px;
            transition: color 0.5s, border-color 0.5s;
        }

        /* ── VISUALIZER WRAP ─────────────────────────────────────────── */
        /* Invisible positioning anchor — the visualizer's canvas is
           drawImage'd onto masterCanvas each frame. visWrap itself is
           never painted; it just provides getBoundingClientRect(). */
        .visualizer-wrap {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            visibility: hidden;
            pointer-events: none;
            z-index: 2;
        }

        /* ── SPECTRUM CIRCLE ─────────────────────────────────────────── */
        /* Visible, positioned, draggable canvas*/
        .spectrum-circle-outer {
            position: absolute;
            left: 50%; top: 55%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            z-index: 3;
            cursor: grab;
            touch-action: none;
        }        
        .spectrum-circle-outer.dragging { cursor: grabbing; }
        .spectrum-circle-wrap {
            position: relative; /* positioning context for the visualizer's own canvas */
            /* inner wrap's rendered size changes whenever the outer's does */
            width: 100%;
            height: 100%;
        }
        .spectrum-circle-wrap canvas { pointer-events: none; } /* drag handled on the wrap, not the canvas */
        .circle-resize-handle {
            position: absolute; right: -6px; bottom: -6px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--viz-color, #fff);
            opacity: 0; cursor: nwse-resize; touch-action: none;
        }
        /* Reveal when the pointer is anywhere over the container */
        #spectrumCircleOuter:hover .circle-resize-handle,
        .circle-resize-handle:hover { opacity: 1; pointer-events: auto; }            

        /* ── SEEKBAR ─────────────────────────────────────────────────── */
        .seekbar-container {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 0 10px;
        }
        #seekBar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: var(--bg-btn);
            outline: none;
            cursor: pointer;
        }
        #seekBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: 0 0 4px var(--color-dim);
        }
        #seekBar::-moz-range-thumb {
            width: 10px; height: 10px;
            border: none; border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
        }

        /* ── STATS BAR ───────────────────────────────────────────────── */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--color-faint);
            font-size: 8px;
            background: var(--bg-stats);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
            transition: background 0.5s, color 0.5s;
        }

        /* ── CONTROLS ────────────────────────────────────────────────── */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .controls-row-main {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        /* ── Playlist controls and capped dropdowns ──── */
        .controls-row-sel { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .dd { position: relative; display: inline-block; }
        .dd[hidden] { display: none; }
        .dd-btn { display: flex; align-items: center; gap: 4px; height: 26px; max-width: 120px; padding: 0 6px; box-sizing: border-box;
                  background: var(--bg-btn); color: var(--color-btn); border: 1px solid var(--border-btn); border-radius: 6px;
                  font: bold 0.7rem monospace; cursor: pointer; user-select: none; transition: border-color 0.4s, color 0.4s, background 0.4s; }
        .dd-btn:hover, .dd-btn:focus-visible { border-color: var(--color-primary); outline: none; }
        .dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dd-caret { opacity: 0.7; font-size: 0.6rem; }
        .dd-pop { position: fixed; z-index: 9998; background: var(--bg-btn); color: var(--color-btn); border: 1px solid var(--border-btn);
                  border-radius: 6px; font: bold 0.7rem monospace; box-shadow: 0 6px 18px rgba(0,0,0,0.45); overflow: hidden; }
        .dd-bar { display: flex; justify-content: flex-end; gap: 4px; padding: 3px 4px; border-bottom: 1px solid var(--border-btn); }
        .dd-tool { min-width: 20px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; border: 1px solid var(--border-btn);
                   border-radius: 4px; cursor: pointer; font-size: 0.62rem; }
        .dd-tool:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .dd-scroll { overflow-y: auto; overscroll-behavior: contain; }
        .dd-spacer { position: relative; }
        .dd-rows { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
        .dd-row { display: flex; align-items: center; gap: 4px; padding: 0 6px; box-sizing: border-box; cursor: pointer; }
        .dd-row:hover, .dd-row.act { background: rgba(255,255,255,0.08); }
        .dd-row.sel { color: var(--color-primary); }
        .dd-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dd-x { opacity: 0.55; padding: 0 3px; cursor: pointer; }
        .dd-x:hover { opacity: 1; color: #f66; }
        /* Icon-only circular buttons — tooltip via data-tip + ::after */
        button {
            background: var(--bg-btn);
            border: 1px solid var(--border-btn);
            color: var(--color-btn);
            font-family: monospace;
            font-weight: bold;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: filter 0.1s, box-shadow 0.1s, border-color 0.4s, color 0.4s, background 0.4s;
        }
        button:hover { filter:brightness(1.5); box-shadow:0 0 8px var(--color-primary); }
        button::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--color-btn);
            font-size: 7px;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            border: 1px solid var(--border-btn);
        }
        button:hover::after { opacity:1; }
        /* Util buttons — pill shape, smaller text */
        button.btn-util {
            width: auto; height: 20px;
            border-radius: 10px 30px;
            font-size: 0.6rem;
            padding: 0 8px;
            margin-top: 14px;
        }
        button.btn-util:hover::after { bottom:calc(100% + 4px); }

        .status-text {
            font-size: 7px;
            text-align: center;
            margin-top: 4px;
            color: var(--color-muted);
            font-family: monospace;
            transition: color 0.5s;
        }

        /* ── PRESET STYLES ───────────────────────────────────────────── */
        /* compile.py injects all @keyframes and .fx-* classes here.
           Template owns zero preset-specific CSS. */
        /* @@STYLES@@ */
        /* @@END_STYLES@@ */
    </style>
</head>
<body>

<div class="stage" id="stage">
    <div class="container">
        <div class="screen" id="screen">
            <!-- Canvas: background, CRT scanlines, dust, visualizer -->
            <canvas id="masterCanvas"></canvas>

            <!-- DOM lyric layer: CSS engine handles text rendering + animation -->
            <div class="lyric-area">
                <div class="lyric-breathe" id="lyricBreathe">
                    <div id="lineIO">
                        <div id="lineGlow" class="current-line" aria-hidden="true"></div>
                        <div class="current-line" id="currentLine"></div>
                    </div>
                </div>
                <div class="next-line"    id="nextLine"></div>
            </div>

            <!-- Invisible anchor for visualizer getBoundingClientRect() -->
            <div class="visualizer-wrap" id="visualizerWrap"></div>
            <!-- outer: draggable/resizable, owns the handle, never touched 
            by canvas rebuilds. Inner: owned entirely by the visualizer, free 
            to wipe/rebuild its own children -->
            <div class="spectrum-circle-outer" id="spectrumCircleOuter">
                <div class="spectrum-circle-wrap" id="spectrumCircleWrap"></div> 
                <div class="circle-resize-handle" id="circleResizeHandle"></div>
            </div>    
        </div>

        <div class="seekbar-container">
            <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        </div>

        <div class="stats">
            <span id="statusMsg"></span>
            <span id="timeDisplay">0:00</span>
            <span id="bpmDisplay">-- BPM</span>
        </div>

        <div class="controls">
            <div class="controls-row-main">
                <button id="arBtn"     data-tip="Aspect ratio" class="btn-util"></button>
                <button id="playBtn"   data-tip="Play / Pause"></button>
                <button id="resetBtn"  data-tip="Reset + new file"></button>
                <button id="plBtn"     data-tip="Playlist (real-time)"></button>
                <button id="scanBtn"   data-tip="Scan"></button>
                <!-- <button id="modeBtn"   data-tip="Sync mode A/B"></button> -->
                <button id="lcBtn"     data-tip="Lyrics / Circle"></button>
                <button id="eMp4Btn"   data-tip="EXPORT MP4" class="btn-util"></button>
            </div>
            <div class="controls-row-sel">
                <div id="presetSel" title="Preset"></div>
                <div id="circleSel" title="Circle style"></div>
                <div id="vizSel"    title="Visualizer"></div>
                <div id="trackSel"  title="Track" hidden></div>
                <input type="range" id="beatSens" min="0" max="1" step="0.05" value="0.5" title="Beat sensitivity: right reacts to softer beats, left only to strong kicks" hidden>
            </div>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>
</div>

<div id="mp4-export-overlay">
    <div id="mp4-export-status"></div>
    <div id="mp4-export-detail"></div>
    <button id="mp4-export-cancel"  data-tip="Cancel">X</button>
</div>

<script>

// ═══════════════════════════════════════════════════════════════════
// Default cached palette values read once per 
// preset change via _readPresetVars() and _readVizVars()
// Zero getComputedStyle calls inside rAF
// ═══════════════════════════════════════════════════════════════════
const PV = {
    bgScreen:  '#0a0e0a',
    colorDim:  '#3c9e3c',
    dustColor: '#1eff00',
    label:     '',
};

const VV = { // `primary` is a hex string; `glow` and `secondary` are strings because they get passed through wa() for alpha rewriting
    primary:   '#ffffff',
    glow:      'rgba(255,255,255,0.4)',
    secondary: 'rgba(255,255,255,0.2)',
};

// ═══════════════════════════════════════════════════════════════════
// INJECTED BLOCKS
// compile.py replaces each block
// ═══════════════════════════════════════════════════════════════════

/* @@PRESETS@@ */
/* @@END_PRESETS@@ */

/* @@STYLEKIT@@ */ 
/* @@END_STYLEKIT@@ */

/* @@RENDERCORE@@ */ 
/* @@END_RENDERCORE@@ */

/* @@VISUALIZERS@@ */
/* @@END_VISUALIZERS@@ */

/* @@LYRICS@@ */
/* @@END_LYRICS@@ */

/* @@BEATS@@ */
/* @@END_BEATS@@ */

/* @@ANIM@@ */
/* @@END_ANIM@@ */

/* @@MP4MUXER@@ */
/* @@END_MP4MUXER@@ */

/* @@EXPORT@@ */
/* @@END_EXPORT@@ */

// ═══════════════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════════════
const stageEl       = document.getElementById('stage');
const screenEl      = document.getElementById('screen');
const masterCanvas  = document.getElementById('masterCanvas');
const mCtx          = masterCanvas.getContext('2d');
const visWrap       = document.getElementById('visualizerWrap');
const circleOuter   = document.getElementById('spectrumCircleOuter'); // dragged/resized
const circleWrap    = document.getElementById('spectrumCircleWrap');  // passed to the visualizer, untouched by drag/resize code
const textFx        = document.getElementById('lyricBreathe'); // CSS transform the text FX (breath/shake/wobble) are applied to
const textIO        = document.getElementById('lineIO'); // receives WAAPI entry/exit animations (swipe, fade, etc.)
const glow          = document.getElementById('lineGlow'); // opacity is driven by the vocal envelope (glow effect)
const currentLineEl = document.getElementById('currentLine');
const nextLineEl    = document.getElementById('nextLine');
const timeDisplay  = document.getElementById('timeDisplay');
const bpmDisplay   = document.getElementById('bpmDisplay');
const statusMsg    = document.getElementById('statusMsg');
const playBtn      = document.getElementById('playBtn');
const resetBtn     = document.getElementById('resetBtn');
// const modeBtn      = document.getElementById('modeBtn');
const arBtn        = document.getElementById('arBtn');
const seekBar      = document.getElementById('seekBar');
const lyricAreaEl  = document.querySelector('.lyric-area');
const lcBtn        = document.getElementById('lcBtn');
const plBtn        = document.getElementById('plBtn');
const scanBtn      = document.getElementById('scanBtn');
const beatSens     = document.getElementById('beatSens');
const exportBtn    = document.getElementById('eMp4Btn');
const ROOT_STYLE   = document.documentElement; // Cached reference to :root for CSS var reads — avoids repeated DOM lookup.

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
// single configuration switch — BEAT_DATA.step_ms > 0 means beats.json
// was extracted in LUT mode; 0.0 is the discrete sentinel.
const LUT_MODE       = BEAT_DATA.step_ms > 0;

let beatTimestamps   = LUT_MODE ? [] : [...BEAT_DATA.beats];  // skip copying a 20k-float array we won't use. TODO: wire to Onsets for a new mode ?
let activeLutEffect  = null;
let scanEnabled      = true;    // user switch; the preset still decides whether a scan exists at all
let presetOffersScan = false;   // set by applyPreset()
let liveMode         = false;   // true: bands come from LiveBands (real-time) instead of the LUT
let bpm              = BEAT_DATA.bpm;
let currentMode      = 'A'; // 'A' = beat triggers, 'B' = lyric start triggers
let currentPreset    = PRESET_ORDER[0];
let isLandscape      = false;
let isPlaying        = false;
let flashCycleIdx    = 0;
let lastFiredBeatIdx = 0;
let currentLyricIdx  = -1;  // -2=pre-roll, -3=credits
let animFrameId      = null;
let isSeeking        = false;

// VISUALIZER_ORDER is injected by compile.py from visualizers.js.
// The 'off' sentinel maps to null (no visualizer rendered).
const VIZ_ORDER = (typeof VISUALIZER_ORDER !== 'undefined')
    ? VISUALIZER_ORDER : ['off'];
let vizIndex = 0;    // current position in VIZ_ORDER
let vizs     = null; // active BaseVisualizer instance or null

// dedicated lyrics/circle toggle — independent of vizs/VIZ_ORDER.
let lyricsCircleMode = 'both'; // 'both' | 'lyrics' | 'circle'
const LC_ORDER       = ['both', 'lyrics', 'circle'];

// Construct the animation core for this visualizer instance.
// Host object wires the core to the DOM elements it needs to render into.
const core = new AnimCore(
    {   // host
        circleContainer: circleWrap,
        textFxContainer: textFx,
        textIoContainer: textIO,
        textLine: currentLineEl,
        textGlow: glow,
        // Optional: color palette provider. Called each frame by AnimCore.renderFrame.
        // reads current CSS custom properties (e.g. --viz-color) and returns
        // { color, secondary, glow }. If _readVizVars returns undefined,
        // AnimCore falls back to DEFAULT_COLORS.
        getColors: () => VV // cached
    },

    // Config: prefer a global ANIM_CONFIG if one was defined here,
    // otherwise fall back to the built-in defaults ANIM_CONFIG injected 
    // by compile.py from stylekit.js.
    (typeof ANIM_CONFIG !== 'undefined') ? ANIM_CONFIG : DEFAULT_ANIM_CONFIG
);

    {
        stepMs: BEAT_DATA.step_ms,
        bass: BEAT_DATA.beats,
        vocal: BEAT_DATA.vocal_env,
        treble: BEAT_DATA.treble_env
    }
);

let _lastFrame = performance.now();

// Cap for resizeMasterCanvas's backing-store size. Live playback uses this
// limit (protects fill rate on 2-core CPUs). MP4 Export could override this
// via FizxExport.begin() so the master canvas renders at export resolution.
let _masterCanvasCap = 1920;

// ── Effect class removal debounce ─────────────────────────────────
// Short-lived CSS cleanup timers only — beat scheduling is rAF-driven.
const effectRemovalTimers = {};

// ═══════════════════════════════════════════════════════════════════
// AUDIO PIPELINE
// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
// MASTER CANVAS — background, dust, visualizer
//
// Architecture: two rendering systems, each doing what it does best.
//
//   masterCanvas (canvas 2D):
//     - Background fill (--bg-screen)
//     - Dust particles (typed Float32Array, single draw call)
//     - Visualizer (drawImage from vizs.canvas)
//     Internal resolution = screen px × DPR, capped at 1080p height
//     to protect legacy hardware fill rate.
//
//   DOM layer (z-index above canvas):
//     - .current-line / .next-line text
//     - CSS keyframe animations (fx-* classes from presets)
//     - screen-flash box-shadow animation
//     - CRT ::before/::after pseudo-elements
//     The browser GPU compositor handles these at native quality —
//     subpixel text, hardware-accelerated transforms, no JS overhead.
// ═══════════════════════════════════════════════════════════════════
let mW = 1;
let mH = 1;

function resizeMasterCanvas() {
    const rect = screenEl.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;
    let w = (rect.width  * dpr + 0.5) | 0;
    let h = (rect.height * dpr + 0.5) | 0;
    // Cap longer dimension at 1920 — keeps fill rate manageable on 2-core CPU
    const longer = Math.max(w, h);
    if (longer > _masterCanvasCap) {
        const s = _masterCanvasCap / longer;
        w = (w * s + 0.5) | 0;
        h = (h * s + 0.5) | 0;
    }
    if (masterCanvas.width !== w || masterCanvas.height !== h) {
        masterCanvas.width  = w;
        masterCanvas.height = h;
        mW = w;
        mH = h;
        _initAllDust();
    }
}

// ═══════════════════════════════════════════════════════════════════
// CACHED PALETTE INJECTORS
// ═══════════════════════════════════════════════════════════════════
function _readPresetVars() {
    const s       = getComputedStyle(ROOT_STYLE);
    PV.bgScreen   = s.getPropertyValue('--bg-screen').trim();
    PV.colorDim   = s.getPropertyValue('--color-dim').trim();
    const p       = PRESETS[currentPreset];
    PV.dustColor  = p.dustColor;
    PV.label      = p.label;
}

function _readVizVars() {
    const s      = getComputedStyle(ROOT_STYLE);
    VV.primary   = s.getPropertyValue('--viz-color').trim()     || '#ffffff';
    VV.glow      = s.getPropertyValue('--viz-glow').trim()      || 'rgba(255,255,255,0.4)';
    VV.secondary = s.getPropertyValue('--viz-secondary').trim() || 'rgba(255,255,255,0.2)';
}

// ═══════════════════════════════════════════════════════════════════
// DUST PARTICLE SYSTEM
// Static Float32Array — one allocation at boot, never reallocated.
// Single beginPath/fill call per frame: one GPU draw call for all 20.
// Draws directly onto masterCanvas.
//
// - Stores all particle state in one static Float32Array (no GC).
// - Builds a single canvas path per frame and calls fill() once.
// - Clamps internal canvas resolution to 480px max width; CSS
//   scales it smoothly — reduces GPU fill rate on HiDPI screens.
// - Uses bitwise OR 0 for integer pixel coordinates, preventing
//   sub-pixel rasterization on legacy GPU pipelines.
// ═══════════════════════════════════════════════════════════════════
const DUST_COUNT  = 20;
const DUST_STRIDE = 7;  // [x, y, vx, vy, alpha, size, fadeSpeed]
const dustState   = new Float32Array(DUST_COUNT * DUST_STRIDE);

function _initDustParticle(i) {
    const b = i * DUST_STRIDE;
    dustState[b+0] = Math.random() * mW;
    dustState[b+1] = mH - Math.random() * (mH * 0.4);
    dustState[b+2] = (Math.random() - 0.5) * 0.4;
    dustState[b+3] = -(0.2 + Math.random() * 0.6);
    dustState[b+4] = 0;
    dustState[b+5] = 1 + Math.random() * 2;
    dustState[b+6] = 0.004 + Math.random() * 0.006;
}

function _initAllDust() {
    for (let i = 0; i < DUST_COUNT; i++) {
        _initDustParticle(i);
        // Stagger starting y so particles don't all rise in sync at boot
        dustState[i * DUST_STRIDE + 1] = Math.random() * mH;
    }
}

function _drawDust() {
    mCtx.fillStyle = PV.dustColor;
    mCtx.beginPath();
    for (let i = 0; i < DUST_COUNT; i++) {
        const b = i * DUST_STRIDE;
        const x = dustState[b+0];
        const y = dustState[b+1];
        let alpha = dustState[b+4];

        // Advance particle — mutate in-place
        dustState[b+0] = x + dustState[b+2];
        dustState[b+1] = y + dustState[b+3];
        dustState[b+4] = alpha < 0.5
            ? alpha + dustState[b+6]
            : alpha - dustState[b+6] * 0.3;

        if (y < 0 || dustState[b+4] <= 0) { _initDustParticle(i); continue; }

        // Bitwise OR 0 truncates to integer — no sub-pixel rasterization
        const ix = (x + 0.5) | 0;
        const iy = (y + 0.5) | 0;
        const ir = ((dustState[b+5] * 0.5) + 0.5) | 0 || 1;
        mCtx.globalAlpha = alpha;
        mCtx.moveTo(ix + ir, iy);
        mCtx.arc(ix, iy, ir, 0, 6.2832);
    }
    mCtx.fill();
    mCtx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════
// CANVAS DRAW FRAME
// Draws only the canvas layers. DOM layers (lyrics, flash, CRT CSS)
// are composited above this by the browser's own GPU pipeline.
// ═══════════════════════════════════════════════════════════════════
function drawFrame() {
    // Background
    mCtx.globalAlpha = 1;
    mCtx.shadowBlur  = 0;
    mCtx.fillStyle   = PV.bgScreen;
    mCtx.fillRect(0, 0, mW, mH);

    // Dust
    _drawDust();

    // Visualizer — drawImage from vizs.canvas onto masterCanvas.
    // Position derived from visWrap.getBoundingClientRect() relative
    // to screenEl — correct in both portrait and landscape.
    if (vizs && vizs.canvas && vizs.canvas.width > 0) {
        const sr  = screenEl.getBoundingClientRect();
        const vr  = visWrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const vx  = ((vr.left - sr.left) * dpr + 0.5) | 0;
        const vy  = ((vr.top  - sr.top)  * dpr + 0.5) | 0;
        const vw  = (vr.width  * dpr + 0.5) | 0;
        const vh  = (vr.height * dpr + 0.5) | 0;
        mCtx.shadowBlur = 0;
        mCtx.drawImage(vizs.canvas, vx, vy, vw, vh);
    }
}

// ═══════════════════════════════════════════════════════════════════
// PRESET APPLICATION
// Injects CSS vars, sets flash color var, toggles CRT class,
// ═══════════════════════════════════════════════════════════════════
// Resolve the active preset's LUT entry once per preset switch, not per frame
function _resolveLutEffect(presetKey) {
    [...currentLineEl.classList].forEach(c => { if (c.endsWith('-LUT')) currentLineEl.classList.remove(c); });
    screenEl.classList.remove('screen-flash-LUT', 'scan-active');
    screenEl.style.removeProperty('animation-duration');
    screenEl.style.removeProperty('animation-delay');
    screenEl.style.removeProperty('animation-play-state');
    _scanUntil = 0;

    const p = PRESETS[presetKey];
    const entry = p && p.effects && p.effects.find(fx => fx.className.endsWith('-LUT'));
    activeLutEffect = entry ? {
        className: entry.className,
        useFlash: !!entry.useFlash,
        useScan: !!entry.useScan,
        scrubMs: entry.duration || 1000, // must be 1000ms for the mapping to be direct, If the intent is to scrub the full timeline
    } : null;
    if (activeLutEffect) currentLineEl.classList.add(activeLutEffect.className);
}

function applyPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    currentPreset = key;
    flashCycleIdx = 0;

    // CSS custom properties are injected via
    // root.style.setProperty() which overrides any existing inline styles.
    // This is intentional — presets fully own the visual theme.  
    // const root = document.documentElement;
    Object.entries(p.cssVars).forEach(([k, v]) => ROOT_STYLE.style.setProperty(k, v));
    // --flash-color drives @keyframes kScreenFlash — set here so the
    // flash is always theme-correct with no JS branching in triggerVisual.    
    ROOT_STYLE.style.setProperty('--flash-color', p.flashColor);
    // The '--crt-on' property is read as a string, not a boolean.    
    screenEl.classList.toggle('crt-on', p.cssVars['--crt-on'] === '1');

    // intensity tier — presets inherit 'medium' unless they set
    // intensityTier explicitly. See INTENSITY_TIERS in presets.js.
    const tier = (typeof INTENSITY_TIERS !== 'undefined')
        ? (INTENSITY_TIERS[p.intensityTier] || INTENSITY_TIERS[DEFAULT_INTENSITY_TIER])
        : null;
    if (tier) Object.entries(tier).forEach(([k, v]) => ROOT_STYLE.style.setProperty(k, v));

    _readPresetVars();
    _readVizVars();
    _resolveLutEffect(key);

    // Do NOT rebuild the visualizer here. CSS vars are now injected above,
    // and the running visualizer reads them on its next draw frame automatically.
    // This is zero-coupling contract: preset switch = CSS vars only.

    const _p = PRESETS[key];
    presetOffersScan = !!(_p && _p.cssVars && _p.cssVars['--scan-anim'] && _p.cssVars['--crt-on'] === '1' && _p.effects && _p.effects.some((fx) => fx.useScan));
    _syncScanBtn();

    if (presetSel) presetSel.value = key;
}

// ═══════════════════════════════════════════════════════════════════
// VISUAL TRIGGER
// Called from the rAF beat loop. Applies a CSS effect class to
// .current-line and optionally fires the screen-flash animation.
//
// rAF-defer pattern (replaces void offsetWidth reflow):
//   Frame N:   remove class
//   Frame N+1: re-add class → browser sees a genuine remove+add cycle,
//              restarting the CSS animation from 0%
//   Timer:     remove class after duration + buffer
//
// The effectRemovalTimers registry cancels any stale removal timer
// before re-arming, so rapid beats don't cut animations short.
// ═══════════════════════════════════════════════════════════════════
function triggerVisual() {
    const p      = PRESETS[currentPreset];
    // random discrete-pick must exclude the -LUT entry 
    // a paused animation toggled on/off in the remove/re-add/timeout 
    // cycle plays nothing — it would silently no-op as a "discrete" trigger otherwise    
    const pool = p.effects.filter(fx => !fx.className.endsWith('-LUT')); // TODO: filter call costly?
    const effect = pool[(Math.random() * pool.length) | 0];

    // Cancel stale removal timer so a fast re-trigger doesn't cut the
    // new animation short with the old timer's expiry callback.
    if (effectRemovalTimers[effect.className]) {
        clearTimeout(effectRemovalTimers[effect.className]);
        delete effectRemovalTimers[effect.className];
    }

    currentLineEl.classList.remove(effect.className);
    requestAnimationFrame(() => {
        currentLineEl.classList.add(effect.className);
        effectRemovalTimers[effect.className] = setTimeout(() => {
            currentLineEl.classList.remove(effect.className);
            delete effectRemovalTimers[effect.className];
        }, effect.duration + 20);
    });

    if (effect.useFlash) {
        if (p.flashCycle && p.flashCycleColors && p.flashCycleColors.length) {
            flashCycleIdx = (flashCycleIdx + 1) % p.flashCycleColors.length;
            ROOT_STYLE.style.setProperty(
                '--flash-color', p.flashCycleColors[flashCycleIdx]
            );
        }
        screenEl.classList.remove('screen-flash');
        requestAnimationFrame(() => {
            screenEl.classList.add('screen-flash');
            setTimeout(() => screenEl.classList.remove('screen-flash'), 150);
        });
    }

    if (effect.useScan && screenEl.classList.contains('crt-on')) {
        startScan(performance.now());
    }

    if (vizs) vizs.pulse();
}

// ═══════════════════════════════════════════════════════════════════
// LYRICS CURSOR
// Updates DOM text content only when the lyric index changes.
// ═══════════════════════════════════════════════════════════════════
function updateLyrics(t) {

    const lastLyric = LYRICS[LYRICS.length - 1];

    if (currentLyricIdx === -3) {
        if (t < lastLyric.start + 5) {
            // Fell out of the credit window via seek — recover to real lyrics.
            currentLyricIdx = LYRICS.length - 1;  // re-enter at last lyric
            // fall through so normal processing resumes below
        } else {
            return;   // stay in credit state, do nothing
        }
    }

    if (!LYRICS.length) {
        currentLineEl.innerHTML = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
        nextLineEl.innerHTML    = !beatTimestamps.length && !LUT_MODE
            ? `${icon('warning')} No lyrics or beats detected click ${icon('grid')} for live animation`
            : `${icon('warning')} No lyrics detected click ${icon('grid')} for live animation`;
        return;
    }

    if (t < LYRICS[0].start) { // "Before Song Starts"
        if (currentLyricIdx !== -2) {
            currentLineEl.innerHTML = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
            nextLineEl.textContent  = `\u27a1 ${LYRICS[0].text}`;
            currentLyricIdx = -2;
        }
        return;
    }

    // Cursor Logic: Advance index based on time
    // We find the LAST index where t >= start
    let newIdx = currentLyricIdx < 0 ? 0 : currentLyricIdx;
    while (LYRICS[newIdx + 1] && t >= LYRICS[newIdx + 1].start) newIdx++;
    // Reverse cursor: allow seeking backwards in the seekbar
    while (newIdx > 0 && t < LYRICS[newIdx].start) newIdx--;
    // Update DOM only when the index actually changes
    if (newIdx !== currentLyricIdx) {
        currentLyricIdx = newIdx;
        core.setLyricText(LYRICS[currentLyricIdx].text); 
        _exited = false;
        const next = LYRICS[currentLyricIdx + 1];
        nextLineEl.textContent = next ? `\u27a1 ${next.text}` : 'Audit Complete';
    }

    // Post-Song Credits
    // Trigger 5 seconds after the final lyric starts
    if (t > lastLyric.start + 5 && currentLyricIdx !== -3) { // -3 as unique state for "Credits"
        core.setLyricText('@AmMoPy');
        _exited = false;
        nextLineEl.innerHTML      = `${icon('star')} SHOW SOME LOVE ${icon('star')}`;
        currentLyricIdx = -3;
    }
}

// ═══════════════════════════════════════════════════════════════════
// SEEKBAR
// ═══════════════════════════════════════════════════════════════════
function _updateSeekBarVisual(t) {
    if (!audioDuration || isSeeking) return;
    const pct = (t / audioDuration) * 100;
    seekBar.value = pct;
    // Gradient fill — painted once per rAF, not on every input event
    const col = getComputedStyle(ROOT_STYLE)
                    .getPropertyValue('--color-primary').trim();
    seekBar.style.background =
        `linear-gradient(to right, ${col} ${pct}%, var(--bg-btn) ${pct}%)`;
}

function seekTo(pct) {
    if (playlistMode) { if (mediaEl && audioDuration) mediaEl.currentTime = (pct / 100) * audioDuration; return; }
    const target = (pct / 100) * audioDuration;
    // Reset pointers and fast-forward to target without firing triggers
    lastFiredBeatIdx = 0;
    currentLyricIdx  = -1;
    const src = currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start);
    while (src[lastFiredBeatIdx] !== undefined && src[lastFiredBeatIdx] < target)
        lastFiredBeatIdx++;
    if (!isPlaying) {
        startOffset = target;
        updateLyrics(target);
        timeDisplay.textContent = fmt(target);
        return;
    }
    // Playing: restart source from new offset
    _startSourceAt(target);
}

// ═══════════════════════════════════════════════════════════════════
// CENTRALIZED DISPLAY + BEAT LOOP
//
// One rAF loop owns:
//   - AudioContext clock read (no drift)
//   - Seekbar + time display updates
//   - Lyric cursor advancement
//   - Beat firing via O(1) amortized pointer advance
//   - Dust canvas draw
//
// Beat scheduling moved entirely here — eliminates the setTimeout
// forest (scheduleAll / clearScheduled pattern) and its allocation
// cost. A single integer pointer advances monotonically; on seek it
// is reset and fast-forwarded in a tight while loop (no rAF cost).
// ═══════════════════════════════════════════════════════════════════
// scan lives on a ::before pseudo-element — JS can't set
// inline style on a pseudo-element, neither custom property (opacity)
// nor scrubbing would drives intensity via a the keyframe directly and
// will cause freeze, thus retrigger on bass rise, the same onset-synthesis 
// idea already used for the event-based visualizers (Particles/Ripple/Heartbeat)
let _scanUntil = 0;        // retrigger guard (performance.now timebase)
let _scanStart = -1;       // when .scan-active was really added (virtual clock during export)
let _scanEndAt = 0;
const SCAN_MS = 280;

function startScan(now) {
    if (!scanEnabled) return; // Both the LUT-hit path and the beat-effect path go through it, so this is the single gate
    _scanEndAt = now + SCAN_MS;
    screenEl.classList.remove('scan-active');
    requestAnimationFrame(() => {
        _scanStart = performance.now();
        _scanEndAt = _scanStart + SCAN_MS;
        screenEl.classList.add('scan-active');
    });
}

function tickScan(now) {
    if (_scanEndAt && now >= _scanEndAt) { _scanEndAt = 0; screenEl.classList.remove('scan-active'); }
}

function triggerLutScan(now) {
    if (!activeLutEffect || !activeLutEffect.useScan || !screenEl.classList.contains('crt-on') || now < _scanUntil) return;
    _scanUntil = now + SCAN_MS + 60;
    startScan(now);
}

/* @@ANALYSIS_LIVE@@ */
/* @@END_ANALYSIS_LIVE@@ */

function displayLoop() {
    tickScan(performance.now());

    // Current playback position derived from AudioContext wall clock.
    // Accurate to ~1ms — tied to sound card driver, not JS event queue.
    const t = playlistMode
        ? (mediaEl ? mediaEl.currentTime : 0)
        : (isPlaying && audioContext)
            ? Math.min(audioContext.currentTime - startedAt + startOffset, audioDuration)
            : startOffset;

    if (isPlaying && !isSeeking) {
        timeDisplay.textContent = t.toFixed(3);
        _updateSeekBarVisual(t);
        if (!playlistMode) updateLyrics(t);

        if (LUT_MODE || liveMode) {
            // continuous path: direct index every frame (LUT) or live band values (playlist mode)
            const now = performance.now();
            const dt = Math.min(50, now - _lastFrame);
            _lastFrame = now;
            let f;
            if (liveMode) { 
                const b = LiveBands.read(dt); f = core.renderValues(LiveBands.kickMode ? b.kick : b.bass, b.vocal, b.treble, dt, now); 
            }
            else f = core.renderFrame(t, dt, now);
            const nl = LYRICS[currentLyricIdx + 1]; 
            
            if (!playlistMode && nl && !_exited && core.getExitDurationSec() && t >= nl.start - core.getExitDurationSec()) {
                core.playTextExit();
                _exited=true;
            }
            
            if (vizs) vizs.setLutFrame(f.bass, f.vocal); 
            if (f.hitDetected) triggerLutScan(now);

            // JS scrubs LUT animation into position via animation-delay (negative delay seeks
            // into a paused animation's timeline without playing it)
            if (activeLutEffect) {
                // Text: driven by vocal — matches the "breathing" character already established
                currentLineEl.style.animationPlayState = 'paused';
                currentLineEl.style.animationDelay = `${-(f.vocal * activeLutEffect.scrubMs)}ms`;

                if (activeLutEffect.useFlash) {
                    // Bass drives flash — reads as a hit, not a breath. Duration overridden
                    // to decouple from the discrete flash's own 120ms.
                    screenEl.style.animationDuration  = `${activeLutEffect.scrubMs}ms`;
                    screenEl.style.animationPlayState = 'paused';
                    screenEl.style.animationDelay     = `${-(f.bass * activeLutEffect.scrubMs)}ms`;
                    if (!screenEl.classList.contains('screen-flash-LUT')) screenEl.classList.add('screen-flash-LUT');
                }
            }
        } else {
            // ── Inline beat scheduler ─────────────────────────────────
            // Mode A: fire against beatTimestamps (pre-sorted by compile.py).
            // Mode B: fire against lyric start times.
            // Pointer only moves forward — wrap-around handled by seekTo().
            const src = currentMode === 'A'
                ? beatTimestamps
                : LYRICS.map(l => l.start);
            while (src[lastFiredBeatIdx] !== undefined && t >= src[lastFiredBeatIdx]) {
                triggerVisual();
                lastFiredBeatIdx++;
            }
        }
    }

    drawFrame();
    animFrameId = requestAnimationFrame(displayLoop);
}

// ═══════════════════════════════════════════════════════════════════
// AUDIO LIFECYCLE
// ═══════════════════════════════════════════════════════════════════
function _ensureContext() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyserNode = audioContext.createAnalyser();
        // 256-bin FFT — sufficient for all current visualizers; keeps
        // the analysis buffer small and fast to read each frame.
        analyserNode.fftSize = 256;
        analyserNode.connect(audioContext.destination);
    }
}

// Internal: create and start a new AudioBufferSourceNode at the given offset.
// Stops and disconnects any existing source first.
function _startSourceAt(offset) {
    if (sourceNode) {
        sourceNode.onended = null;
        try { sourceNode.stop(); } catch (_) {}
        sourceNode.disconnect();
        sourceNode = null;
    }
    sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    // Route through analyser — visualizers can read frequency data without
    // separate wiring.
    sourceNode.connect(analyserNode);
    startOffset = offset;
    startedAt   = audioContext.currentTime;
    sourceNode.start(0, offset);
    // onended fires at natural buffer completion, not on manual stop().
    // This is the only place end-of-track state is set.
    sourceNode.onended = () => {
        if (!isPlaying) return; // fired by manual stop — ignore
        isPlaying        = false;
        startOffset      = 0;
        lastFiredBeatIdx = 0;
        currentLyricIdx  = -1;
        timeDisplay.textContent = fmt(0);
        playBtn.innerHTML   = icon('play');
        statusMsg.innerHTML = `${icon('stop')} done`;
        _updateSeekBarVisual(0);
    };
}

async function loadAudioBuffer(file) {
    _ensureContext();
    statusMsg.textContent = 'decoding';
    const arrayBuf = await file.arrayBuffer();
    _audioName     = file.name.replace(/\.[^/.]+$/, '') || 'fizx';
    audioBuffer    = await audioContext.decodeAudioData(arrayBuf);
    audioDuration  = audioBuffer.duration;
    bpmDisplay.textContent = `${bpm} BPM`;
    statusMsg.innerHTML    = `${icon('bolt')} ${file.name.slice(0, 22)}`;
}

async function applyAudioFile(file) {
    // Tear down any running source before replacing the buffer
    if (sourceNode) {
        isPlaying = false;
        sourceNode.onended = null;
        try { sourceNode.stop(); } catch (_) {}
        sourceNode.disconnect();
        sourceNode = null;
    }
    startOffset = 0; lastFiredBeatIdx = 0; currentLyricIdx = -1;
    await loadAudioBuffer(file);
    updateLyrics(0);
    timeDisplay.textContent = fmt(0);
    _updateSeekBarVisual(0);
    statusMsg.textContent = LUT_MODE
        ? `LUT \u00b7 ${BEAT_DATA.beats.length} frames \u00b7 ${LYRICS.length} lines`
        : `${beatTimestamps.length} beats \u00b7 ${LYRICS.length} lines`;
}

function selectAudio() {
    const input  = document.createElement('input');
    input.type   = 'file';
    input.accept = 'audio/mpeg,audio/wav,audio/ogg,audio/mp3';
    input.onchange = (e) => { const file = e.target.files[0]; if (file) applyAudioFile(file); };
    input.click();
}

// ── Play / Pause ──────────────────────────────────────────────────
async function togglePlay() {
    if (playlistMode) {
        if (!mediaEl || !mediaEl.src) { plPick(); return; }
        if (audioContext.state === 'suspended') await audioContext.resume();
        if (mediaEl.paused) await mediaEl.play(); else mediaEl.pause();
        return;
    }
    if (!audioBuffer) { selectAudio(); return; }
    _ensureContext();
    if (audioContext.state === 'suspended') await audioContext.resume();
    if (isPlaying) {
        startOffset = audioContext.currentTime - startedAt + startOffset;
        if (sourceNode) {
            sourceNode.onended = null;
            try { sourceNode.stop(); } catch (_) {}
            sourceNode.disconnect();
            sourceNode = null;
        }
        isPlaying = false;
        playBtn.innerHTML   = icon('play');
        statusMsg.innerHTML = `${icon('pause')} ${fmt(startOffset)}`;
        return;
    }
    _startSourceAt(startOffset);
    isPlaying = true;
    playBtn.innerHTML   = icon('pause');
    statusMsg.innerHTML = `${icon('play')} ${PV.label} \u00b7 ${currentMode}`;
}

// ── Reset ─────────────────────────────────────────────────────────
// Teardown order matters for correctness:
//   1. Stop source (prevents onended from firing post-reset)
//   2. Clear CSS cleanup timers
//   3. Cancel rAF loop
//   4. Close AudioContext (await — releases DSP before next context opens)
//   5. Destroy visualizer GPU buffers
//   6. Reset all state variables + UI
//   7. Restart display loop and visualizer (display-only, no audio)
//   8. Prompt for new file
async function resetAudio() {
    plExit(); 
    // 1.
    if (sourceNode) {
        isPlaying = false;
        sourceNode.onended = null;
        try { sourceNode.stop(); } catch (_) {}
        sourceNode.disconnect();
        sourceNode = null;
    }
    isPlaying = false;

    // 2.
    Object.keys(effectRemovalTimers).forEach(k => {
        clearTimeout(effectRemovalTimers[k]);
        delete effectRemovalTimers[k];
    });

    // 3.
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    // 4. AudioContext — await ensures DSP resources are released before
    //    a new context might be created by setupAudio()
    if (audioContext) { await audioContext.close(); audioContext = null; analyserNode = null; }
    // 5.
    if (vizs) { vizs.destroy(); vizs = null; }

    // 6.
    audioBuffer = null; audioDuration = 0; startOffset = 0; startedAt = 0;
    lastFiredBeatIdx = 0; currentLyricIdx = -1; flashCycleIdx = 0;

    timeDisplay.textContent   = fmt(0);
    bpmDisplay.textContent    = '-- BPM';
    seekBar.value             = 0;
    seekBar.style.background  = '';
    playBtn.innerHTML         = icon('play');
    currentLineEl.innerHTML   = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
    nextLineEl.innerHTML      = `${icon('play')} select audio file ${icon('grid')} live playback`;
    statusMsg.innerHTML       = `${icon('refresh')} select new file`;

    // 7.
    requestAnimationFrame(displayLoop);
    buildVisualizer(VIZ_ORDER[vizIndex]);

    // 8.
    selectAudio();
}

// ── Playlist (real-time, no LUT) ──────────────────────────────────
const isAudioFile = (f) => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac|opus)$/i.test(f.name);
const _plName = (f) => f.name.replace(/\.[^/.]+$/, '');
let _plSortAsc = true;
// TODO: playlistMode checks are branch creep, which is fine for two modes. If a third ever appears, put a small player interface in front of buffer and media playback instead of adding branches
let playlistMode = false;
let playlist = [], plIndex = -1;
let mediaEl = null, mediaSrc = null, _plUrl = null;

function _stopBufferSource() {
    if (!sourceNode) return;
    isPlaying = false;
    sourceNode.onended = null;
    try { sourceNode.stop(); } catch (_) {}
    sourceNode.disconnect();
    sourceNode = null;
}

function _ensureMedia() {
    _ensureContext();
    if (mediaEl) return;
    mediaEl = new Audio();
    mediaEl.preload = 'auto';
    mediaSrc = audioContext.createMediaElementSource(mediaEl);
    mediaSrc.connect(analyserNode);                  // speakers + legacy visualizers
    LiveBands.attach(audioContext, mediaSrc);        // attached once: this node persists across tracks
    mediaEl.onloadedmetadata = () => { audioDuration = mediaEl.duration || 0; };
    mediaEl.onplay  = () => { isPlaying = true;  playBtn.innerHTML = icon('pause'); };
    mediaEl.onpause = () => { if (!mediaEl.ended) { isPlaying = false; playBtn.innerHTML = icon('play'); } };
    mediaEl.onended = () => plPlay(plIndex + 1);     // repeat-all
}

function _plRefresh() {
    trackSel.setItems(playlist.map((f, i) => [String(i), `${i + 1}. ${_plName(f)}`]), plIndex < 0 ? null : String(plIndex));
    trackSel.hidden = !playlistMode;
    beatSens.hidden = !playlistMode;
}

function plPick() {                                            // always ADDS: first pick starts playlist mode, later picks append
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'audio/*'; input.multiple = true;
    input.onchange = (e) => { if (e.target.files.length) plAdd(e.target.files); };
    input.click();
}

async function plAdd(files) {
    const key = (f) => `${f.name}|${f.size}|${f.lastModified}`;
    const have = new Set(playlist.map(key));
    const incoming = [...files].filter(isAudioFile);
    if (!incoming.length) { statusMsg.textContent = 'NO AUDIO FILES'; return; }
    const fresh = incoming.filter((f) => { const k = key(f); if (have.has(k)) return false; have.add(k); return true; });   // skips exact duplicates
    if (!fresh.length) { statusMsg.textContent = 'ALREADY IN PLAYLIST'; return; }
    if (!playlistMode) {
        _stopBufferSource();                                   // leave song mode
        playlistMode = true; liveMode = true;
        _ensureMedia();
        setLyricsCircleMode('circle');                         // compiled lyrics belong to the song, not to the playlist
    }
    playlist.push(...fresh);
    _plRefresh();
    if (plIndex < 0) await plPlay(0);                          // first batch, or the list was emptied: start playing
    else statusMsg.textContent = `+${fresh.length} \u00b7 ${playlist.length} tracks`;
}

async function plPlay(i, autoplay = true) {
    if (!playlist.length || !mediaEl) return;
    plIndex = ((i % playlist.length) + playlist.length) % playlist.length;
    const file = playlist[plIndex];
    if (_plUrl) URL.revokeObjectURL(_plUrl);
    _plUrl = URL.createObjectURL(file);
    mediaEl.src = _plUrl;
    LiveBands.reset(); core.resetResponse();
    startOffset = 0; lastFiredBeatIdx = 0; currentLyricIdx = -1;
    bpmDisplay.textContent = 'LIVE MODE ON';
    statusMsg.textContent = `${plIndex + 1}/${playlist.length} \u00b7 ${file.name.slice(0, 22)}`;
    trackSel.value = String(plIndex);
    if (!autoplay) return;
    if (audioContext.state === 'suspended') await audioContext.resume();
    try { await mediaEl.play(); } catch (err) { console.warn('[playlist] play failed', err); }
}

function plRemove(i) {
    if (i < 0 || i >= playlist.length) return;
    const wasCurrent = i === plIndex, wasPlaying = !!mediaEl && !mediaEl.paused;
    playlist.splice(i, 1);
    if (!playlist.length) { plClear(); return; }
    if (i < plIndex) plIndex--;
    _plRefresh();
    if (wasCurrent) plPlay(i, wasPlaying);                     // next track (wraps), same play/pause state
}

function plSort() {                                            // toggles A-Z / Z-A; the current track keeps playing
    const cur = playlist[plIndex];
    const cmp = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    playlist.sort(_plSortAsc ? cmp : (a, b) => cmp(b, a));
    _plSortAsc = !_plSortAsc;
    plIndex = cur ? playlist.indexOf(cur) : -1;
    _plRefresh();
}

function plClear() {                                           // stays in playlist mode; the + button adds again
    if (mediaEl) { mediaEl.pause(); mediaEl.removeAttribute('src'); mediaEl.load(); }
    if (_plUrl) { URL.revokeObjectURL(_plUrl); _plUrl = null; }
    playlist = []; plIndex = -1; isPlaying = false; audioDuration = 0;
    playBtn.innerHTML = icon('play');
    statusMsg.textContent = 'PLAYLIST EMPTY';
    _plRefresh();
}

function plExit() {
    if (!playlistMode) return;
    playlistMode = false; liveMode = false; isPlaying = false;
    playlist = []; plIndex = -1;
    if (mediaEl) { mediaEl.onended = null; mediaEl.onpause = null; mediaEl.pause(); mediaEl.removeAttribute('src'); mediaEl.load(); }
    LiveBands.detach();
    mediaEl = null; mediaSrc = null;
    if (_plUrl) { URL.revokeObjectURL(_plUrl); _plUrl = null; }
    trackSel.hidden = true; beatSens.hidden = true; trackSel.setItems([], null); 
}

// ── Mode toggle ───────────────────────────────────────────────────
function toggleMode() {
    currentMode = currentMode === 'A' ? 'B' : 'A';
    // Fast-forward pointer to current playback position in the new source array
    lastFiredBeatIdx = 0;
    const t   = (isPlaying && audioContext)
        ? audioContext.currentTime - startedAt + startOffset : startOffset;
    const src = currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start);
    while (src[lastFiredBeatIdx] !== undefined && src[lastFiredBeatIdx] < t)
        lastFiredBeatIdx++;
    statusMsg.textContent = `MODE ${currentMode}`;
}
