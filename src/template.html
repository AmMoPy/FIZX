<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FIZX VISUALIZER</title>
    <!-- Self-hosted subsetted fonts — no network request, works fully offline.
         Base64 strings injected by compile.py from generated .b64 files in assets/fonts/.-->    
    <style>
        /* @@FONTS@@ */
        /* @@END_FONTS@@ */
    </style>
    <style>
        /* ── DESIGN TOKENS (defaults overwritten at runtime by applyPreset) ── */
        :root {
            --bg-body:       #030603;
            --bg-container:  linear-gradient(145deg,#141a14,#0a0f0a);
            --bg-screen:     #0a0e0a;
            --border-screen: #2a4a2a;
            --color-primary: #1eff00;
            --color-dim:     #3c9e3c;
            --color-faint:   #2a8a2a;
            --color-muted:   #3a7a3a;
            --shadow-outer:  0 0 0 2px #1a3a1a,0 20px 40px rgba(0,0,0,0.5);
            --shadow-screen: inset 0 0 25px rgba(0,255,0,0.06);
            --bg-stats:      #0a0c0a;
            --bg-btn:        #1a2a1a;
            --border-btn:    #3c9e3c;
            --color-btn:     #aaffaa;
            --flash-color:   rgba(0,255,0,0.4);
            --prim:          'merri','deja','Consolas',monospace; /* DejaVuSans for Arabic fallback */
            --crt-on:        0;
        }

        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--prim);
            transition: background 0.5s;
        }

        svg {
            vertical-align: middle; /* SVGs often sit slightly "higher" than text */
            margin-bottom: 0.125em; /* Fine-tune to align with font baseline */
        }

        /* ── STAGE ────────────────────────────────────────────────────
           9:16 default. .ar-landscape flips to 16:9.
           max-width = min() prevents overflow on both axes.
        ── */
        .stage {
            aspect-ratio: 9 / 16;
            max-width: min(100vw, calc(100vh * 9 / 16));
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-outer);
            transition: box-shadow 0.5s, max-width 0.3s, aspect-ratio 0.3s;
        }
        .stage.ar-landscape {
            aspect-ratio: 16 / 9;
            max-width: min(100vw, calc(100vh * 16 / 9));
        }

        .container {
            width: 100%;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            padding: 1px 2px 14px 2px;
            transition: background 0.5s;
        }

        /* ── SCREEN ──────────────────────────────────────────────────── */
        .screen {
            flex: 1;
            background: var(--bg-screen);
            border-radius: 10px;
            box-shadow: var(--shadow-screen);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-screen);
            margin-bottom: 6px;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }

        /* CRT scanlines — CSS pseudo-elements, GPU composited.
           Toggled via .crt-on class by applyPreset(). */
        .screen.crt-on::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: repeating-linear-gradient(
                0deg,
                var(--crt-color, transparent) 0px, 
                var(--crt-color, transparent) 2px,
                transparent 2px, transparent 5px
            );
        }
        /* Active Scanline */
        .screen.crt-on.scan-active::before {
            background:
                repeating-linear-gradient(
                    0deg,
                    var(--crt-color, transparent) 0px, 
                    var(--crt-color, transparent) 2px,
                    transparent 2px,transparent 5px
                ),
                linear-gradient(
                    to bottom,
                    transparent 0%, 
                    var(--scan-color, transparent) 50%, 
                    transparent 100%
                );
            background-size:100% 100%,100% 30%;
            animation:var(--scan-anim, none);
            will-change: background-position;
        }
        /* Permanent Vignette Shadow */
        .screen.crt-on::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at 50% 40%, transparent 50%, rgba(0,0,0,0.5) 100%);
        }

        /* Screen flash — animates box-shadow via CSS keyframe.
           The browser GPU compositor runs this at native frame rate
           with zero JS involvement after the class is added. */
        @keyframes kScreenFlash {
            0%  { box-shadow: inset 0 0 60px var(--flash-color), 0 0 20px var(--flash-color); }
            100%{ box-shadow: var(--shadow-screen); }
        }
        .screen.screen-flash { animation: kScreenFlash 0.12s ease-out forwards; }

        /* ── MASTER CANVAS ───────────────────────────────────────────── */
        /* Renders: background fill, CRT (canvas version when crt-on),
           dust particles, visualizer drawImage.
           Does NOT render: lyrics, flash — those stay in the DOM
           where the CSS engine animates them at native quality. */
        #masterCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* ── LYRIC AREA ──────────────────────────────────────────────── */
        /* Sits above the canvas in z-order. The CSS engine handles all
           text rendering and animation — subpixel antialiasing, kerning,
           hardware-accelerated transforms. No canvas approximation. */
        .lyric-area {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 30px 20px 80px 20px;
            pointer-events: none;
        }

        .current-line {
            font-family: var(--prim);
            font-size: clamp(2.5rem, 6vw, 2.8rem);
            font-weight: bold;
            color: var(--color-primary);
            text-shadow: 0 0 5px var(--color-dim), 0 0 8px var(--color-faint);
            margin-bottom: 16px;
            line-height: 1.4;
            will-change: transform, opacity, filter;
            transition: color 0.5s, text-shadow 0.5s;
            white-space: pre-line; /* Supports Line Breaks, \n renders as <br> zero JS change required */
        }

        .next-line {
            font-family: var(--prim);
            font-size: clamp(0.5rem, 3vw, 1rem);
            color: var(--color-dim);
            opacity: 0.7;
            border-top: 1px dashed var(--color-faint);
            padding-top: 15px;
            transition: color 0.5s, border-color 0.5s;
        }

        /* ── VISUALIZER WRAP ─────────────────────────────────────────── */
        /* Invisible positioning anchor — the visualizer's canvas is
           drawImage'd onto masterCanvas each frame. visWrap itself is
           never painted; it just provides getBoundingClientRect(). */
        .visualizer-wrap {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            visibility: hidden;
            pointer-events: none;
            z-index: 2;
        }

        /* ── SEEKBAR ─────────────────────────────────────────────────── */
        .seekbar-container {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 0 10px;
        }
        #seekBar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: var(--bg-btn);
            outline: none;
            cursor: pointer;
        }
        #seekBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: 0 0 4px var(--color-dim);
        }
        #seekBar::-moz-range-thumb {
            width: 10px; height: 10px;
            border: none; border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
        }

        /* ── STATS BAR ───────────────────────────────────────────────── */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--color-faint);
            font-size: 8px;
            background: var(--bg-stats);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
            transition: background 0.5s, color 0.5s;
        }

        /* ── CONTROLS ────────────────────────────────────────────────── */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .controls-row-main {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        /* Icon-only circular buttons — tooltip via data-tip + ::after */
        button {
            background: var(--bg-btn);
            border: 1px solid var(--border-btn);
            color: var(--color-btn);
            font-family: monospace;
            font-weight: bold;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: filter 0.1s, box-shadow 0.1s, border-color 0.4s, color 0.4s, background 0.4s;
        }
        button:hover { filter:brightness(1.5); box-shadow:0 0 8px var(--color-primary); }
        button::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--color-btn);
            font-size: 7px;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            border: 1px solid var(--border-btn);
        }
        button:hover::after { opacity:1; }
        /* Util buttons — pill shape, smaller text */
        button.btn-util {
            width: auto; height: 20px;
            border-radius: 10px 30px;
            font-size: 0.6rem;
            padding: 0 8px;
            margin-top: 14px;
        }
        button.btn-util:hover::after { bottom:calc(100% + 4px); }

        .status-text {
            font-size: 7px;
            text-align: center;
            margin-top: 4px;
            color: var(--color-muted);
            font-family: monospace;
            transition: color 0.5s;
        }

        /* ── PRESET STYLES ───────────────────────────────────────────── */
        /* compile.py injects all @keyframes and .fx-* classes here.
           Template owns zero preset-specific CSS. */
        /* @@STYLES@@ */
        /* @@END_STYLES@@ */
    </style>
</head>
<body>

<div class="stage" id="stage">
    <div class="container">
        <div class="screen" id="screen">
            <!-- Canvas: background, CRT scanlines, dust, visualizer -->
            <canvas id="masterCanvas"></canvas>

            <!-- DOM lyric layer: CSS engine handles text rendering + animation -->
            <div class="lyric-area">
                <div class="current-line" id="currentLine"></div>
                <div class="next-line"    id="nextLine"></div>
            </div>

            <!-- Invisible anchor for visualizer getBoundingClientRect() -->
            <div class="visualizer-wrap" id="visualizerWrap"></div>
        </div>

        <div class="seekbar-container">
            <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        </div>

        <div class="stats">
            <span id="statusMsg"></span>
            <span id="timeDisplay">0:00</span>
            <span id="bpmDisplay">-- BPM</span>
        </div>

        <div class="controls">
            <div class="controls-row-main">
                <button class="btn-util" id="arBtn"    data-tip="Aspect ratio"></button>
                <button id="playBtn"   data-tip="Play / Pause"></button>
                <button id="resetBtn"  data-tip="Reset + new file"></button>
                <button id="modeBtn"   data-tip="Sync mode A/B"></button>
                <button id="presetBtn" data-tip="Switch preset"></button>
                <button class="btn-util" id="vizBtn"   data-tip="Visualizer"></button>
            </div>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// INJECTED BLOCKS
// compile.py replaces each block
// ═══════════════════════════════════════════════════════════════════

/* @@VISUALIZERS@@ */
/* @@END_VISUALIZERS@@ */

/* @@PRESETS@@ */
/* @@END_PRESETS@@ */

/* @@LYRICS@@ */
/* @@END_LYRICS@@ */

/* @@BEATS@@ */
/* @@END_BEATS@@ */

// ═══════════════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════════════
const stageEl      = document.getElementById('stage');
const screenEl     = document.getElementById('screen');
const masterCanvas = document.getElementById('masterCanvas');
const mCtx         = masterCanvas.getContext('2d');
const visWrap      = document.getElementById('visualizerWrap');
const currentLineEl = document.getElementById('currentLine');
const nextLineEl    = document.getElementById('nextLine');
const timeDisplay  = document.getElementById('timeDisplay');
const bpmDisplay   = document.getElementById('bpmDisplay');
const statusMsg    = document.getElementById('statusMsg');
const playBtn      = document.getElementById('playBtn');
const resetBtn     = document.getElementById('resetBtn');
const modeBtn      = document.getElementById('modeBtn');
const presetBtn    = document.getElementById('presetBtn');
const arBtn        = document.getElementById('arBtn');
const vizBtn       = document.getElementById('vizBtn');
const seekBar      = document.getElementById('seekBar');

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let beatTimestamps   = [...BEAT_DATA.beats];  // Copy to allow modification
let bpm              = BEAT_DATA.bpm;
let currentMode      = 'A'; // 'A' = beat triggers, 'B' = lyric start triggers
let currentPreset    = PRESET_ORDER[0];
let isLandscape      = false;
let isPlaying        = false;
let flashCycleIdx    = 0;
let lastFiredBeatIdx = 0;
let currentLyricIdx  = -1;  // -2=pre-roll, -3=credits
let animFrameId      = null;
let isSeeking        = false;

// VISUALIZER_ORDER is injected by compile.py from visualizers.js.
// The 'off' sentinel maps to null (no visualizer rendered).
const VIZ_ORDER = (typeof VISUALIZER_ORDER !== 'undefined')
    ? VISUALIZER_ORDER : ['off'];
let vizIndex = 0;    // current position in VIZ_ORDER
let vizs     = null; // active BaseVisualizer instance or null

// ── Effect class removal debounce ─────────────────────────────────
// Short-lived CSS cleanup timers only — beat scheduling is rAF-driven.
const effectRemovalTimers = {};

// ═══════════════════════════════════════════════════════════════════
// AUDIO PIPELINE
// ═══════════════════════════════════════════════════════════════════
let audioContext  = null;
let analyserNode  = null;
let sourceNode    = null;
let audioBuffer   = null;
let startOffset   = 0;
let startedAt     = 0;
let audioDuration = 0;

// ═══════════════════════════════════════════════════════════════════
// MASTER CANVAS — background, dust, visualizer
//
// Architecture: two rendering systems, each doing what it does best.
//
//   masterCanvas (canvas 2D):
//     - Background fill (--bg-screen)
//     - Dust particles (typed Float32Array, single draw call)
//     - Visualizer (drawImage from vizs.canvas)
//     Internal resolution = screen px × DPR, capped at 1080p height
//     to protect legacy hardware fill rate.
//
//   DOM layer (z-index above canvas):
//     - .current-line / .next-line text
//     - CSS keyframe animations (fx-* classes from presets)
//     - screen-flash box-shadow animation
//     - CRT ::before/::after pseudo-elements
//     The browser GPU compositor handles these at native quality —
//     subpixel text, hardware-accelerated transforms, no JS overhead.
// ═══════════════════════════════════════════════════════════════════
let mW = 1;
let mH = 1;

function resizeMasterCanvas() {
    const rect = screenEl.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;
    let w = (rect.width  * dpr + 0.5) | 0;
    let h = (rect.height * dpr + 0.5) | 0;
    // Cap longer dimension at 1920 — keeps fill rate manageable on 2-core GPU
    const longer = Math.max(w, h);
    if (longer > 1920) {
        const s = 1920 / longer;
        w = (w * s + 0.5) | 0;
        h = (h * s + 0.5) | 0;
    }
    if (masterCanvas.width !== w || masterCanvas.height !== h) {
        masterCanvas.width  = w;
        masterCanvas.height = h;
        mW = w;
        mH = h;
        _initAllDust();
    }
}

// ═══════════════════════════════════════════════════════════════════
// PRESET VARS CACHE
// Read once per preset change via _readPresetVars().
// Zero getComputedStyle calls inside rAF.
// ═══════════════════════════════════════════════════════════════════
const PV = {
    bgScreen:  '#0a0e0a',
    colorDim:  '#3c9e3c',
    dustColor: '#1eff00',
    label:     '',
};

function _readPresetVars() {
    const root    = getComputedStyle(document.documentElement);
    PV.bgScreen   = root.getPropertyValue('--bg-screen').trim();
    PV.colorDim   = root.getPropertyValue('--color-dim').trim();
    const p       = PRESETS[currentPreset];
    PV.dustColor  = p.dustColor;
    PV.label      = p.label;
}

// ═══════════════════════════════════════════════════════════════════
// DUST PARTICLE SYSTEM
// Static Float32Array — one allocation at boot, never reallocated.
// Single beginPath/fill call per frame: one GPU draw call for all 20.
// Draws directly onto masterCanvas.
//
// - Stores all particle state in one static Float32Array (no GC).
// - Builds a single canvas path per frame and calls fill() once.
// - Clamps internal canvas resolution to 480px max width; CSS
//   scales it smoothly — reduces GPU fill rate on HiDPI screens.
// - Uses bitwise OR 0 for integer pixel coordinates, preventing
//   sub-pixel rasterization on legacy GPU pipelines.
// ═══════════════════════════════════════════════════════════════════
const DUST_COUNT  = 20;
const DUST_STRIDE = 7;  // [x, y, vx, vy, alpha, size, fadeSpeed]
const dustState   = new Float32Array(DUST_COUNT * DUST_STRIDE);

function _initDustParticle(i) {
    const b = i * DUST_STRIDE;
    dustState[b+0] = Math.random() * mW;
    dustState[b+1] = mH - Math.random() * (mH * 0.4);
    dustState[b+2] = (Math.random() - 0.5) * 0.4;
    dustState[b+3] = -(0.2 + Math.random() * 0.6);
    dustState[b+4] = 0;
    dustState[b+5] = 1 + Math.random() * 2;
    dustState[b+6] = 0.004 + Math.random() * 0.006;
}

function _initAllDust() {
    for (let i = 0; i < DUST_COUNT; i++) {
        _initDustParticle(i);
        // Stagger starting y so particles don't all rise in sync at boot
        dustState[i * DUST_STRIDE + 1] = Math.random() * mH;
    }
}

function _drawDust() {
    mCtx.fillStyle = PV.dustColor;
    mCtx.beginPath();
    for (let i = 0; i < DUST_COUNT; i++) {
        const b = i * DUST_STRIDE;
        const x = dustState[b+0];
        const y = dustState[b+1];
        let alpha = dustState[b+4];

        // Advance particle — mutate in-place
        dustState[b+0] = x + dustState[b+2];
        dustState[b+1] = y + dustState[b+3];
        dustState[b+4] = alpha < 0.5
            ? alpha + dustState[b+6]
            : alpha - dustState[b+6] * 0.3;

        if (y < 0 || dustState[b+4] <= 0) { _initDustParticle(i); continue; }

        // Bitwise OR 0 truncates to integer — no sub-pixel rasterization
        const ix = (x + 0.5) | 0;
        const iy = (y + 0.5) | 0;
        const ir = ((dustState[b+5] * 0.5) + 0.5) | 0 || 1;
        mCtx.globalAlpha = alpha;
        mCtx.moveTo(ix + ir, iy);
        mCtx.arc(ix, iy, ir, 0, 6.2832);
    }
    mCtx.fill();
    mCtx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════
// CANVAS DRAW FRAME
// Draws only the canvas layers. DOM layers (lyrics, flash, CRT CSS)
// are composited above this by the browser's own GPU pipeline.
// ═══════════════════════════════════════════════════════════════════
function drawFrame() {
    // Background
    mCtx.globalAlpha = 1;
    mCtx.shadowBlur  = 0;
    mCtx.fillStyle   = PV.bgScreen;
    mCtx.fillRect(0, 0, mW, mH);

    // Dust
    _drawDust();

    // Visualizer — drawImage from vizs.canvas onto masterCanvas.
    // Position derived from visWrap.getBoundingClientRect() relative
    // to screenEl — correct in both portrait and landscape.
    if (vizs && vizs.canvas && vizs.canvas.width > 0) {
        const sr  = screenEl.getBoundingClientRect();
        const vr  = visWrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const vx  = ((vr.left - sr.left) * dpr + 0.5) | 0;
        const vy  = ((vr.top  - sr.top)  * dpr + 0.5) | 0;
        const vw  = (vr.width  * dpr + 0.5) | 0;
        const vh  = (vr.height * dpr + 0.5) | 0;
        mCtx.shadowBlur = 0;
        mCtx.drawImage(vizs.canvas, vx, vy, vw, vh);
    }
}

// ═══════════════════════════════════════════════════════════════════
// ICON REGISTRY
// ═══════════════════════════════════════════════════════════════════
const ICONS = {
    play:    `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5v11l10-5.5z"/></svg>`,
    pause:   `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>`,
    stop:    `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="12" height="12" rx="1"/></svg>`,
    warning: `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2.5L1.5 13.5h13L8 2.5zM7.25 11h1.5v1.5h-1.5zm0-5.5h1.5v4h-1.5z"/></svg>`,
    grid:    `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5.5" height="5.5" rx="0.5"/><rect x="8.5" y="2" width="5.5" height="5.5" rx="0.5"/><rect x="2" y="8.5" width="5.5" height="5.5" rx="0.5"/><rect x="8.5" y="8.5" width="5.5" height="5.5" rx="0.5"/></svg>`,
    swap:    `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11 4l3 3-3 3M14 7H5M5 12l-3-3 3-3M2 9h9"/></svg>`,
    theme:   `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 7 7 2 2 0 0 0-2-2h-1c-1 0-1-1-1-1V4a3 3 0 0 0-3-3zM4 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3-3a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm4 1a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm1 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>`,
    refresh: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 8a7 7 0 1 1 2 4.9L1 15v-4h4"/></svg>`,
    record:  `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="7"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>`,
    star:    `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2.16 4.38 4.84.7-3.5 3.41.83 4.82L8 12.04l-4.33 2.27.83-4.82-3.5-3.41 4.84-.7z"/></svg>`,
    bolt:    `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M10 1L3 9h4l-1 6 7-8H9z"/></svg>`,
};

function icon(name) { return ICONS[name] || ''; }

// Set initial icon state — called once after DOM refs are established
(function _initIcons() {
    playBtn.innerHTML   = icon('play');
    resetBtn.innerHTML  = icon('refresh');
    modeBtn.innerHTML   = icon('swap');
    presetBtn.innerHTML = icon('theme');
    arBtn.innerHTML     = icon('grid');
    vizBtn.innerHTML    = icon('record');
    statusMsg.innerHTML = `click ${icon('play')} to load audio`;
})();

// ═══════════════════════════════════════════════════════════════════
// VISUALIZER MANAGEMENT
// ═══════════════════════════════════════════════════════════════════
function buildVisualizer(key) {
    // Destroy existing instance with full GPU cleanup before creating new one.
    // destroy() in BaseVisualizer zeros canvas dimensions -> immediate GPU release.
    if (vizs) { vizs.destroy(); vizs = null; }
    if (key === 'off' || !key || typeof VISUALIZERS === 'undefined' || !VISUALIZERS[key]) {
        vizBtn.setAttribute('data-tip', 'off');
        return;
    }
    vizs = new VISUALIZERS[key](visWrap);
    vizBtn.setAttribute('data-tip', key);
}

function cycleVisualizer() {
    vizIndex = (vizIndex + 1) % VIZ_ORDER.length;
    buildVisualizer(VIZ_ORDER[vizIndex]);
}

// ═══════════════════════════════════════════════════════════════════
// PRESET APPLICATION
// Injects CSS vars, sets flash color var, toggles CRT class,
// ═══════════════════════════════════════════════════════════════════
function applyPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    currentPreset = key;
    flashCycleIdx = 0;

    // CSS custom properties are injected via
    // root.style.setProperty() which overrides any existing inline styles.
    // This is intentional — presets fully own the visual theme.  
    const root = document.documentElement;
    Object.entries(p.cssVars).forEach(([k, v]) => root.style.setProperty(k, v));
    // --flash-color drives @keyframes kScreenFlash — set here so the
    // flash is always theme-correct with no JS branching in triggerVisual.    
    root.style.setProperty('--flash-color', p.flashColor);
    // The '--crt-on' property is read as a string, not a boolean.    
    screenEl.classList.toggle('crt-on', p.cssVars['--crt-on'] === '1');

    _readPresetVars();

    // Do NOT rebuild the visualizer here. CSS vars are now injected above,
    // and the running visualizer reads them on its next draw frame automatically.
    // This is zero-coupling contract: preset switch = CSS vars only.

    const nextKey = PRESET_ORDER[(PRESET_ORDER.indexOf(key) + 1) % PRESET_ORDER.length];
    presetBtn.setAttribute('data-tip', `\u27a1 ${PRESETS[nextKey].label}`);
}

// ═══════════════════════════════════════════════════════════════════
// VISUAL TRIGGER
// Called from the rAF beat loop. Applies a CSS effect class to
// .current-line and optionally fires the screen-flash animation.
//
// rAF-defer pattern (replaces void offsetWidth reflow):
//   Frame N:   remove class
//   Frame N+1: re-add class → browser sees a genuine remove+add cycle,
//              restarting the CSS animation from 0%
//   Timer:     remove class after duration + buffer
//
// The effectRemovalTimers registry cancels any stale removal timer
// before re-arming, so rapid beats don't cut animations short.
// ═══════════════════════════════════════════════════════════════════
function triggerVisual() {
    const p      = PRESETS[currentPreset];
    const effect = p.effects[(Math.random() * p.effects.length) | 0];

    // Cancel stale removal timer so a fast re-trigger doesn't cut the
    // new animation short with the old timer's expiry callback.
    if (effectRemovalTimers[effect.className]) {
        clearTimeout(effectRemovalTimers[effect.className]);
        delete effectRemovalTimers[effect.className];
    }

    currentLineEl.classList.remove(effect.className);
    requestAnimationFrame(() => {
        currentLineEl.classList.add(effect.className);
        effectRemovalTimers[effect.className] = setTimeout(() => {
            currentLineEl.classList.remove(effect.className);
            delete effectRemovalTimers[effect.className];
        }, effect.duration + 20);
    });

    if (effect.useFlash) {
        if (p.flashCycle && p.flashCycleColors && p.flashCycleColors.length) {
            flashCycleIdx = (flashCycleIdx + 1) % p.flashCycleColors.length;
            document.documentElement.style.setProperty(
                '--flash-color', p.flashCycleColors[flashCycleIdx]
            );
        }
        screenEl.classList.remove('screen-flash');
        requestAnimationFrame(() => {
            screenEl.classList.add('screen-flash');
            setTimeout(() => screenEl.classList.remove('screen-flash'), 150);
        });
    }

    if (effect.useScan && screenEl.classList.contains('crt-on')) {
        screenEl.classList.remove('scan-active');
        requestAnimationFrame(() => {
            screenEl.classList.add('scan-active');
            setTimeout(() => screenEl.classList.remove('scan-active'), 280);
        });
    }

    if (vizs) vizs.pulse();
}

// ═══════════════════════════════════════════════════════════════════
// LYRICS CURSOR
// Updates DOM text content only when the lyric index changes.
// ═══════════════════════════════════════════════════════════════════
function updateLyrics(t) {
    if (!LYRICS.length) {
        currentLineEl.innerHTML = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
        nextLineEl.innerHTML    = !beatTimestamps.length
            ? `${icon('warning')} No lyrics or beats detected`
            : `${icon('warning')} No lyrics detected`;
        return;
    }

    if (t < LYRICS[0].start) { // "Before Song Starts"
        if (currentLyricIdx !== -2) {
            currentLineEl.innerHTML = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
            nextLineEl.textContent  = `\u27a1 ${LYRICS[0].text}`;
            currentLyricIdx = -2;
        }
        return;
    }

    // Cursor Logic: Advance index based on time
    // We find the LAST index where t >= start
    let newIdx = currentLyricIdx < 0 ? 0 : currentLyricIdx;
    while (LYRICS[newIdx + 1] && t >= LYRICS[newIdx + 1].start) newIdx++;
    // Reverse cursor: allow seeking backwards in the seekbar
    while (newIdx > 0 && t < LYRICS[newIdx].start) newIdx--;
    // Update DOM only when the index actually changes
    if (newIdx !== currentLyricIdx) {
        currentLyricIdx = newIdx;
        currentLineEl.textContent = LYRICS[currentLyricIdx].text;
        const next = LYRICS[currentLyricIdx + 1];
        nextLineEl.textContent = next ? `\u27a1 ${next.text}` : 'Audit Complete';
    }

    // Post-Song Credits
    // Trigger 5 seconds after the final lyric starts
    const lastLyric = LYRICS[LYRICS.length - 1];
    if (t > lastLyric.start + 5 && currentLyricIdx !== -3) { // -3 as unique state for "Credits"
        currentLineEl.textContent = '@AmMoPy';
        nextLineEl.innerHTML      = `${icon('star')} SHOW SOME LOVE ${icon('star')}`;
        currentLyricIdx = -3;
    }
}

// ═══════════════════════════════════════════════════════════════════
// SEEKBAR
// ═══════════════════════════════════════════════════════════════════
function _updateSeekBarVisual(t) {
    if (!audioDuration || isSeeking) return;
    const pct = (t / audioDuration) * 100;
    seekBar.value = pct;
    // Gradient fill — painted once per rAF, not on every input event
    const col = getComputedStyle(document.documentElement)
                    .getPropertyValue('--color-primary').trim();
    seekBar.style.background =
        `linear-gradient(to right, ${col} ${pct}%, var(--bg-btn) ${pct}%)`;
}

function seekTo(pct) {
    const target = (pct / 100) * audioDuration;
    // Reset pointers and fast-forward to target without firing triggers
    lastFiredBeatIdx = 0;
    currentLyricIdx  = -1;
    const src = currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start);
    while (src[lastFiredBeatIdx] !== undefined && src[lastFiredBeatIdx] < target)
        lastFiredBeatIdx++;
    if (!isPlaying) {
        startOffset = target;
        updateLyrics(target);
        timeDisplay.textContent = fmt(target);
        return;
    }
    // Playing: restart source from new offset
    _startSourceAt(target);
}

// ═══════════════════════════════════════════════════════════════════
// CENTRALIZED DISPLAY + BEAT LOOP
//
// One rAF loop owns:
//   - AudioContext clock read (no drift)
//   - Seekbar + time display updates
//   - Lyric cursor advancement
//   - Beat firing via O(1) amortized pointer advance
//   - Dust canvas draw
//
// Beat scheduling moved entirely here — eliminates the setTimeout
// forest (scheduleAll / clearScheduled pattern) and its allocation
// cost. A single integer pointer advances monotonically; on seek it
// is reset and fast-forwarded in a tight while loop (no rAF cost).
// ═══════════════════════════════════════════════════════════════════
function displayLoop() {
    // Current playback position derived from AudioContext wall clock.
    // Accurate to ~1ms — tied to sound card driver, not JS event queue.
    const t = (isPlaying && audioContext)
        ? Math.min(audioContext.currentTime - startedAt + startOffset, audioDuration)
        : startOffset;

    if (isPlaying && !isSeeking) {
        timeDisplay.textContent = fmt(t);
        _updateSeekBarVisual(t);
        updateLyrics(t);

        // ── Inline beat scheduler ─────────────────────────────────
        // Mode A: fire against beatTimestamps (pre-sorted by compile.py).
        // Mode B: fire against lyric start times.
        // Pointer only moves forward — wrap-around handled by seekTo().
        const src = currentMode === 'A'
            ? beatTimestamps
            : LYRICS.map(l => l.start);
        while (src[lastFiredBeatIdx] !== undefined && t >= src[lastFiredBeatIdx]) {
            triggerVisual();
            lastFiredBeatIdx++;
        }
    }

    drawFrame();
    animFrameId = requestAnimationFrame(displayLoop);
}

// ═══════════════════════════════════════════════════════════════════
// AUDIO LIFECYCLE
// ═══════════════════════════════════════════════════════════════════
function _ensureContext() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyserNode = audioContext.createAnalyser();
        // 256-bin FFT — sufficient for all current visualizers; keeps
        // the analysis buffer small and fast to read each frame.
        analyserNode.fftSize = 256;
        analyserNode.connect(audioContext.destination);
    }
}

// Internal: create and start a new AudioBufferSourceNode at the given offset.
// Stops and disconnects any existing source first.
function _startSourceAt(offset) {
    if (sourceNode) {
        sourceNode.onended = null;
        try { sourceNode.stop(); } catch (_) {}
        sourceNode.disconnect();
        sourceNode = null;
    }
    sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    // Route through analyser — visualizers can read frequency data without
    // separate wiring.
    sourceNode.connect(analyserNode);
    startOffset = offset;
    startedAt   = audioContext.currentTime;
    sourceNode.start(0, offset);
    // onended fires at natural buffer completion, not on manual stop().
    // This is the only place end-of-track state is set.
    sourceNode.onended = () => {
        if (!isPlaying) return; // fired by manual stop — ignore
        isPlaying        = false;
        startOffset      = 0;
        lastFiredBeatIdx = 0;
        currentLyricIdx  = -1;
        playBtn.innerHTML   = icon('play');
        statusMsg.innerHTML = `${icon('stop')} done`;
        _updateSeekBarVisual(0);
    };
}

async function loadAudioBuffer(file) {
    _ensureContext();
    statusMsg.textContent = 'decoding';
    const arrayBuf = await file.arrayBuffer();
    audioBuffer    = await audioContext.decodeAudioData(arrayBuf);
    audioDuration  = audioBuffer.duration;
    bpmDisplay.textContent = `${bpm} BPM`;
    statusMsg.innerHTML    = `${icon('bolt')} ${file.name.slice(0, 22)}`;
}

function selectAudio() {
    const input  = document.createElement('input');
    input.type   = 'file';
    input.accept = 'audio/mpeg,audio/wav,audio/ogg,audio/mp3';
    input.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        // Tear down any running source before replacing the buffer
        if (sourceNode) {
            isPlaying = false;
            sourceNode.onended = null;
            try { sourceNode.stop(); } catch (_) {}
            sourceNode.disconnect();
            sourceNode = null;
        }
        startOffset = 0; lastFiredBeatIdx = 0; currentLyricIdx = -1;
        await loadAudioBuffer(file);
        updateLyrics(0);
        timeDisplay.textContent = fmt(0);
        _updateSeekBarVisual(0);
        statusMsg.textContent = `${beatTimestamps.length} beats \u00b7 ${LYRICS.length} lines`;
    };
    input.click();
}

// ── Play / Pause ──────────────────────────────────────────────────
async function togglePlay() {
    if (!audioBuffer) { selectAudio(); return; }
    _ensureContext();
    if (audioContext.state === 'suspended') await audioContext.resume();
    if (isPlaying) {
        startOffset = audioContext.currentTime - startedAt + startOffset;
        if (sourceNode) {
            sourceNode.onended = null;
            try { sourceNode.stop(); } catch (_) {}
            sourceNode.disconnect();
            sourceNode = null;
        }
        isPlaying = false;
        playBtn.innerHTML   = icon('play');
        statusMsg.innerHTML = `${icon('pause')} ${fmt(startOffset)}`;
        return;
    }
    _startSourceAt(startOffset);
    isPlaying = true;
    playBtn.innerHTML   = icon('pause');
    statusMsg.innerHTML = `${icon('play')} ${PV.label} \u00b7 ${currentMode}`;
}

// ── Reset ─────────────────────────────────────────────────────────
// Teardown order matters for correctness:
//   1. Stop source (prevents onended from firing post-reset)
//   2. Clear CSS cleanup timers
//   3. Cancel rAF loop
//   4. Close AudioContext (await — releases DSP before next context opens)
//   5. Destroy visualizer GPU buffers
//   6. Reset all state variables + UI
//   7. Restart display loop and visualizer (display-only, no audio)
//   8. Prompt for new file
async function resetAudio() {
    // 1.
    if (sourceNode) {
        isPlaying = false;
        sourceNode.onended = null;
        try { sourceNode.stop(); } catch (_) {}
        sourceNode.disconnect();
        sourceNode = null;
    }
    isPlaying = false;

    // 2.
    Object.keys(effectRemovalTimers).forEach(k => {
        clearTimeout(effectRemovalTimers[k]);
        delete effectRemovalTimers[k];
    });

    // 3.
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    // 4. AudioContext — await ensures DSP resources are released before
    //    a new context might be created by setupAudio()
    if (audioContext) { await audioContext.close(); audioContext = null; analyserNode = null; }
    // 5.
    if (vizs) { vizs.destroy(); vizs = null; }

    // 6.
    audioBuffer = null; audioDuration = 0; startOffset = 0; startedAt = 0;
    lastFiredBeatIdx = 0; currentLyricIdx = -1; flashCycleIdx = 0;

    timeDisplay.textContent   = fmt(0);
    bpmDisplay.textContent    = '-- BPM';
    seekBar.value             = 0;
    seekBar.style.background  = '';
    playBtn.innerHTML         = icon('play');
    currentLineEl.innerHTML   = `${icon('bolt')} FIZX READY ${icon('bolt')}`;
    nextLineEl.innerHTML      = `${icon('play')} select audio file`;
    statusMsg.innerHTML       = `${icon('refresh')} select new file`;

    // 7.
    requestAnimationFrame(displayLoop);
    buildVisualizer(VIZ_ORDER[vizIndex]);

    // 8.
    selectAudio();
}

// ── Mode toggle ───────────────────────────────────────────────────
function toggleMode() {
    currentMode = currentMode === 'A' ? 'B' : 'A';
    // Fast-forward pointer to current playback position in the new source array
    lastFiredBeatIdx = 0;
    const t   = (isPlaying && audioContext)
        ? audioContext.currentTime - startedAt + startOffset : startOffset;
    const src = currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start);
    while (src[lastFiredBeatIdx] !== undefined && src[lastFiredBeatIdx] < t)
        lastFiredBeatIdx++;
    statusMsg.textContent = `MODE ${currentMode}`;
}

// ── Preset toggle ─────────────────────────────────────────────────
function togglePreset() {
    const next = PRESET_ORDER[(PRESET_ORDER.indexOf(currentPreset) + 1) % PRESET_ORDER.length];
    applyPreset(next);
}

// ── AR toggle ─────────────────────────────────────────────────────
function toggleAR() {
    isLandscape = !isLandscape;
    stageEl.classList.toggle('ar-landscape', isLandscape);
    arBtn.setAttribute('data-tip', isLandscape ? '9:16' : '16:9');
    // Resize dust canvas on next paint after layout settles
    requestAnimationFrame(() => { resizeMasterCanvas(); _readPresetVars(); });
}

// ── Utilities ─────────────────────────────────────────────────────
function fmt(sec) {
    if (isNaN(sec) || sec < 0) return '0:00';
    const m = (sec / 60) | 0;
    const s = (sec % 60) | 0;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

// ═══════════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════

// ── Seekbar listeners ───────────────────────────────────────
seekBar.addEventListener('pointerdown', () => { isSeeking = true; });
seekBar.addEventListener('input', () => {
    if (!audioDuration) return;
    const t = (seekBar.value / 100) * audioDuration;
    timeDisplay.textContent = fmt(t);
    updateLyrics(t);
});
seekBar.addEventListener('change', () => {
    isSeeking = false;
    if (!audioDuration) return;
    seekTo(parseFloat(seekBar.value));
});
seekBar.addEventListener('pointerup', () => { isSeeking = false; });

// ── Button listeners ──────────────────────────────────────────────
playBtn.onclick   = togglePlay;
resetBtn.onclick  = resetAudio;
modeBtn.onclick   = toggleMode;
presetBtn.onclick = togglePreset;
arBtn.onclick     = toggleAR;
vizBtn.onclick    = cycleVisualizer;

// ── Resize observer — keeps dust canvas sized to screen ──────────
const _resizeObs = new ResizeObserver(() => {
    resizeMasterCanvas();
    _readPresetVars();
});
_resizeObs.observe(screenEl);

// ── Boot ──────────────────────────────────────────────────────────
applyPreset(PRESET_ORDER[0]);
bpmDisplay.textContent = `${bpm} BPM`;
resizeMasterCanvas();
updateLyrics(0);
requestAnimationFrame(displayLoop);
buildVisualizer(VIZ_ORDER[vizIndex]);

// ── Cleanup on unload ─────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
    Object.values(effectRemovalTimers).forEach(id => clearTimeout(id));
    if (animFrameId)  cancelAnimationFrame(animFrameId);
    if (sourceNode)   { try { sourceNode.stop(); } catch (_) {} }
    if (audioContext) audioContext.close();
    if (vizs)         vizs.destroy();
    _resizeObs.disconnect();
});
</script>
</body>
</html>
