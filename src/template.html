// ── MP4 Export toggle ─────────────────────────────────────────────
function pickExportOptions(anchor) {
    return new Promise((resolve) => {
        if (document.getElementById('xo-menu')) return resolve(null);
        const r = anchor.getBoundingClientRect();
        const menu = document.createElement('div');
        menu.id = 'xo-menu';
        menu.style.cssText = `position:fixed;left:${Math.max(8, Math.min(r.left, innerWidth - 236))}px;bottom:${innerHeight - r.top + 6}px;z-index:9998;display:grid;gap:8px;min-width:220px;padding:10px;background:#111;color:#ddd;border:1px solid #444;border-radius:6px;font:12px monospace`;
        menu.innerHTML = `
            <label>Resolution <select id="xo-res"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select></label>
            <label>Quality <select id="xo-bpp"><option value="0.08">Draft</option><option value="0.14" selected>Standard</option><option value="0.22">High</option></select></label>
            <label>FPS <select id="xo-fps"><option value="24">24</option><option value="30" selected>30</option><option value="60">60</option></select></label>
            <div style="display:flex;gap:8px"><button id="xo-go" data-tip="Export">✓</button><button id="xo-cancel" data-tip="Cancel">X</button></div>`;
        const outside = (e) => { if (!menu.contains(e.target) && !anchor.contains(e.target)) close(null); };
        const onKey = (e) => { if (e.key === 'Escape') close(null); };
        const close = (val) => {
            document.removeEventListener('mousedown', outside, true);
            document.removeEventListener('keydown', onKey);
            menu.remove(); resolve(val);
        };
        menu.querySelector('#xo-go').onclick = () => close({
            shortSide: +menu.querySelector('#xo-res').value,
            bitsPerPixel: +menu.querySelector('#xo-bpp').value,
            fps: +menu.querySelector('#xo-fps').value,
        });
        menu.querySelector('#xo-cancel').onclick = () => close(null);
        document.body.appendChild(menu);
        setTimeout(() => {
            document.addEventListener('mousedown', outside, true);
            document.addEventListener('keydown', onKey);
        }, 0);
    });
}

let _exportAbort = null;
const _notifyOpener = (msg) => { try { if (window.opener && !window.opener.closed) window.opener.postMessage(msg, '*'); } catch (_) {} };
window.addEventListener('pagehide', () => { if (_exportAbort) _notifyOpener({ cmd: 'mp4-export-error', message: 'preview tab closed' }); });
document.getElementById('mp4-export-cancel').onclick = () => { if (_exportAbort) _exportAbort.abort(); };

async function exportMp4() {
    if (playlistMode) { statusMsg.textContent = 'EXPORT DISABLED IN LIVE MODE'; return; }
    if (_exportAbort) return;                                          // an export is already running
    if (typeof FizxExport === 'undefined' || typeof Mp4Muxer === 'undefined' || !Mp4Muxer) { statusMsg.textContent = 'EXPORT UNAVAILABLE'; return; }
    if (!audioBuffer) { statusMsg.textContent = 'LOAD AUDIO FIRST'; return; }
    if (isPlaying) await togglePlay();                                 // stop live playback before the virtual clock takes over
    const choice = await pickExportOptions(exportBtn);
    if (!choice) { _notifyOpener({ cmd: 'mp4-export-cancelled' }); return; }

    _exportAbort = new AbortController();
    _notifyOpener({ cmd: 'mp4-export-start' });
    try {
        const blob = await FizxExport.exportMp4({
            ...choice, seed: 1, signal: _exportAbort.signal,
            onProgress: (p) => _notifyOpener(
                { cmd: 'mp4-export-progress', frame: p.frame, frames: p.frames, fps: p.fps, etaSec: p.etaSec, timing: p.timing }
            ),
        });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${_audioName}.mp4` });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        statusMsg.textContent = `MP4 saved \u00b7 ${(blob.size / 1048576).toFixed(1)} MB`;
        _notifyOpener({ cmd: 'mp4-export-done', size: blob.size });
    } catch (err) {
        if (err && err.name === 'AbortError') { statusMsg.textContent = 'EXPORT CANCELLED'; _notifyOpener({ cmd: 'mp4-export-cancelled' }); }
        else { statusMsg.textContent = 'EXPORT FAILED'; console.error(err); _notifyOpener({ cmd: 'mp4-export-error', message: String(err && err.message || err) }); }
    } finally {
        _exportAbort = null;
    }
}

// ── Utilities ─────────────────────────────────────────────────────
function fmt(sec) {
    if (isNaN(sec) || sec < 0) return '0:00';
    const m = (sec / 60) | 0;
    const s = (sec % 60) | 0;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

// Playlist controls
const DD_ROW = 24, DD_ROWS = 5, DD_BUFFER = 2;      // row height (px), visible rows cap, extra rows rendered around the window
let _ddActive = null;                                // only one popup open at a time

function makeDropdown(id, { onChange, onRemove, tools = [] } = {}) {
    const host = document.getElementById(id);
    host.classList.add('dd');
    host.innerHTML = '<div class="dd-btn" tabindex="0" role="button"><span class="dd-label"></span><span class="dd-caret">&#9662;</span></div>';
    const btn = host.firstChild, labelEl = btn.firstChild;
    let items = [], value = null, active = -1, raf = 0;
    let pop = null, scroller = null, spacer = null, rowsEl = null;

    const indexOf = (v) => items.findIndex((it) => it[0] === v);
    const syncLabel = () => { const i = indexOf(value); labelEl.textContent = i >= 0 ? items[i][1] : '\u2014'; };

    function renderRows() {                           // windowed: only the visible rows (+ buffer) exist in the DOM
        if (!pop) return;
        const n = items.length, top = scroller.scrollTop, view = scroller.clientHeight;
        const first = Math.max(0, Math.floor(top / DD_ROW) - DD_BUFFER);
        const last  = Math.min(n, Math.ceil((top + view) / DD_ROW) + DD_BUFFER);
        rowsEl.style.transform = `translateY(${first * DD_ROW}px)`;
        const frag = document.createDocumentFragment();
        for (let i = first; i < last; i++) {
            const row = document.createElement('div');
            row.className = 'dd-row' + (items[i][0] === value ? ' sel' : '') + (i === active ? ' act' : '');
            row.style.height = DD_ROW + 'px';
            row.dataset.i = i;
            const text = document.createElement('span');
            text.className = 'dd-text'; text.textContent = items[i][1];     // textContent: file names are never parsed as HTML
            row.appendChild(text);
            if (onRemove) {
                const x = document.createElement('span');
                x.className = 'dd-x'; x.dataset.x = i; x.title = 'Remove'; x.textContent = '\u00d7';
                row.appendChild(x);
            }
            frag.appendChild(row);
        }
        rowsEl.replaceChildren(frag);
    }
    function size() {
        scroller.style.height = Math.min(items.length, DD_ROWS) * DD_ROW + 'px';
        spacer.style.height = items.length * DD_ROW + 'px';
    }
    function keepVisible() {
        const t = scroller.scrollTop, v = scroller.clientHeight;
        if (active * DD_ROW < t) scroller.scrollTop = active * DD_ROW;
        else if ((active + 1) * DD_ROW > t + v) scroller.scrollTop = (active + 1) * DD_ROW - v;
    }
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderRows(); }); };
    function onRowClick(e) {
        const x = e.target.closest('.dd-x');
        if (x) { e.stopPropagation(); if (onRemove) onRemove(items[+x.dataset.x][0]); return; }
        const row = e.target.closest('.dd-row');
        if (row) select(+row.dataset.i);
    }
    const onOutside = (e) => { if (pop && !pop.contains(e.target) && !host.contains(e.target)) close(); };
    function onKey(e) {
        const k = e.key;
        if (k === 'Escape') close();
        else if (k === 'ArrowDown') active = Math.min(items.length - 1, active + 1);
        else if (k === 'ArrowUp') active = Math.max(0, active - 1);
        else if (k === 'Enter' || k === ' ') { if (active >= 0) select(active); }
        else if (k === 'Tab') { close(); return; }
        else return;
        e.preventDefault(); e.stopPropagation();           // keep Space/Enter away from global shortcuts while the list is open
        if (pop) { keepVisible(); renderRows(); }
    }
    function select(i) {
        value = items[i][0]; syncLabel(); close();
        if (onChange) onChange(value);
    }
    function open() {
        if (pop || !items.length) return;
        if (_ddActive) _ddActive.close();
        pop = document.createElement('div'); pop.className = 'dd-pop';
        if (tools.length) {
            const bar = document.createElement('div'); bar.className = 'dd-bar';
            for (const t of tools) {
                const b = document.createElement('span');
                b.className = 'dd-tool'; b.textContent = t.label; b.title = t.title;
                b.onclick = (e) => { e.stopPropagation(); t.run(); };
                bar.appendChild(b);
            }
            pop.appendChild(bar);
        }
        scroller = document.createElement('div'); scroller.className = 'dd-scroll';
        spacer   = document.createElement('div'); spacer.className = 'dd-spacer';
        rowsEl   = document.createElement('div'); rowsEl.className = 'dd-rows';
        spacer.appendChild(rowsEl); scroller.appendChild(spacer); pop.appendChild(scroller);
        document.body.appendChild(pop);                    // body, not the container: no clipping, no transformed ancestors
        size();
        const r = host.getBoundingClientRect();
        pop.style.minWidth = Math.max(r.width, 160) + 'px'; pop.style.maxWidth = '320px';
        const h = pop.offsetHeight, below = innerHeight - r.bottom;
        pop.style.top  = (below >= h + 8 || below >= r.top ? r.bottom + 4 : Math.max(4, r.top - h - 4)) + 'px';
        pop.style.left = Math.max(4, Math.min(r.left, innerWidth - pop.offsetWidth - 4)) + 'px';
        active = Math.max(0, indexOf(value));
        scroller.scrollTop = Math.max(0, (active - 2) * DD_ROW);
        renderRows();
        scroller.addEventListener('scroll', onScroll, { passive: true });
        rowsEl.addEventListener('click', onRowClick);
        document.addEventListener('mousedown', onOutside, true);
        document.addEventListener('keydown', onKey, true);
        addEventListener('resize', close);
        _ddActive = api;
    }
    function close() {
        if (!pop) return;
        document.removeEventListener('mousedown', onOutside, true);
        document.removeEventListener('keydown', onKey, true);
        removeEventListener('resize', close);
        pop.remove(); pop = scroller = spacer = rowsEl = null;
        if (_ddActive === api) _ddActive = null;
    }

    const api = {
        get value() { return value; },
        set value(v) { value = v == null ? null : String(v); syncLabel(); if (pop) renderRows(); },   // programmatic set: no onChange, like <select>
        get hidden() { return host.hidden; },
        set hidden(h) { host.hidden = !!h; if (h) close(); },
        setItems(list, current) {                          // items: [[value, label], ...]
            items = list;
            if (current !== undefined) value = current == null ? null : String(current);
            syncLabel();
            if (pop) { if (!items.length) close(); else { size(); renderRows(); } }
        },
        close,
    };
    btn.onclick = () => (pop ? close() : open());
    btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); open(); } };
    return api;
}

function _fillSelect(sel, items, current) { // items: [[value, label], ...]
    sel.textContent = '';
    for (const [value, label] of items) sel.add(new Option(label, value));
    if (current !== undefined) sel.value = current;
}

function setCircleStyle(id) {
    if (!CIRCLE_STYLES[id]) return;
    const cfg = core.config;
    core.setConfig({ ...cfg, circle: { ...cfg.circle, style: id, params: {} } });
}

function initSelectors() {                                     // still called where the old onclick lines were
    const circleId = CIRCLE_STYLES[core.config.circle.style] ? core.config.circle.style : 'sweep';
    presetSel.setItems(PRESET_ORDER.filter((k) => PRESETS[k]).map((k) => [k, PRESETS[k].label || k]), currentPreset);
    vizSel.setItems(VIZ_ORDER.map((k) => [k, k.toUpperCase()]), VIZ_ORDER[vizIndex]);
    circleSel.setItems(Object.keys(CIRCLE_STYLES).map((k) => [k, CIRCLE_STYLES[k].label || k]), circleId);
}

// ═══════════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════

// ── Seekbar listeners ───────────────────────────────────────
seekBar.addEventListener('pointerdown', () => { isSeeking = true; });
seekBar.addEventListener('input', () => {
    if (!audioDuration) return;
    const t = (seekBar.value / 100) * audioDuration;
    timeDisplay.textContent = fmt(t);
    updateLyrics(t);
});
seekBar.addEventListener('change', () => {
    isSeeking = false;
    if (!audioDuration) return;
    seekTo(parseFloat(seekBar.value));
});
seekBar.addEventListener('pointerup', () => { isSeeking = false; });

// ── Button listeners ──────────────────────────────────────────────
playBtn.onclick   = togglePlay;
resetBtn.onclick  = resetAudio;
// modeBtn.onclick   = toggleMode;
arBtn.onclick     = toggleAR;
lcBtn.onclick     = cycleLyricsCircle;
plBtn.onclick     = plPick;
scanBtn.onclick   = toggleScan;
exportBtn.onclick = exportMp4;
beatSens.oninput  = () => LiveBands.setSensitivity(beatSens.value);         
beatSens.onchange = () => beatSens.blur();                                  
const presetSel = makeDropdown('presetSel', { onChange: (v) => applyPreset(v) });
const vizSel    = makeDropdown('vizSel',    { onChange: (v) => { vizIndex = VIZ_ORDER.indexOf(v); buildVisualizer(v); } });
const circleSel = makeDropdown('circleSel', { onChange: (v) => setCircleStyle(v) });
const trackSel  = makeDropdown('trackSel',  {
    onChange: (v) => plPlay(+v),
    onRemove: (v) => plRemove(+v),
    tools: [
        { label: 'A\u2193Z',  title: 'Sort A-Z / Z-A',    run: plSort  },
        { label: '\u00d7 all', title: 'Remove all tracks', run: plClear },
    ],
});
initSelectors();

// ── Resize observer — keeps dust canvas sized to screen ──────────
const _resizeObs = new ResizeObserver(() => {
    resizeMasterCanvas();
    _readPresetVars();
    _readVizVars();
});
_resizeObs.observe(screenEl);

// ── Spectrum Circle Drag handlers ─────────────────────────────────────────
// free-floating drag — position persists across lyrics/circle toggles
// within the session (destroy() only clears the canvas child, not the wrap's
// own inline position).
(function enableCircleDrag() {
    let dragging = false, offX = 0, offY = 0;
    circleOuter.addEventListener('pointerdown', (e) => {
        dragging = true;
        circleOuter.classList.add('dragging');
        circleOuter.setPointerCapture(e.pointerId);
        const rect = circleOuter.getBoundingClientRect();
        offX = e.clientX - rect.left;
        offY = e.clientY - rect.top;
        circleOuter.style.left = rect.left + 'px';
        circleOuter.style.top  = rect.top + 'px';
        circleOuter.style.transform = 'none';
    });
    circleOuter.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const pr = screenEl.getBoundingClientRect();
        circleOuter.style.left = (e.clientX - pr.left - offX) + 'px';
        circleOuter.style.top  = (e.clientY - pr.top  - offY) + 'px';
    });
    const endDrag = () => { dragging = false; circleOuter.classList.remove('dragging'); };
    circleOuter.addEventListener('pointerup', endDrag);
    circleOuter.addEventListener('pointercancel', endDrag);
})();

(function enableCircleResize() {
    const MIN_SIZE = 60, MAX_SIZE = 1620;
    const ZOOM_SENSITIVITY = 0.0015;   // wheel: size *= 1 + deltaY * sensitivity
    const PINCH_MIN_STEP   = 0.5;      // ignore pinch changes smaller than this
    const handle = document.getElementById('circleResizeHandle'); // static HTML, not created/destroyed dynamically
    let resizing = false, startSize = 280, startX = 0, startY = 0;
    let pinchStartDist = 0, pinchStartSize = 280;
    // Shared clamp + apply. Every input path routes through here so
    // MIN_SIZE/MAX_SIZE are enforced in one place.
    function applySize(px) {
        const next = Math.max(MIN_SIZE, Math.min(MAX_SIZE, px));
        circleOuter.style.width  = next + 'px';
        circleOuter.style.height = next + 'px';
        return next;
    }
    // ── Drag (corner handle) ─────────────────────────────────────
    handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // don't also trigger the wrap's own drag handler
        resizing = true;
        handle.setPointerCapture(e.pointerId);
        startSize = circleOuter.getBoundingClientRect().width;
        startX = e.clientX; 
        startY = e.clientY;
    });
    handle.addEventListener('pointermove', (e) => {
        if (!resizing) return;
        const delta = Math.max(e.clientX - startX, e.clientY - startY);
        // const next = Math.min(MAX_SIZE, Math.max(MIN_SIZE, startSize + delta));
        // circleOuter.style.width = next + 'px';
        // circleOuter.style.height = next + 'px';
        applySize(startSize + delta);
    });
    const end = () => { resizing = false; };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    // ── Wheel zoom ───────────────────────────────────────────────
    // Attached to the container (the whole circle area), not the handle,
    // so the user can scroll anywhere over the circle to zoom.
    // deltaY > 0 = scroll down = shrink; deltaY < 0 = scroll up = grow.
    // Exponential form (size *= factor) is smoother over a range than
    // additive (size += delta), and symmetric: equal scroll in either
    // direction produces equal reciprocal scaling.
    circleOuter.addEventListener('wheel', (e) => {
        e.preventDefault();   // stop page scroll
        const current = circleOuter.getBoundingClientRect().width;
        const factor  = 1 - e.deltaY * ZOOM_SENSITIVITY;
        applySize(current * factor);
    }, { passive: false });   // passive:false required for preventDefault

    // ── Pinch zoom ───────────────────────────────────────────────
    // Two-finger touch. On pointerdown we record the distance between
    // the two touches and the current size; on move we scale the size
    // by the ratio of current distance to start distance.
    // Uses touch events (not pointer events) because pointer events
    // don't give a clean "which pointers are down" state across browsers.
    let pinchActive = false;

    circleOuter.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 2) return;
        pinchActive = true;
        pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartSize = circleOuter.getBoundingClientRect().width;
        e.preventDefault();   // prevent browser's own pinch-zoom of the page
    }, { passive: false });

    circleOuter.addEventListener('touchmove', (e) => {
        if (!pinchActive || e.touches.length !== 2) return;
        e.preventDefault();
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        if (pinchStartDist < PINCH_MIN_STEP) return;   // guard divide-by-near-zero
        const ratio = dist / pinchStartDist;
        applySize(pinchStartSize * ratio);
    }, { passive: false });

    const endPinch = (e) => {
        if (e.touches.length < 2) {
            pinchActive = false;
            pinchStartDist = 0;
        }
    };
    circleOuter.addEventListener('touchend', endPinch);
    circleOuter.addEventListener('touchcancel', endPinch);
})();

// ── Boot ──────────────────────────────────────────────────────────
applyPreset(PRESET_ORDER[0]);
bpmDisplay.textContent = `${bpm} BPM`;
resizeMasterCanvas();
updateLyrics(0);
requestAnimationFrame(displayLoop);
buildVisualizer(VIZ_ORDER[vizIndex]);
setLyricsCircleMode(lyricsCircleMode);

// ── Cleanup on unload ─────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
    Object.values(effectRemovalTimers).forEach(id => clearTimeout(id));
    if (animFrameId)    cancelAnimationFrame(animFrameId);
    if (sourceNode)     { try { sourceNode.stop(); } catch (_) {} }
    if (audioContext)   audioContext.close();
    if (vizs)           vizs.destroy();
    _resizeObs.disconnect();
});

// ── Cleanup on unload ─────────────────────────────────────────────
(function initStudioLink() {
    if (!window.opener) return;                                  // opened standalone: nothing to link
    window.addEventListener('message', async (event) => {
        const data = event.data;
        if (!data || data.cmd !== 'mp4-export' || event.source !== window.opener) return;
        try {
            if (data.file) await applyAudioFile(data.file);
            exportMp4();                                         // opens the quality picker; progress is reported by exportMp4 itself
        } catch (err) {
            _notifyOpener({ cmd: 'mp4-export-error', message: String(err && err.message || err) });
        }
    });
    _notifyOpener({ cmd: 'template-ready' });
})();
</script>
