<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FIZX · DOX_BEST</title>
    <style>
        /* ── DESIGN TOKENS (defaults overwritten at runtime by applyPreset) ── */
        :root {
            --bg-body:       #030603;
            --bg-container:  linear-gradient(145deg,#141a14,#0a0f0a);
            --bg-screen:     #0a0e0a;
            --border-screen: #2a4a2a;
            --color-primary: #1eff00;
            --color-dim:     #3c9e3c;
            --color-faint:   #2a8a2a;
            --color-muted:   #3a7a3a;
            --shadow-screen: inset 0 0 25px rgba(0,255,0,0.06);
            --shadow-outer:  0 0 0 2px #1a3a1a,0 20px 40px rgba(0,0,0,0.5);
            --bg-stats:      #0a0c0a;
            --bg-btn:        #1a2a1a;
            --border-btn:    #3c9e3c;
            --color-btn:     #aaffaa;
            --flash-color:   rgba(0,255,0,0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New','Fira Code',monospace;
            transition: background 0.5s ease;
        }

        /* ── STAGE ────────────────────────────────────────────────────
           9:16 default. .ar-landscape flips to 16:9.
           max-width = min() prevents overflow on both axes.
        ── */
        .stage {
            aspect-ratio: 9 / 16;
            max-width: min(100vw, calc(100vh * 9 / 16));
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-outer);
            transition: box-shadow 0.5s ease, max-width 0.3s ease, aspect-ratio 0.3s ease;
        }
        .stage.ar-landscape {
            aspect-ratio: 16 / 9;
            max-width: min(100vw, calc(100vh * 16 / 9));
        }

        .container {
            width: 100%;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            padding: 1px 2px 14px 2px;
            transition: background 0.5s ease;
        }

        /* ── SCREEN ──────────────────────────────────────────────────── */
        .screen {
            flex: 1;
            background: var(--bg-screen);
            border-radius: 10px;
            box-shadow: var(--shadow-screen);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-screen);
            margin-bottom: 6px;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* CRT scanlines — only active when preset sets --crt-on:1
           toggled via .crt-on class by applyPreset() */
        .screen.crt-on::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,255,0,0.04) 0px, rgba(0,255,0,0.04) 2px,
                transparent 2px, transparent 5px
            );
            pointer-events: none;
            z-index: 5;
        }
        .screen.crt-on::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Screen flash — color driven by --flash-color CSS var.
           applyPreset() sets this per-preset so the flash is always
           theme-appropriate without any JS branching. */
        @keyframes kScreenFlash {
            0%  { box-shadow: inset 0 0 60px var(--flash-color), 0 0 20px var(--flash-color); }
            100%{ box-shadow: var(--shadow-screen); }
        }
        .screen.screen-flash { animation: kScreenFlash 0.12s ease-out; }

        /* ── LYRIC AREA ──────────────────────────────────────────────── */
        .lyric-area {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 30px 20px 80px 20px;
        }

        .current-line {
            font-size: clamp(2.5rem, 6vw, 3rem);
            font-weight: bold;
            color: var(--color-primary);
            text-shadow: 0 0 5px var(--color-dim), 0 0 8px var(--color-faint);
            margin-bottom: 16px;
            line-height: 1.4;
            /* GPU hint — this element is animated on every beat */
            will-change: transform, opacity, filter;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .next-line {
            font-size: clamp(0.5rem, 3vw, 1rem);
            color: var(--color-dim);
            opacity: 0.7;
            border-top: 1px dashed var(--color-faint);
            padding-top: 15px;
            transition: color 0.5s ease, border-color 0.5s ease;
        }

        /* ── VISUALIZER WRAP ─────────────────────────────────────────── */
        .visualizer-wrap {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            /* GPU hint — canvas is composited independently */
            will-change: transform, opacity;
        }
        .visualizer-wrap.viz-off { display: none; }

        /* ── DUST ────────────────────────────────────────────────────── */
        .dust-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            filter: blur(1px);
            /* GPU hint — dust is always animating */
            will-change: transform, opacity;
        }
        @keyframes kFloatUp {
            0%  { transform:translateY(0) translateX(0);         opacity:0; }
            20% { opacity:0.5; }
            80% { opacity:0.2; }
            100%{ transform:translateY(-100px) translateX(30px); opacity:0; }
        }

        /* ── STATUS BAR ──────────────────────────────────────────────── */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--color-faint);
            font-size: 8px;
            background: var(--bg-stats);
            padding: 4px 10px;
            border-radius: 20px;
            /*margin-top: 5px;*/
            font-family: monospace;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* ── CONTROLS ────────────────────────────────────────────────── */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        /* Icon-only circular buttons — tooltip via data-tip + ::after */
        button {
            background: var(--bg-btn);
            border: 1px solid var(--border-btn);
            color: var(--color-btn);
            font-family: monospace;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: filter 0.1s, box-shadow 0.1s, border-color 0.4s, color 0.4s, background 0.4s;
        }
        button:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 8px var(--color-primary);
        }
        button::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--color-btn);
            font-size: 7px;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            border: 1px solid var(--border-btn);
        }
        button:hover::after { opacity: 1; }

        .controls-row-main { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
        }

        /* Util buttons — pill shape, smaller text */
        button.btn-util {
            width: auto;
            height: 20px;
            border-radius: 10px;
            font-size: 0.6rem;
            padding: 0 8px;
            margin-top: 14px;
        }
        button.btn-util:hover::after { bottom:calc(100% + 4px); }

        .status-text {
            font-size: 7px;
            text-align: center;
            margin-top: 4px;
            color: var(--color-muted);
            font-family: monospace;
            transition: color 0.5s ease;
        }

        /* ── PRESET STYLES INJECTION POINT ──────────────────────────────
           compile.py replaces this block with CSS extracted from
           each preset's `styles` property in presets.js.
           The template itself contains ZERO theme-specific CSS.
        ── */
        /* @@STYLES@@ */
/* ── RAP ── */
@keyframes kShake {
                0%  { transform:translate(0,0);      text-shadow:0 0 3px #0f0; }
                25% { transform:translate(-2px,1px); text-shadow:2px 0 #ff00aa; }
                50% { transform:translate(2px,-1px); text-shadow:-2px 0 #0effff; }
                75% { transform:translate(-1px,1px); }
                100%{ transform:translate(0,0);      text-shadow:0 0 5px #1eff00; }
            }
            @keyframes kGlitch {
                0%  { text-shadow:-1px 0 #ff00aa,1px 0 #00ffff; opacity:1; }
                50% { text-shadow:2px 0 #ff00aa,-2px 0 #00ffff; opacity:0.9; }
                100%{ text-shadow:0 0 5px #1eff00; opacity:1; }
            }
            @keyframes kChroma {
                0%  { filter:none; text-shadow:0 0 0 transparent; }
                30% { text-shadow:-4px 0 #ff0044,4px 0 #00ffcc; filter:brightness(1.4); }
                60% { text-shadow:3px 0 #ff0044,-3px 0 #00ffcc; }
                100%{ filter:none; text-shadow:0 0 5px #1eff00; }
            }
            @keyframes kFlicker {
                0%  { opacity:1; }  15%{ opacity:0.2; } 30%{ opacity:1; }
                50% { opacity:0.5;} 65%{ opacity:1;  } 80%{ opacity:0.3; } 100%{ opacity:1; }
            }
            @keyframes kZoom {
                0%  { transform:scale(1); }
                40% { transform:scale(1.08); }
                100%{ transform:scale(1); }
            }
            @keyframes kScanWipe {
                0%  { background-position:0 -100%; }
                100%{ background-position:0 200%; }
            }
            .screen.crt-on.scan-active::before {
                background:
                    repeating-linear-gradient(0deg,
                        rgba(0,255,0,0.04) 0px,rgba(0,255,0,0.04) 2px,
                        transparent 2px,transparent 5px),
                    linear-gradient(to bottom,transparent 0%,rgba(0,255,0,0.18) 50%,transparent 100%);
                background-size:100% 100%,100% 30%;
                animation:kScanWipe 0.25s linear;
            }
            .fx-shake   { animation:kShake   0.08s ease-in-out; }
            .fx-glitch  { animation:kGlitch  0.12s 2; }
            .fx-chroma  { animation:kChroma  0.18s ease-out; }
            .fx-flicker { animation:kFlicker 0.20s linear; }
            .fx-zoom    { animation:kZoom    0.15s ease-out; }

/* ── ETHEREAL ── */
@keyframes kDrift {
                0%  { transform:translateY(-5px); opacity:0.7; }
                100%{ transform:translateY(0);    opacity:1; }
            }
            @keyframes kBreathe {
                0%  { letter-spacing:0.08em; opacity:0.7; filter:blur(0.8px); }
                100%{ letter-spacing:normal;  opacity:1;  filter:none; }
            }
            @keyframes kEtherealAurora {
                0%  { text-shadow:0 0 18px #c084fc,0 0 36px #a855f7; }
                60% { text-shadow:0 0 8px #818cf8,0 0 16px #6366f1; }
                100%{ text-shadow:0 0 5px #a855f7; }
            }
            @keyframes kDissolve {
                0%  { opacity:0.45; filter:blur(2.5px); }
                50% { opacity:0.8;  filter:blur(0.5px); }
                100%{ opacity:1;    filter:none; }
            }
            @keyframes kFloat {
                0%  { transform:scale(1.05) translateY(-4px); }
                100%{ transform:scale(1)    translateY(0); }
            }
            .fx-drift    { animation:kDrift         0.25s ease-out; }
            .fx-breathe  { animation:kBreathe        0.30s ease-out; }
            .fx-aurora   { animation:kEtherealAurora 0.35s ease-out; }
            .fx-dissolve { animation:kDissolve       0.28s ease-out; }
            .fx-float    { animation:kFloat          0.22s ease-out; }
/* @@END_STYLES@@ */
    </style>
</head>
<body>
<div class="stage" id="stage">
    <div class="container">
        <div class="screen" id="screen">
            <div class="lyric-area">
                <div class="current-line" id="currentLine">⚡ FIZX READY ⚡</div>
                <div class="next-line"    id="nextLine">▶ select audio file</div>
            </div>
            <div class="visualizer-wrap" id="visualizerWrap"></div>
        </div>

        <div class="stats">
            <span id="statusMsg">click ▶ to load audio</span>
            <span id="timeDisplay">0:00</span>
            <span id="bpmDisplay">-- BPM</span>
        </div>

        <div class="controls">
            <div class="controls-row-main">
                <!-- data-tip = tooltip shown on hover -->
                <button class="btn-util" id="arBtn"    data-tip="Aspect ratio">⊞ 16:9</button>
                <button id="playBtn"   data-tip="Play / Pause">▶</button>
                <button id="resetBtn"  data-tip="Reset + new file">⟳</button>
                <button id="modeBtn"   data-tip="Sync mode A/B">⇄</button>
                <button id="presetBtn" data-tip="Switch preset">🎨</button>
                <button class="btn-util" id="vizBtn"   data-tip="Visualizer">◎</button>
            </div>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// INJECTED BLOCKS
// compile.py replaces each /* @@TAG@@ */ ... /* @@END_TAG@@ */ block.
// ═══════════════════════════════════════════════════════════════════

/* @@VISUALIZERS@@ */
const CANVAS_SCALE = 2.6;


const ROOT_STYLE = document.documentElement;







function readVizVars() {
    const s = getComputedStyle(ROOT_STYLE);
    return {
        color:     s.getPropertyValue('--viz-color').trim()     || '#ffffff',
        glow:      s.getPropertyValue('--viz-glow').trim()      || 'rgba(255,255,255,0.4)',
        secondary: s.getPropertyValue('--viz-secondary').trim() || 'rgba(255,255,255,0.2)',
    };
}




function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
}



function easeOutSine(t) { return Math.sin((t * Math.PI) / 2); }







class BaseVisualizer {
    constructor(wrap) {
        this.wrap   = wrap;
        this.canvas = null;
        this.ctx    = null;
        this._rafId = null;
        this._init();
    }

    
    _init() { throw new Error('BaseVisualizer._init() must be implemented'); }

    
    pulse() { throw new Error('BaseVisualizer.pulse() must be implemented'); }

    
    
    _cleanup() {}

    
    
    
    
    
    
    
    
    
    destroy() {
        this._cleanup();

        if (this._rafId) {
            cancelAnimationFrame(this._rafId);
            this._rafId = null;
        }

        if (this.canvas) {
            if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            this.canvas.width  = 0;
            this.canvas.height = 0;
            if (this.canvas.parentNode) this.canvas.parentNode.removeChild(this.canvas);
            this.canvas = null;
            this.ctx    = null;
        }

        this.wrap = null;
    }

    
    
    _makeCanvas(w, h) {
        
        this.wrap.innerHTML = '';
        const canvas = document.createElement('canvas');
        canvas.width  = w;
        canvas.height = h;
        
        canvas.style.cssText = `width:${w}px;height:${h}px;display:block;`;
        
        canvas.style.willChange = 'transform, opacity';
        this.wrap.appendChild(canvas);
        this.canvas = canvas;
        this.ctx    = canvas.getContext('2d');
        return canvas;
    }
}









class RingVisualizer extends BaseVisualizer {
    _init() {
        this.scale   = 1;
        this.BASE    = 60;
        this.MAX     = 1.65;
        this.DECAY   = 0.88; 
        this.RING_W  = 3;
        const sz     = this.BASE * CANVAS_SCALE;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        
        this.scale = this.MAX;
    }

    _loop() {
        if (!this.canvas) return;
        this.scale = 1 + (this.scale - 1) * this.DECAY;
        this._draw();
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _draw() {
        const { canvas, ctx, scale, BASE, RING_W } = this;
        const { color, glow } = readVizVars();
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const r  = (BASE / 2) * scale;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth   = RING_W;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 6 + (scale - 1) * 30;
        ctx.globalAlpha = Math.min(1, 0.5 + (scale - 1) * 1.5);
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
}








class BloomVisualizer extends BaseVisualizer {
    _init() {
        this.BASE      = 65;
        this.intensity = 0;   
        this.DECAY     = 0.92; 
        this._cycleIdx = 0;
        const sz       = this.BASE * CANVAS_SCALE;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        this.intensity = 1.0; 
        this._cycleIdx = (this._cycleIdx + 1) % 4;
    }

    _loop() {
        if (!this.canvas) return;
        this.intensity *= this.DECAY;
        this._draw();
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _draw() {
        if (!this.canvas) return;
        const { canvas, ctx, BASE, intensity } = this;
        if (intensity < 0.005) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
        const { glow } = readVizVars();
        const cx = canvas.width / 2, cy = canvas.height / 2;
        
        const r  = (BASE / 2) * (1 + intensity * 0.5);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const aMod = 0.85 + this._cycleIdx * 0.05;

        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.4);
        g.addColorStop(0,    this._a(glow, intensity * 0.85 * aMod));
        g.addColorStop(0.4,  this._a(glow, intensity * 0.55 * aMod));
        g.addColorStop(0.75, this._a(glow, intensity * 0.2));
        g.addColorStop(1,    'rgba(0,0,0,0)');

        ctx.fillStyle   = g;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 20 + intensity * 30;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    
    
    
    _a(rgba, a) { 
        return rgba.replace(/[\d.]+\)$/, `${Math.min(a,1).toFixed(3)})`); 
    }
}










class HeartbeatVisualizer extends BaseVisualizer {
    _init() {
        this._lock    = false;
        this.BASE     = 60;
        this.DURATION = 280; 
        const w = this.BASE * 3, h = this.BASE * 1.2;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._draw(0);
    }

    pulse() {
        
        
        if (this._lock) return;
        this._lock = true;
        const start = performance.now();
        const go = now => {
            if (!this.canvas) return;
            const p = Math.min((now - start) / this.DURATION, 1);
            
            
            const env = p < 0.5
                ? easeOutExpo(p * 2)           
                : 1 - easeOutExpo((p - 0.5)*2); 
            this._draw(env);
            if (p < 1) this._rafId = requestAnimationFrame(go);
            else { this._draw(0); this._lock = false; }
        };
        if (this._rafId) cancelAnimationFrame(this._rafId);
        this._rafId = requestAnimationFrame(go);
    }
    _draw(env) {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow } = readVizVars();
        ctx.clearRect(0, 0, w, h);
        const cy  = h / 2;
        const amp = (h * 0.38) * env;

        
        const profile = x => {
            if (x < 0.25) return 0;
            if (x < 0.32) return -(x - 0.25) / 0.07 * 0.15;
            if (x < 0.38) return  (x - 0.32) / 0.06;
            if (x < 0.42) return 1 - (x - 0.38) / 0.04 * 1.6;
            if (x < 0.46) return -0.6 + (x - 0.42) / 0.04 * 0.6;
            if (x < 0.55) return 0;
            if (x < 0.65) return Math.sin((x - 0.55) / 0.10 * Math.PI) * 0.18;
            return 0;
        };

        ctx.beginPath();
        for (let px = 0; px < w; px++) {
            const y = cy - profile(px / w) * amp;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth   = 1.5;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 4 + amp * 0.4;
        ctx.globalAlpha = 0.4 + env * 0.6;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    _cleanup() { this._lock = false; }
}









class RippleVisualizer extends BaseVisualizer {
    _init() {
        this._rings   = [];
        this.BASE     = 50;
        this.MAX_RINGS= 4;
        this.DURATION = 600; 
        const sz      = this.BASE * CANVAS_SCALE;
        this.sz       = sz;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        if (this._rings.length >= this.MAX_RINGS) this._rings.shift();
        
        this._rings.push({ t0: performance.now() - this.DURATION * 0.08, dur: this.DURATION });
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, sz, BASE } = this;
        const { color, glow } = readVizVars();
        const cx = sz / 2, cy = sz / 2;
        const maxR = (BASE / 2) * 2.2;
        ctx.clearRect(0, 0, sz, sz);
        const now = performance.now();
        this._rings = this._rings.filter(ring => {
            const p = (now - ring.t0) / ring.dur;
            if (p >= 1) return false;
            const r = maxR * easeOutSine(p);
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth   = 1.8 * (1 - p * 0.6);
            ctx.shadowColor = glow;
            ctx.shadowBlur  = 14 * (1 - p);
            ctx.globalAlpha = (1 - p) * 0.8;
            ctx.stroke();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            return true;
        });
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _cleanup() { this._rings = []; }
}









class WaveformVisualizer extends BaseVisualizer {
    _init() {
        this._amp   = 0;
        this._phase = 0;
        this.MAX_AMP  = 16;
        this.FREQ     = 3;
        this.DECAY    = 0.91; 
        const w = 60*3, h = 60*1.4;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._loop();
    }

    pulse() {
        this._amp = this.MAX_AMP; 
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow } = readVizVars();
        const cy = h / 2;

        this._amp   *= this.DECAY;
        this._phase += 0.05; 

        ctx.clearRect(0, 0, w, h);
        ctx.beginPath();
        for (let px = 0; px <= w; px++) {
            const x   = px / w;
            const env = Math.sin(x * Math.PI); 
            const y   = cy - Math.sin(x * Math.PI * 2 * this.FREQ + this._phase) * this._amp * env;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        const intensity = this._amp / this.MAX_AMP;
        ctx.strokeStyle = color;
        ctx.lineWidth   = 2;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = 4 + intensity * 16;
        ctx.globalAlpha = 0.35 + intensity * 0.65;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;

        this._rafId = requestAnimationFrame(() => this._loop());
    }
}










class ParticlesVisualizer extends BaseVisualizer {
    _init() {
        this._particles = [];
        this.MAX_P    = 72;
        this.PER_BURST= 14; 
        this.BASE     = 60;
        const sz = this.BASE * CANVAS_SCALE;
        this.sz  = sz;
        this._makeCanvas(sz, sz);
        this._loop();
    }

    pulse() {
        const { sz, MAX_P, PER_BURST, BASE } = this;
        const cx = sz / 2, cy = sz / 2;
        
        if (this._particles.length + PER_BURST > MAX_P) {
            this._particles.splice(0, PER_BURST); 
        }
        for (let i = 0; i < PER_BURST; i++) {
            const angle = (Math.PI * 2 / PER_BURST) * i + (Math.random() - 0.5) * 0.5;
            const spd   = BASE * 0.016 + Math.random() * BASE * 0.018;
            this._particles.push({
                x: cx, y: cy,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                r: 1.5 + Math.random() * 2.5,
                life: 1.0,
                decay: 0.022 + Math.random()*0.014, 
            });
        }
    }

    _loop() {
        if (!this.canvas) return;
        const { ctx, sz } = this;
        const { color, glow } = readVizVars();
        ctx.clearRect(0, 0, sz, sz);
        this._particles = this._particles.filter(p => {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.94; p.vy *= 0.94;
            p.life -= p.decay;
            if (p.life <= 0) return false;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
            ctx.fillStyle   = color;
            ctx.shadowColor = glow;
            ctx.shadowBlur  = 5;
            ctx.globalAlpha = p.life * 0.9;
            ctx.fill();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            return true;
        });
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _cleanup() { this._particles = []; }
}









class DNAVisualizer extends BaseVisualizer {
    _init() {
        this.BASE     = 60;
        this._restAmp = this.BASE * 0.10;
        this._maxAmp  = this.BASE * 0.44;
        this._amp     = this._restAmp;
        this.DECAY    = 0.93;
        this._phase   = 0;
        const w = this.BASE*3, h = this.BASE*1.4;
        this.w = w; this.h = h;
        this._makeCanvas(w, h);
        this._loop();
    }

    pulse() { this._amp = this._maxAmp; }

    _loop() {
        if (!this.canvas) return;
        const { ctx, w, h } = this;
        const { color, glow, secondary } = readVizVars();
        const cy    = h / 2;
        const freq  = 2.5;
        const rungs = 8;

        
        this._amp   = this._restAmp + (this._amp - this._restAmp) * this.DECAY;
        this._phase += 0.03;

        ctx.clearRect(0, 0, w, h);

        const norm  = (this._amp - this._restAmp) / (this._maxAmp - this._restAmp);
        const gBlur = norm * 16;
        const alpha = 0.4 + norm * 0.5;

        
        this._strand(ctx, w, cy, freq, 0,       color,     gBlur,       alpha,       glow);
        
        this._strand(ctx, w, cy, freq, Math.PI, secondary, gBlur * 0.6, alpha * 0.65, glow);

        
        ctx.strokeStyle = color;
        ctx.lineWidth   = 0.9;
        ctx.globalAlpha = alpha * 0.3;
        ctx.shadowColor = glow;
        ctx.shadowBlur  = gBlur * 0.4;
        for (let i = 0; i <= rungs; i++) {
            const xN = i / rungs;
            const y1 = cy - Math.sin(xN * Math.PI * 2 * freq + this._phase) * this._amp;
            const y2 = cy - Math.sin(xN * Math.PI * 2 * freq + this._phase + Math.PI) * this._amp;
            ctx.beginPath(); ctx.moveTo(xN * w, y1); ctx.lineTo(xN * w, y2); ctx.stroke();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _strand(ctx, w, cy, freq, offset, strokeColor, glowBlur, alpha, shadowColor) {
        ctx.beginPath();
        for (let px = 0; px <= w; px++) {
            const y = cy - Math.sin((px / w) * Math.PI * 2 * freq + this._phase + offset) * this._amp;
            px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
        }
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth   = 1.5;
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur  = glowBlur;
        ctx.globalAlpha = alpha;
        ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
}

// VISUAL TRIGGER
// Called once per scheduled beat. Picks a random effect from the
// active preset pool, applies it to .current-line, and pulses the
// active visualizer.
//
// DEBOUNCE:
//   effectRemovalTimers tracks the pending "remove class" timer per
//   className. If the same effect fires again before expiry, the
//   stale removal timer is cancelled first. Without this, fast beats
//   cause the class to be removed mid-animation by the old timer,
//   creating a stutter where the animation starts then abruptly stops.
//
// TIMER TRACKING:
//   All setTimeouts pushed to activeVisualTimers so resetAudio() can
//   clear them. This closes the leak in the previous implementation.
// ═══════════════════════════════════════════════════════════════════
function triggerVisual() {
    const p      = PRESETS[currentPreset];
    const effect = p.effects[Math.floor(Math.random() * p.effects.length)];

    // Debounce: clear stale removal timer for this class before restarting
    if (effectRemovalTimers[effect.className]) {
        clearTimeout(effectRemovalTimers[effect.className]);
        delete effectRemovalTimers[effect.className];
    }

    // void offsetWidth: forces browser to reflow, ensuring the class
    // removal + re-add is treated as a fresh animation start.
    // Without this, if the same class is re-added before the browser
    // commits the removal, the animation does not restart.
    currentLineEl.classList.remove(effect.className);
    void currentLineEl.offsetWidth; // Force reflow — critical for animation restart
    currentLineEl.classList.add(effect.className);

    // Schedule class removal; track the timer ID for cleanup on reset
    const removeId = setTimeout(() => {
        currentLineEl.classList.remove(effect.className);
        delete effectRemovalTimers[effect.className];
        const idx = activeVisualTimers.indexOf(removeId);
        if (idx !== -1) activeVisualTimers.splice(idx, 1);
    }, effect.duration + 20);
    activeVisualTimers.push(removeId);
    effectRemovalTimers[effect.className] = removeId;

    if (effect.useFlash) {
        // Rotate flash color if preset uses flashCycle
        if (p.flashCycle && p.flashCycleColors && p.flashCycleColors.length) {
            flashCycleIdx = (flashCycleIdx + 1) % p.flashCycleColors.length;
            document.documentElement.style.setProperty('--flash-color', p.flashCycleColors[flashCycleIdx]);
        }
        screenEl.classList.remove('screen-flash');
        void screenEl.offsetWidth; // reflow guard — same reason as above
        screenEl.classList.add('screen-flash');
        const flashId = setTimeout(() => {
            screenEl.classList.remove('screen-flash');
            const idx = activeVisualTimers.indexOf(flashId);
            if (idx !== -1) activeVisualTimers.splice(idx, 1);
        }, 150);
        activeVisualTimers.push(flashId);
    }

    if (effect.useScan && screenEl.classList.contains('crt-on')) {
        screenEl.classList.add('scan-active');
        const scanId = setTimeout(() => {
            screenEl.classList.remove('scan-active');
            const idx = activeVisualTimers.indexOf(scanId);
            if (idx !== -1) activeVisualTimers.splice(idx, 1);
        }, 280);
        activeVisualTimers.push(scanId);
    }

    if (vizs) vizs.pulse();

// BEAT SCHEDULER
// AudioContext-anchored setTimeout per beat.
// t0 = AudioContext.currentTime sampled at play().then() resolution.
// This absorbs browser audio startup latency automatically — the gap
// between .play() call and the then() callback is the hardware latency,
// and by sampling t0 there rather than before .play(), it is baked in.
//
// Timer IDs stored in scheduledTimers for full cleanup on reset.
// ═══════════════════════════════════════════════════════════════════
function scheduleAll(timestamps) {
    clearScheduled();
    const atx = audioContext.currentTime;
    timestamps.forEach(ts => {
        const ms = (t0 + ts - atx) * 1000;
        if (ms < 0) return; // already past (e.g. resume after seek)
        const id = setTimeout(triggerVisual, ms);
        scheduledTimers.push(id);
    });
}

function clearScheduled() {
    scheduledTimers.forEach(id => clearTimeout(id));
    scheduledTimers.length = 0; // in-place clear — avoids reallocation
}

// AUDIO LIFECYCLE
// ═══════════════════════════════════════════════════════════════════
async function setupAudio(file) {
    const url = URL.createObjectURL(file);
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }

    // Close existing AudioContext before creating a new one.
    // Browsers accumulate "ghost" suspended contexts if not explicitly

    // await ensures closure completes before new context is created.
    if (audioContext) {

        audioContext = null;
    }

    audio = new Audio(url);
    audio.preload = 'auto';
    audioContext  = new (window.AudioContext || window.webkitAudioContext)();

    return new Promise(resolve => {
        audio.onloadeddata = () => { bpmDisplay.textContent = `${bpm} BPM`; resolve(); };
        audio.onerror      = () => { statusMsg.textContent = `❌ load error`; resolve(); };
        audio.onended      = () => { isPlaying = false; playBtn.textContent = '▶'; };
    });
}

function selectAudio() {
    const input  = document.createElement('input');
    input.type   = 'file';
    input.accept = 'audio/mpeg,audio/wav,audio/ogg,audio/mp3';
    input.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        statusMsg.textContent = `⏳ ${file.name.slice(0, 28)}…`;
        await setupAudio(file);
        updateLyrics(0);
        timeDisplay.textContent = fmt(0);
        statusMsg.textContent   = `✅ ${beatTimestamps.length} beats · ${LYRICS.length} lines`;
    };
    input.click();
}

// ── Play / Pause ──────────────────────────────────────────────────
async function togglePlay() {
    if (!audio) { selectAudio(); return; }

    if (isPlaying) {
        audio.pause();
        clearScheduled();
        isPlaying = false;
        playBtn.textContent   = '▶';
        statusMsg.textContent = `⏸ ${fmt(audio.currentTime)}`;
        return;
    }

    if (audio.ended) audio.currentTime = 0;
    if (audioContext.state === 'suspended') await audioContext.resume();

    audio.play().then(() => {
        // t0 sampled here — inside then() — so it includes startup latency.
        // making setTimeout alignment accurate even on slow devices
        // All beat delays computed as (t0 + beatTs - audioContext.currentTime).
        t0 = audioContext.currentTime;

        // On resume, filter to only future timestamps so we don't reschedule
        // callbacks that already fired before the pause.
        const elapsed = audio.currentTime;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        scheduleAll(source);

        isPlaying = true;
        playBtn.textContent   = '⏸';
        statusMsg.textContent = `▶ ${PRESETS[currentPreset].label} · ${currentMode} · ${source.length}`;
    }).catch(() => { statusMsg.textContent = `⚠️ tap again`; });
}

// ── Reset ─────────────────────────────────────────────────────────
// Full teardown sequence — the order matters:
//   1. Stop audio + revoke blob URL
//   2. Clear ALL timers (scheduled beats + visual effect timers)
//   3. Cancel display rAF — stops canvas loops immediately
//   4. Close AudioContext — prevents ghost context accumulation
//   5. Destroy visualizer — releases GPU buffers
//   6. Reset UI state
//   7. Re-trigger file picker
async function resetAudio() {
    // 1. Audio
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }

    // 2. All timers — beats + visual effects + effect debounce registry
    clearScheduled();
    activeVisualTimers.forEach(id => clearTimeout(id));
    activeVisualTimers.length = 0;
    Object.keys(effectRemovalTimers).forEach(k => {
        clearTimeout(effectRemovalTimers[k]);
        delete effectRemovalTimers[k];
    });

    // 3. Display loop
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

    // 4. AudioContext — await ensures DSP resources are released before
    //    a new context might be created by setupAudio()
    if (audioContext) { await audioContext.close(); audioContext = null; }

    // 5. Visualizer GPU cleanup
    if (vizs) { vizs.destroy(); vizs = null; }

    // 6. UI state
    t0 = null; isPlaying = false;
    timeDisplay.textContent   = fmt(0);
    bpmDisplay.textContent    = `-- BPM`;
    playBtn.textContent       = '▶';
    currentLineEl.textContent = `⚡ FIZX READY ⚡`;
    nextLineEl.textContent    = `▶ select audio file`;
    statusMsg.textContent     = `⟳ select new file`;

    // Restart display loop — it is display-only so safe to run without audio
    displayLoop();

    // Rebuild visualizer (was destroyed above)
    buildVisualizer(VIZ_ORDER[vizIndex]);

    // 7. New file
    selectAudio();
}

// ── Mode toggle ───────────────────────────────────────────────────

// When toggling during playback, reschedules remaining triggers
// using the new source (beats or lyric starts).
function toggleMode() {
    currentMode = currentMode === 'A' ? 'B' : 'A';
    if (audio && isPlaying && t0 !== null) {
        const elapsed = audioContext.currentTime - t0;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        clearScheduled();
        scheduleAll(source);
    }
    statusMsg.textContent = `MODE ${currentMode}`;
}

// ── Preset toggle ─────────────────────────────────────────────────

// Cycles through PRESET_ORDER. Reschedules triggers during playback
// because preset changes may affect effect pool but NOT timing.
// Note: Rescheduling is defensive — timing doesn't change per preset,
// but the effect selection pool does. No need to reschedule actually.
function togglePreset() {
    const next = PRESET_ORDER[(PRESET_ORDER.indexOf(currentPreset) + 1) % PRESET_ORDER.length];
    applyPreset(next);
    if (audio && isPlaying && t0 !== null) {
        const elapsed = audioContext.currentTime - t0;
        const source  = (currentMode === 'A' ? beatTimestamps : LYRICS.map(l => l.start))
                        .filter(ts => ts > elapsed);
        clearScheduled();
        scheduleAll(source);
    }
}

// ── AR toggle ─────────────────────────────────────────────────────
function toggleAR() {
    isLandscape = !isLandscape;
    stageEl.classList.toggle('ar-landscape', isLandscape);
    arBtn.textContent = isLandscape ? '⊞ 9:16' : '⊞ 16:9';
}

// ── Utilities ─────────────────────────────────────────────────────
function fmt(sec) {
    if (isNaN(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function createDust(color) {
   // Creates floating dust particles with random positions, sizes, and animation delays.
    // Each particle has its own animation — 20 particles = 20 independent animations.
    // This is fine for modern browsers but could be optimized by using a single
    // canvas particle system. Not worth the complexity for this use case.
    for (let i = 0; i < 20; i++) {
        const d  = document.createElement('div');
        const sz = 2 + Math.random() * 4;
        d.classList.add('dust-particle');
        d.style.cssText = `
            width:${sz}px; height:${sz}px; background:${color};
            left:${Math.random()*100}%; bottom:${Math.random()*40}px;
            animation:kFloatUp ${6+Math.random()*12}s infinite linear;
            animation-delay:${Math.random()*10}s;
        `;
        screenEl.appendChild(d);
    }
}

// ── Event listeners ───────────────────────────────────────────────
playBtn.onclick   = togglePlay;
resetBtn.onclick  = resetAudio;
modeBtn.onclick   = toggleMode;
presetBtn.onclick = togglePreset;
arBtn.onclick     = toggleAR;
vizBtn.onclick    = cycleVisualizer;

// ── Boot ──────────────────────────────────────────────────────────
applyPreset(PRESET_ORDER[0]);
bpmDisplay.textContent = `${bpm} BPM`;
updateLyrics(0);
displayLoop();
buildVisualizer(VIZ_ORDER[vizIndex]);

// ── Cleanup on unload ─────────────────────────────────────────────

// Cancels all pending timers, animation frames, and closes audio context.
// This prevents memory leaks when navigating away.
window.addEventListener('beforeunload', () => {
    clearScheduled();
    activeVisualTimers.forEach(id => clearTimeout(id));
    Object.values(effectRemovalTimers).forEach(id => clearTimeout(id));
    if (animFrameId)  cancelAnimationFrame(animFrameId);
    if (audio)        { audio.pause(); }
    if (audioContext) audioContext.close();
    if (vizs)   vizs.destroy();
});
</script>
</body>
</html>
